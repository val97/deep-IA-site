<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot dessine 1</title>
<link rel="stylesheet" href="../../shared/frame.css">
<style>
  /* Robot dessine 1 in the H2 frame (since 26 Nov 2026; before: old/index-avant-h2.html). Anne stays beside the work and
     reacts to every move. 7 screens: ? Pourquoi (her story, the notions) · Avant la séance (the plan, the sheet to print)
     · the 4 steps · ✓ Fin (the takeaways; « Ce que l'activité simplifie » from a button). The games and the data are the
     same as before; « Pour toi » is now three reply buttons, answered in Anne's bubble. */
  .desk { display: flex; flex-direction: column; gap: 14px; overflow: auto; --sh: clamp(220px, calc(100vh - 360px), calc(400 * var(--u))); }
  .desk h2.dt { font-size: calc(15 * var(--u)); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--violet); }
  .pt { font-size: calc(13 * var(--u)); font-weight: 700; color: var(--soft); margin-bottom: 6px; }
  .card-consigne { align-self: flex-start; max-width: 560px; }
  .board { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: 12px; }   /* few items: centred in the desk (layout brief, 26 Nov 2026) */
  .duo { display: flex; gap: clamp(14px, 2vw, 24px); align-items: flex-start; justify-content: center; }
  .duo > * { min-width: 0; }
  .duo > .sheetc { flex: 0 1 auto; }
  .sheetc { padding: 12px 14px 14px; } .sheetc img { display: block; max-width: 100%; height: auto; }
  .sheetc.paper:first-child { rotate: -.5deg; }
  svg.grid { display: block; width: auto; max-width: 100%; touch-action: none; user-select: none; }
  svg.grid .dot { fill: #222; } svg.grid .dot.done { fill: var(--g-deep); }
  svg.grid .hit { fill: transparent; cursor: pointer; } svg.grid .hit:hover { fill: rgba(96, 15, 189, .12); }
  svg.grid text { font: 700 calc(15 * var(--u)) Inter, sans-serif; fill: #333; }
  svg.grid .pen { fill: none; stroke: var(--violet); stroke-width: 3; }
  svg.grid .rubber { stroke-width: 3; stroke-dasharray: 6 6; opacity: .6; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; flex: 1 1 220px; }
  .ask { font-weight: 700; color: var(--g-deep); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; } .opts.col1 { flex-direction: column; }
  .opt { min-height: 44px; padding: 6px 14px; border-radius: 10px; border: 1.5px solid var(--g-deep); background: #fff; color: var(--g-deep); font: 600 calc(15 * var(--u))/1.3 Inter, sans-serif; text-align: left; cursor: pointer; }
  .opt:hover { background: var(--g-tint); }
  .opt.no { border-style: dashed; color: var(--soft); border-color: var(--soft); text-decoration: line-through; cursor: default; }
  .foundbox { padding: 10px 14px; border-radius: 10px; background: var(--g-tint); color: var(--g-deep); font-size: calc(16 * var(--u)); }
  .foundbox b { margin-right: 8px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .plist button { width: 100%; display: grid; grid-template-columns: 26px 14px 1fr; align-items: center; gap: 10px; min-height: 46px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--hair); background: #fff; font: 600 calc(15 * var(--u))/1.3 Inter, sans-serif; color: var(--ink); text-align: left; cursor: pointer; }
  .plist button:hover:not(:disabled) { border-color: var(--g-deep); }
  .plist button:disabled { cursor: default; }
  .plist button.no { border-style: dashed; color: var(--soft); }
  .plist button.bad { border-color: var(--violet); outline: 2px solid var(--violet); }
  .plist button.fixed { border-color: var(--g-main); background: var(--g-tint); }
  .plist code { font: 800 calc(14 * var(--u)) Inter, sans-serif; color: var(--g-deep); }
  .plist .sw { width: 14px; height: 14px; border-radius: 50%; }
  .plist del { color: var(--soft); margin-right: 6px; }
  .trace { padding: 14px 18px; flex: 1; min-width: 280px; }
  .trace .chip.go { margin-top: 12px; }
  .trace ol { margin: 0; padding-left: 22px; display: grid; gap: 10px; font-size: calc(16 * var(--u)); line-height: 1.45; }
  .trace li.todo { color: var(--soft); }
  .trace li.new { animation: rise .45s var(--ease) both; }
  .tshow { padding: 12px 14px; }
  .tfix { display: grid; gap: 6px; justify-items: start; font-size: calc(16 * var(--u)); } .tfix del { color: var(--soft); } .tfix b { color: var(--g-deep); }
  .tfix svg { width: 22px; height: 22px; color: var(--g-deep); }
  .tpair { display: flex; gap: 12px; } .tpair figure { margin: 0; text-align: center; } .tpair figcaption { font-size: calc(13 * var(--u)); color: var(--soft); }
  /* ? Pourquoi: the notions */
  .notions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .ncard { padding: 18px 20px; } .ncard:nth-child(2) { rotate: .6deg; }
  .ncard h3 { font-size: calc(21 * var(--u)); color: var(--g-deep); margin-bottom: 6px; } .ncard p { font-size: calc(17 * var(--u)); line-height: 1.45; }
  .exs { display: grid; gap: 6px; margin-top: 10px; } .ex { padding: 6px 10px; border-radius: 8px; font-size: calc(16 * var(--u)); line-height: 1.4; background: var(--g-tint); }
  .ex.no { background: var(--lilac-tint); } .ex b { display: block; font-size: calc(12 * var(--u)); text-transform: uppercase; letter-spacing: .03em; color: var(--g-deep); }
  .ex.no b { color: var(--violet); }
  .after { font-size: calc(15 * var(--u)); color: var(--soft); }
  /* Avant la séance: the plan and what to print */
  /* the last screen: the lesson as a sheet (26 Nov 2026) */
  .lesson { --u: clamp(1px, calc(.08px + .1vh), 1.35px); display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 22vw, 280px); grid-template-rows: auto 1fr; gap: 6px clamp(20px, 2.6vw, 36px); align-self: start; padding: clamp(18px, 3vh, 28px) clamp(20px, 2.6vw, 32px); rotate: -.3deg; }
  .ls-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--g-tint); }
  .ls-head h2 { font-size: clamp(1.3rem, 3vh, 1.7rem); color: var(--g-deep); }
  .ls-head span { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .ls-steps::before { content: ""; position: absolute; left: 17px; top: 24px; bottom: 24px; width: 2px; background: var(--g-hell); }
  .ls-step { position: relative; width: 100%; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 8px 10px 8px 0; border: 0; border-radius: 10px; background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .ls-step:hover { background: var(--g-tint); }
  .ls-step i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); background: #fff; border: 2px solid var(--g-deep); }
  .ls-step.done i { background: var(--g-deep); color: #fff; }
  .ls-body { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .ls-body b { font-size: clamp(16px, 2.2vh, 18px); color: var(--g-deep); }
  .ls-body small { font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-found { grid-column: 1 / -1; font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--soft); }
  .ls-say { grid-column: 1 / -1; margin-top: 4px; padding: 6px 10px; border-radius: 8px; background: var(--g-tint); font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--g-deep); }
  .ls-say em { display: block; font-style: normal; font-size: calc(12 * var(--u)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .ls-mat { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 10px; padding-left: clamp(16px, 2vw, 28px); border-left: 2px dashed var(--hair); }
  .ls-mat h3 { font-size: calc(13 * var(--u)); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--violet); }
  .ls-sheet { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1.5px solid var(--hair); background: #fff; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); cursor: pointer; }
  .ls-sheet:hover { border-color: var(--g-deep); }
  .ls-sheet img { width: 100%; max-height: 34vh; object-fit: contain; box-shadow: var(--paper-shadow); rotate: 1.5deg; }
  .ls-mat .tool { justify-content: center; }
  /* five steps or more: tighter, so the sheet stays on one screen */
  .lesson.many .ls-step { padding-block: 3px; } .lesson.many .ls-steps { gap: 0; }
  .lesson.many .ls-found, .lesson.many .ls-say { font-size: calc(14 * var(--u)); } .lesson.many .ls-say { margin-top: 2px; padding: 4px 8px; }
  .lesson.many .ls-say em { display: inline; margin-right: 4px; }
  @media (max-width: 900px) { .lesson { grid-template-columns: 1fr; height: auto; max-height: none; } .ls-mat { grid-row: auto; grid-column: 1; padding-left: 0; border-left: 0; } }
  .plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stepc { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--hair); background: #fff; text-align: left; font: inherit; cursor: pointer; }
  .stepc:hover { border-color: var(--g-deep); }
  .stepc .sn { display: flex; align-items: center; gap: 8px; font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .stepc .sn i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); border: 2px solid var(--g-deep); }
  .stepc.done .sn i { background: var(--g-deep); color: #fff; }
  .stepc h3 { font-size: calc(18 * var(--u)); line-height: 1.25; color: var(--g-deep); } .stepc p { font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--soft); }
  .total { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--g-deep); text-align: right; margin-top: -6px; }
  .prep { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mat { padding: 14px 16px; } .mat h3 { font-size: calc(19 * var(--u)); color: var(--g-deep); margin-bottom: 8px; }
  .mat ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: calc(17 * var(--u)); line-height: 1.4; }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .thumb { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border: 0; cursor: pointer; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); rotate: -1deg; }
  .thumb img { width: 64px; height: auto; border-radius: 4px; }
  .pdfs { display: flex; flex-wrap: wrap; gap: 8px; }
  /* ✓ Fin: « Ce que l'activité simplifie » */
  .simp { width: 100%; border-collapse: collapse; font-size: calc(14 * var(--u)); line-height: 1.4; background: #fff; }
  .simp th { text-align: left; padding: 8px 10px; font-size: calc(13 * var(--u)); color: var(--g-deep); border-bottom: 2px solid var(--g-deep); }
  .simp th.ai, .simp td.ai { background: var(--lilac-tint); }
  .simp td { padding: 8px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  .simp td .st { display: block; font-size: calc(12 * var(--u)); color: var(--soft); }
  /* the EXERCICE 1 sheet, large */
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(11, 81, 77, .45); display: grid; place-items: center; padding: 24px; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: var(--paper-shadow); background: #fff; }
  .lightbox .x { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 10px; border: 0; background: #fff; color: var(--g-deep); cursor: pointer; display: grid; place-items: center; }
  @media (max-width: 1100px) { .notions { grid-template-columns: 1fr; } .plan { grid-template-columns: repeat(2, minmax(0, 1fr)); } .prep { grid-template-columns: 1fr; } }
  /* short laptop screens (≤ 820 px high): the lesson sheet keeps one screen, as in Modules 2 and 3 */
  @media (max-height: 820px) and (min-width: 761px) {
    .lesson { padding: 14px 18px; gap: 4px 20px; } .ls-head { padding-bottom: 6px; } .ls-steps { gap: 0; } .ls-step { padding-block: 3px; }
    .ls-found { display: none; } .ls-say { margin-top: 2px; padding: 4px 8px; } .ls-say em { display: inline; margin-right: 4px; }
    .ncard { padding: 14px 16px; } .ncard h3 { font-size: calc(19 * var(--u)); } .ncard p { font-size: calc(16 * var(--u)); } .ex { font-size: calc(15 * var(--u)); }
  }
  /* few items on the desk (notions, plan, material): the group sits in the middle of the desk, not against the top
     (layout brief, 26 Nov 2026); the Consigne card stays at the top. Only here: other pages' desks are grids. */
  .desk > :first-child:not(.card-consigne):not(.rotate) { margin-top: auto; }
  .desk > :last-child:not(.card-consigne) { margin-bottom: auto; }
</style>
</head>
<body>
<main class="stage">
  <section class="tutor" id="tutor"></section>
  <section class="desk" id="desk" aria-label="Ton pupitre"></section>
</main>
<div class="lightbox" id="lightbox" hidden><button type="button" class="x" id="lb-close" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><img id="lb-img" src="images/fiche-exercice-1.png" alt="La fiche EXERCICE 1"></div>

<script src="../../shared/shell.js"></script>
<script src="../../shared/frame.js"></script>
<script>
/* ============================================================
   CONTENU — modifie seulement cette partie.
   (Le même contenu qu'avant le 26 nov. 2026 ; les textes des trois écrans regroupés sont plus bas, marqués.)
   Les espaces avant : ? ! ; » et après « , et les apostrophes ’, sont mis tout seuls à l'affichage (fonction nb).
   TEXTES À VÉRIFIER PAR L'ÉQUIPE : le récit d'Anne est un BROUILLON.
   Les phrases à dire partout de la même façon : « elle exécute les instructions, dans l’ordre, sans rien inventer » · « une instruction fausse » ·
   « l’erreur est dans les instructions » · « déboguer ».
   ============================================================ */
const TITLE = "Robot dessine 1";
const GUIDE_PDF = "media/page-robot-dessine-1.pdf";   // la page enseignant·e à imprimer (20 nov. 2026), alignée sur l’activité
const SHEET_PDF = "media/fiche-exercice-1-erreur.pdf";   // la fiche EXERCICE 1 à imprimer, avec l’erreur voulue (faite par guide/fiche-exercice-1.py)
const SHEET_IMG = "images/fiche-exercice-1.png";        // la fiche EXERCICE 1, vue en grand depuis le plan et la fin

/* Les boutons (1 à 3 mots) */
const BTN = {
  prev: "Écran précédent", next: "Écran suivant", plan: "Plan de la leçon", close: "Fermer",
  nextStep: "Étape suivante", finish: "Terminer",
  undo: "Annuler le dernier point", restart: "Recommencer",                    // étape 1
  test: "▶ Tester le programme",                                                 // étape 3
  write: n => `Écrire la ligne ${n}`,                                           // étape 4
  guide: "Guide (PDF)", sheetPdf: "La fiche (PDF)", sheet: "Voir la fiche EXERCICE 1", sheetShort: "Voir la fiche", again: "Recommencer la leçon"
};
const ROTATE_MSG = "Tourne ta tablette à l’horizontale pour faire l’activité.";

/* ---------- Écran 1 : Avant de commencer. Le récit d'Anne : BROUILLON pour l'équipe (elle le réécrit elle-même).
   Mets TALE_DRAFT à "" quand le texte est validé : l'étiquette disparaît. ---------- */
const TALE_DRAFT = "";   // validé par l’utilisatrice le 26/11/2026 (version courte)
const TALE = [   // raccourci le 26/11/2026 (colonne d'Anne plus étroite) ; la version longue est dans l'historique git
  "« La machine s’est trompée ! » m’a dit Malik devant un dessin raté. Pour lui, l’ordinateur fait ce qu’il veut.",
  "Pourtant, la machine a suivi <b>les instructions écrites par des humains</b>, dans l’ordre. L’erreur était dans les instructions.",
  "Alors mes élèves <b>jouent la machine</b>, sur papier : chacun suit le même programme. Quand deux dessins diffèrent, on cherche l’instruction en cause et on la réécrit."
];
const IDEA_LABEL = "Pourquoi commencer par un programme ?";   // avant : « L'idée à faire passer » (son texte est maintenant sur l'écran « Les notions »)
const IDEA = "Pour comprendre ce qui change avec l’IA. Dans un programme classique, l'humain écrit les règles une à une. Mais tout prévoir est difficile. Avec l'apprentissage automatique, on change d'approche : on montre des exemples à la machine, qui y repère des régularités pour apprendre.";   // texte de l'utilisatrice, 18/11/2026

/* ---------- Écran 2 : les notions de la séance (NOTIONS_TITLE = le titre du bandeau du haut). Un récapitulatif pour toi, avant l'exercice ;
   les exemples ne viennent PAS de la fiche (l'enseignant·e ne l'a pas encore vue). « élémentaire » est gardé pour Robot dessine 2. ---------- */
const NOTIONS_TITLE = "Les notions de la séance";
const NOTIONS = [
  { term: "Algorithme et programme", def: "Un algorithme : une suite d'instructions, dans l'ordre, pour faire une tâche. Écrit pour une machine, c'est un programme. Une machine classique <b>exécute les instructions, dans l'ordre, sans rien inventer</b>." },
  { term: "Une instruction fausse", def: "La machine l'exécute quand même, sans rien remarquer : le résultat est faux, pour tout le monde, à chaque fois.",
    yes: ["Juste", "« Pour aller à la porte : avance de 3 pas, puis tourne à droite. »"], no: ["Fausse", "« …puis tourne à gauche. » La machine tourne à gauche : elle ne sait pas où est la porte."] },
  { term: "Déboguer", def: "Si le résultat est faux, <b>l'erreur est dans les instructions</b>. On trouve l'instruction fausse, on la corrige, on teste encore." }
];
const NOTIONS_AFTER = "Dans « Robot dessine 2 », une autre difficulté : des instructions <b>floues</b>, qui laissent le choix (« un sourire »).";

/* ---------- Écran 9, avant la fin : ce que l'activité simplifie (SIMP_TITLE = le titre du bandeau du haut ; step = le texte affiché ; at = les étapes où la ligne revient dans « Pour toi ») ---------- */
const SIMP_TITLE = "Pour aller plus loin : ce que l'activité simplifie";
const SIMP_HEAD = ["Dans l'activité", "Pourquoi on simplifie", "Dans une vraie machine"];
const SIMP = [
  { game: "Un élève suit le programme", step: "étape 1", at: [1], why: "On vit de l'intérieur ce que fait la machine : exécuter, sans choisir.", ai: "L'ordinateur exécute le programme électriquement, très vite, sans comprendre le dessin qui apparaît.",
    risk: "un élève peut se tromper en suivant ; une vraie machine, non. Ne laisse pas dire « la machine s'est trompée »." },
  { game: "Des instructions en français", step: "étape 3", at: [3], why: "Les élèves peuvent les lire, les discuter et les réécrire.", ai: "Un programme s'écrit dans un langage strict. Un ordre faux est exécuté tel quel : le dessin est faux, sans message d'erreur." },
  { game: "Des points numérotés et des couleurs, sur papier", step: "étape 1", at: [1], why: "Une instruction, un trait : chacun voit s'il l'a bien suivie.", ai: "L'ordinateur reçoit des nombres : la position de chaque point, le code de chaque couleur." },
  { game: "Une erreur voulue dans le programme", step: "étape 2", at: [2], why: "Tout le monde obtient la même erreur : elle ne peut pas venir des élèves.", ai: "Une machine aussi donne toujours le même résultat avec le même programme, même s'il est faux.",
    risk: "les élèves peuvent croire qu'on les a piégés : dis que les programmeurs aussi laissent des erreurs, sans le vouloir." },
  { game: "La classe corrige une instruction", step: "étape 3", at: [3], why: "On voit qu'une erreur se corrige en changeant une instruction précise.", ai: "Les programmeurs déboguent aussi : trouver l'instruction, la corriger, tester encore.",
    risk: "un vrai bug ne se trouve pas toujours aussi vite : ici, une seule instruction est fausse." },
  { game: "Algorithme et programme, presque le même mot", step: "étape 4", at: [4], why: "À l'école, une phrase suffit pour les distinguer.",
    ai: "Un algorithme est une méthode. Un programme, c'est cet algorithme écrit dans un langage strict, que l'ordinateur exécute." }
];
const SIMP_AFTER = "Ici, « On lui dit tout » : des humains écrivent toutes les instructions. Dans « Robot apprend à dessiner », « On lui montre des exemples ».";

/* ---------- Écran 4 : le plan de la leçon (ess = Essentiel ; sinon « Peut se raccourcir ») ---------- */
const STEPS = [
  { n: 1, title: "Suivre les instructions du programme", min: 5, ess: true, found: "Chacun relie les points, ligne après ligne : un robot apparaît." },
  { n: 2, title: "Comparer les dessins", min: 5, ess: true, found: "Même programme, même bouche croisée pour tout le monde : où est l'erreur ?" },
  { n: 3, title: "Corriger les instructions", min: 5, ess: true, found: "« 17 → 18 → 20 → 19 → 17 » est fausse : on la corrige, on teste encore." },
  { n: 4, title: "Faire le point", min: 5, ess: true, found: "La classe écrit la trace écrite : algorithme, instruction fausse, déboguer." }
];
const TAGS = { ess: "Essentiel", short: "Peut se raccourcir" };   // seule l’étiquette « Peut se raccourcir » est affichée (plan et bandeau) ; « Essentiel » n’est plus montré
const PLAN_TITLE = "clique sur une étape pour l’ouvrir";   // à droite du bandeau du haut, après PLAN_SUB
const PLAN_SUB = "4 étapes · 20 min";   // 5 + 5 + 5 + 5 min (l'addition sous la ligne des étapes est calculée avec STEPS)
const DONE_MARK = "fait ✓";
/* Avant la séance */
const BEFORE_TITLE = "Avant la séance : imprime les fiches";
const BEFORE_MAT = [
  ["Fiche EXERCICE 1", "une par élève, celle de cette activité (« Voir la fiche ») : sa ligne rose contient une erreur voulue."],
  ["Le résultat attendu", "à afficher au tableau pour l'étape 2."],
  ["Crayons de couleur", "bleu, orange, vert, rose."],

const talk = t => frame.talk({ ...t, say: nb(t.say || ""), more: nb(t.more || ""), keep: (t.keep || []).map(nb), replies: (t.replies || []).map(([l, a, g]) => [nb(l), a, g]) });

/* ---------- Learning data (unchanged) ----------
     intro_vue             the screens for the teacher seen: 1 = pourquoi, 2 = les notions (both on « ? Pourquoi »), 3 = préparer la séance,
                           4 = le plan (both on « Avant la séance »), 5 = ce que l'activité simplifie (the table, from « ✓ Fin »)
     points_erreurs        step 1: the dots off the program once the drawing is finished (numeric; 0 = followed exactly)
     reconnais             step 1: the answers tried, e.g. "Une maison > Un robot" (correct = « Un robot » the first time)
     difference            step 2: the parts tried (correct = « La bouche » the first time)
     instruction_fautive   step 3: the lines clicked, numbered 1–5, e.g. "2 > 5" (correct = 5 the first time)
     correction            step 3: the rewrites tried (correct = the precise one the first time)
     pourtoi_ouvert        the « Pour toi » buttons opened, as step:tab, in the order of first opening, e.g. "1:pourquoi 3:idees"
     idees_retournees      the pupils' ideas turned over, as step:idea; simp_retournees: the « simplifie » cards turned over
     trace_ecrite          step 4: "3" once the three lines of the trace écrite are written
   Completed when step 4 is done (the trace écrite written). */
const rec = (id, v, opt) => { scorm.record(id, v, opt); scorm.commit(); };
const sawIntro = (...codes) => { const before = introSeen.size; codes.forEach(c => introSeen.add(c)); if (introSeen.size > before) rec("intro_vue", [...introSeen].sort().join(" ")); };

const isDone = k => k !== cur && (SCREENS[k].step ? done.has(SCREENS[k].step) : seen.has(k));
const canNext = () => { const S = SCREENS[cur]; if (S.id === "end") return false; return S.step ? done.has(S.step) : true; };
function drawSteps() { frame.steps(cur + 1, k => ({ done: isDone(k - 1), can: seen.has(k - 1) || SCREENS[k - 1].step })); }
function go(i) {
  try { scorm.set("cmi.core.lesson_location", String(i)); } catch {}   // the screen, for coming back (usability review, 26 Nov 2026)
  closeSheet(false);
  cur = i; seen.add(i); me = null;
  const S = SCREENS[i], desk = $("#desk");
  desk.scrollTop = 0;
  if (S.id === "why") { sawIntro(1, 2); drawWhy(); }
  else if (S.id === "prep") { sawIntro(3, 4); drawPrep(); }
  else if (S.id === "end") drawEnd(false);
  else { desk.innerHTML = `<aside class="card-consigne" id="consigne" hidden><span class="lab">${CONSIGNE_LABEL}</span><p id="consigne-t"></p></aside><div class="board" id="board"></div>`; render(); }
  drawSteps();
}
function finishStep(n) {
  if (done.has(n)) return;
  done.add(n);
  if (n === LAST && scorm.get("cmi.core.lesson_status") !== "completed") { scorm.set("cmi.core.lesson_status", "completed"); scorm.commit(); }
  drawSteps();
}

/* ---------- Anne during a step: what you do (her line), the Consigne on the desk, and her buttons ---------- */
let last = null, me = null;   // the step's current line; the « Pour toi » answer open in her bubble (null = none)
const nextLabel = () => SCREENS[cur].step === LAST ? BTN.finish : BTN.nextStep;
function classe(t, acts = []) { last = { t, acts }; if (!me) showStep(); }
function showStep() {
  const { t, acts } = last, n = SCREENS[cur].step;
  $("#consigne").hidden = !t.say; put($("#consigne-t"), t.say || "");
  talk({ pose: done.has(n) ? "debout" : /Regarde|Cette|Avec cette|ne suit pas/.test(t.now) ? "pense" : "montre", say: t.now, lead: ASK_LEAD,
    wait: canNext() ? "" : nextLabel(),                       // the way on (bottom-right of the desk), greyed out until the step is done
    replies: [...(canNext() ? [[nextLabel(), () => go(cur + 1), true]] : []),
              ...meTabs(n).map(k => [ME_CHIPS[k], () => openMe(k)])] });
}
function board(html) { put($("#board"), html); }
function render() { const n = SCREENS[cur].step; [r1, r2, r3, r4][n - 1](); }

/* ---------- « Pour toi »: three buttons, answered in Anne's bubble (same texts as the old drawer) ---------- */
const TAB_KEY = { why: "pourquoi", ideas: "idees", simp: "simp" };
const meTabs = n => ["why", "ideas", ...(SIMP.some(s => s.at.includes(n)) ? ["simp"] : [])];
const meOpened = [], ideaSeen = new Set(), simpSeen = new Set();
const back = () => [BACK_LABEL, () => { me = null; showStep(); }];
function openMe(tab) {
  const n = SCREENS[cur].step, item = `${n}:${TAB_KEY[tab]}`;
  if (!meOpened.includes(item)) { meOpened.push(item); rec("pourtoi_ouvert", meOpened.join(" ")); }
  me = { tab, k: 0 }; drawMe();
}
function drawMe() {
  const n = SCREENS[cur].step, h = HELP[n - 1], { tab, k } = me;
  if (tab === "why") return talk({ pose: "pense", say: h.teaser.why,
    more: `<p>${h.why}</p><h4>${ME_LBL.anne}</h4><p>« ${h.anne} »</p>${h.more ? `<h4>${ME_LBL.more}</h4><p>${h.more}</p>` : ""}`, replies: [back()] });
  if (tab === "ideas") {
    const d = h.ideas[k], turned = ideaSeen.has(`${n}:${k}`), lastIdea = k === h.ideas.length - 1;
    return talk({ pose: turned ? "montre" : "pense", say: `${ME_LBL.kidSays} ${d.idea}`,
      more: turned ? `${d.because ? `<p><b>${ME_LBL.because}&nbsp;:</b> ${d.because}</p>` : ""}<p><b>${ME_LBL.fact}&nbsp;:</b> ${d.fact}</p>${lastIdea ? `<p><b>${ME_LBL.ask}&nbsp;:</b> ${h.ask}</p><p><b>${ME_LBL.useT}&nbsp;:</b> ${h.use}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${h.avoid}</p>` : ""}`
        : IDEA_ASK,
      replies: [...(!turned ? [[IDEA_SHOW, () => { ideaSeen.add(`${n}:${k}`); rec("idees_retournees", [...ideaSeen].join(" ")); drawMe(); }]]
        : !lastIdea ? [[NEXT_IDEA(k + 2, h.ideas.length), () => { me.k++; drawMe(); }]] : []), back()] });
  }
  const rows = SIMP.filter(s => s.at.includes(n)), r = rows[k], flipped = simpSeen.has(`${n}:${k}`), lastCard = k === rows.length - 1;
  talk({ pose: "pense", say: `${ME_LBL.inGame}&nbsp;: ${r.game}`,
    more: flipped ? `<p><b>${ME_LBL.ai}&nbsp;:</b> ${r.ai}</p>${r.risk ? `<p><b>${ME_LBL.risk}&nbsp;:</b> ${r.risk}</p>` : ""}` : SIMP_ASK,
    replies: [...(!flipped ? [[FLIP, () => { simpSeen.add(`${n}:${k}`); rec("simp_retournees", [...simpSeen].join(" ")); drawMe(); }]]
      : !lastCard ? [[NEXT_CARD(k + 2, rows.length), () => { me.k++; drawMe(); }]] : []), back()] });
}

/* ---------- The sheet as an SVG: the dots (clickable at step 1) and the lines already drawn ---------- */
const U = 34, M = 30;
const px = n => [M + DOTS[n][0] * U, M + DOTS[n][1] * U];
const VB = `0 0 ${2 * M + 11 * U} ${2 * M + 10 * U}`;
function lines(prog) {
  return prog.map(p => p.path.slice(1).map((n, k) => { const [x1, y1] = px(p.path[k]), [x2, y2] = px(n);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${p.color}" stroke-width="6" stroke-linecap="round"/>`; }).join("")).join("");
}
function sheet(prog, h, { dots = null, label = true, extra = "" } = {}) {
  return `<svg class="grid" viewBox="${VB}" style="height:${h}" aria-hidden="true">${lines(prog)}
    ${Object.keys(DOTS).map(n => { const [x, y] = px(n); return `<circle class="dot${dots?.has(+n) ? " done" : ""}" cx="${x}" cy="${y}" r="${dots ? 7 : 6}"/>
      ${dots ? `<circle class="hit" data-dot="${n}" cx="${x}" cy="${y}" r="17"/>` : ""}${label ? `<text x="${x + 9}" y="${y - 9}">${n}</text>` : ""}`; }).join("")}${extra}</svg>`;
}
const leaProg = fixed => PROGRAM.map((p, k) => k === BAD && fixed ? { ...p, path: FIXED_PINK } : p);   // the class drawing, before / after the correction

/* ============ Step 1: follow the program, dot after dot (unchanged) ============ */
const S1 = {};
function resetS1() { Object.assign(S1, { strokes: PROGRAM.map(p => ({ color: p.color, path: [] })), line: 0, reached: new Set(), recog: [], ok: false, msg: null }); }
resetS1();
const pen = () => { const s = S1.strokes[S1.line]; return s?.path.length ? s.path.at(-1) : null; };
const errorsOf = () => S1.strokes.reduce((e, s, k) => { const w = PROGRAM[k].path;
  for (let i = 0; i < Math.max(w.length, s.path.length); i++) if (s.path[i] !== w[i]) e++; return e; }, 0);
function r1() {
  const finished = S1.line === PROGRAM.length, at = pen(), [x, y] = at ? px(at) : [0, 0];
  const extra = at ? `<circle class="pen" cx="${x}" cy="${y}" r="13"/><line class="rubber" x1="${x}" y1="${y}" x2="${x}" y2="${y}" stroke="${S1.strokes[S1.line].color}"/>` : "";
  const started = S1.strokes.some(s => s.path.length);
  const ask = finished && !S1.ok
    ? `<p class="ask">${RECOGNIZE.label}</p><div class="opts">${RECOGNIZE.options.map((o, k) => `<button type="button" class="opt ${S1.recog.includes(o) ? "no" : ""}" data-recog="${k}">${o}</button>`).join("")}</div>`
    : S1.ok ? `<div class="foundbox"><b>${RECOGNIZE.label}</b>${RECOGNIZE.answer}</div>` : "";
  board(`<div class="duo">
    <div class="sheetc paper"><p class="pt">${SHEET_LABEL}</p>${sheet(S1.strokes, "var(--sh)", { dots: S1.reached, extra })}</div>
    <div class="col" style="max-width:340px">
      <div class="sheetc paper"><p class="pt">${PROG_LABEL}</p><img src="images/legende.png" alt="${esc(PROG_ALT)}" style="max-height:calc(var(--sh) * ${finished ? .45 : .6})"></div>
      ${ask}
      <div class="tools"><button type="button" class="tool" data-act="undo" ${started ? "" : "disabled"}>${icon("undo")}${BTN.undo}</button><button type="button" class="tool" data-act="restart" ${started ? "" : "disabled"}>${icon("restart")}${BTN.restart}</button></div>
    </div></div>`);
  if (!finished) return classe({ now: S1.msg || SAY1.dots.now, say: SAY1.dots.say });
  const errs = errorsOf();
  if (!S1.ok) return classe({ now: S1.msg || (errs ? SAY1.different : SAY1.recognize.now), say: SAY1.recognize.say });
  classe(errs ? SAY1.robotDiff : SAY1.robotOk);
}
let drawing = false;
function addDot(n, slide = false) {
  if (SCREENS[cur].step !== 1 || S1.line >= PROGRAM.length) return;
  let s = S1.strokes[S1.line], want = PROGRAM[S1.line].path;
  if (s.path.at(-1) === n) return;
  if (slide && !s.path.length) return;
  const closes = s.path.length > 2 && n === s.path[0];
  if (s.path.length && !closes && n !== want[s.path.length] && PROGRAM[S1.line + 1]?.path[0] === n) {
    S1.line++; s = S1.strokes[S1.line]; want = PROGRAM[S1.line].path;
  }
  s.path.push(n); S1.reached.add(n); S1.msg = null;
  if ((s.path.length > 2 && n === s.path[0]) || s.path.length >= want.length) {
    S1.line++; drawing = false;
    if (S1.line < PROGRAM.length && s.path.length === want.length) S1.msg = SAY1.nextLine(PROGRAM[S1.line].name, PROGRAM[S1.line].path[0]);
  }
  if (S1.line === PROGRAM.length) rec("points_erreurs", String(errorsOf()), { type: "numeric" });
  me = null; render();
}
function undo() {
  let k = Math.min(S1.line, PROGRAM.length - 1);
  while (k > 0 && !S1.strokes[k].path.length) k--;
  if (!S1.strokes[k].path.length) return;
  S1.strokes[k].path.pop(); S1.line = k; S1.recog = []; S1.ok = false; S1.msg = null;
  S1.reached = new Set(S1.strokes.flatMap(s => s.path));
  render();
}
const dotAt = e => document.elementFromPoint(e.clientX, e.clientY)?.closest?.("[data-dot]");
document.addEventListener("pointerdown", e => { const d = e.target.closest?.("[data-dot]"); if (SCREENS[cur].step !== 1 || !d) return; e.preventDefault(); drawing = true; addDot(+d.dataset.dot); });
document.addEventListener("pointerup", () => { drawing = false; });
document.addEventListener("pointermove", e => {
  if (SCREENS[cur].step !== 1) return;
  if (drawing) { const d = dotAt(e); if (d) addDot(+d.dataset.dot, true); }
  const r = $("#board .rubber"), sv = r?.ownerSVGElement;   // the line follows the mouse from the pencil
  if (!r) return;
  const b = sv.getBoundingClientRect(), v = sv.viewBox.baseVal;
  r.setAttribute("x2", (e.clientX - b.left) * v.width / b.width); r.setAttribute("y2", (e.clientY - b.top) * v.height / b.height);
});
function s1click(e) {
  const r = e.target.closest("[data-recog]"); if (!r || S1.ok || S1.line < PROGRAM.length) return;
  const a = RECOGNIZE.options[+r.dataset.recog]; if (S1.recog.includes(a)) return;
  S1.recog.push(a);
  if (a !== RECOGNIZE.answer) { S1.msg = SAY1.wrongRecog; return render(); }
  rec("reconnais", S1.recog.join(" > "), { result: S1.recog.length === 1 ? "correct" : "wrong" });
  S1.ok = true; S1.msg = null; finishStep(1); render();
}

/* ============ Step 2: compare with the model (unchanged) ============ */
const S2 = { tries: [], ok: false, msg: null };
function r2() {

/* ============ Step 3: find the wrong instruction, correct it, test again (unchanged) ============ */
const S3 = { bad: [], fix: [], found: false, fixed: false, tested: false, msg: null };
function r3() {
  const list = WORDS.map((w, k) => { const p = PROGRAM[k], isBad = k === BAD;
    const cls = isBad && S3.fixed ? "fixed" : isBad && S3.found ? "bad" : S3.bad.includes(k) ? "no" : "";
    const txt = isBad && S3.fixed ? `<del>${w}</del> ${FIXES.answer}` : w;
    return `<li><button type="button" class="${cls}" data-w="${k}" ${S3.found ? "disabled" : ""}><code>${k + 1}.</code><span class="sw" style="background:${p.color}"></span><span>${txt}</span></button></li>`; }).join("");
  const fixes = S3.found && !S3.fixed
    ? `<p class="ask">${FIXES.label}</p><div class="opts col1">${FIXES.options.map((o, k) => `<button type="button" class="opt ${S3.fix.includes(o) ? "no" : ""}" data-fix="${k}">${o}</button>`).join("")}</div>` : "";
  const tested = S3.tested ? `<div class="foundbox"><b>${TESTED.found}</b>${TESTED.text}</div>`
    : S3.fixed ? `<div><button type="button" class="chip go" data-act="test">${BTN.test}</button></div>` : "";
  board(`<div class="duo">
    <div class="col" style="flex:1;max-width:560px"><p class="pt">${LEA_PROG_LABEL}</p><ol class="plist">${list}</ol>${fixes}${tested}</div>
    <div class="sheetc paper"><p class="pt">${S3.tested ? LEA_FIXED_LABEL : LEA_LABEL}</p>${sheet(leaProg(S3.tested), "calc(var(--sh) * .85)", { label: false })}</div></div>`);
  if (!S3.found) return classe({ now: S3.msg || SAY3.findBad.now, say: SAY3.findBad.say });
  if (!S3.fixed) return classe({ now: S3.msg || SAY3.badOk.now, say: SAY3.badOk.say });
  if (!S3.tested) return classe(SAY3.fixOk);
  classe(SAY3.end);
}
function s3click(e) {
  const w = e.target.closest("[data-w]"), f = e.target.closest("[data-fix]");
  if (w && !S3.found) {
    const k = +w.dataset.w; if (S3.bad.includes(k)) return; S3.bad.push(k);
    if (k !== BAD) { S3.msg = SAY3.badWrong; return render(); }
    rec("instruction_fautive", S3.bad.map(x => x + 1).join(" > "), { result: S3.bad.length === 1 ? "correct" : "wrong" });
    S3.found = true; S3.msg = null; return render();

    S3.fix.push(o);

    rec("correction", S3.fix.join(" > "), { result: S3.fix.length === 1 ? "correct" : "wrong" });
    S3.fixed = true; S3.msg = null; render();

/* ============ ? Pourquoi · Avant la séance · ✓ Fin ============ */

      </div></div>`);
  const main = () => talk({ pose: "montre", say: PREP_Q, more: BEFORE_NOTE,
    replies: [[PREP_NEXT, () => go(stepAt(1)), true], [SHORT_TITLE, short], [WORDS_TITLE, words]] });
  const short = () => talk({ pose: "pense", say: SHORT_TITLE, keep: SHORT.map(([t, d]) => `<b>${t}</b>&nbsp;: ${d}`), more: `<p>${SHORT_KEEP}</p><p>${LONG}</p>`, replies: [[BACK_LABEL, main]] });
  const words = () => talk({ pose: "montre", say: WORDS_TITLE, more: `<p><b>${ME_LBL.useT}&nbsp;:</b> ${WORDS_USE}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${WORDS_AVOID}</p><p><b>${LINK_LABEL}&nbsp;:</b> ${LINK_TEXT}</p>`, replies: [[BACK_LABEL, main]] });
  main();
}
function drawEnd(table) {
  if (table) {
    sawIntro(5);
    put($("#desk"), `<h2 class="dt">${SIMP_TITLE}</h2><table class="simp"><thead><tr><th>${SIMP_HEAD[0]}</th><th>${SIMP_HEAD[1]}</th><th class="ai">${SIMP_HEAD[2]}</th></tr></thead>
      <tbody>${SIMP.map(s => `<tr><td>${s.game}<span class="st">${s.step}</span></td><td>${s.why}</td><td class="ai">${s.ai}</td></tr>`).join("")}</tbody></table><p class="after">${SIMP_AFTER}</p>`);
  } else {
    const SAYS = { 1: SAY1.dots.say, 2: SAY2.compare.say, 3: SAY3.findBad.say, 4: SAY4.end.say };   // each step's first line to the class
    const total = STEPS.reduce((t, s) => t + s.min, 0);
    put($("#desk"), `<article class="lesson paper${STEPS.length > 4 ? " many" : ""}">
      <header class="ls-head"><h2>${SHEET_HEAD}</h2><span>${SHEET_META(total)}</span></header>
      <ol class="ls-steps">${STEPS.map(s => `<li><button type="button" class="ls-step ${done.has(s.n) ? "done" : ""}" data-goto="${stepAt(s.n)}" title="${OPEN_STEP}">
        <i>${done.has(s.n) ? "✓" : s.n}</i><span class="ls-body"><b>${s.title}</b><small>${s.min}&nbsp;min</small><span class="ls-found">${s.found}</span>
        ${SAYS[s.n] ? `<span class="ls-say"><em>${CONSIGNE_LABEL}</em> ${SAYS[s.n]}</span>` : ""}</span></button></li>`).join("")}</ol>
      <aside class="ls-mat"><h3>${MATERIAL}</h3>
        <button type="button" class="ls-sheet" data-act="sheet"><img src="${SHEET_IMG}" alt="">${BTN.sheet}</button>
        <a class="tool" href="${SHEET_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.sheetPdf}</a><a class="tool" href="${GUIDE_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.guide}</a></aside>
    </article>`);
  }
  talk({ pose: "debout", say: END_TITLE, keep: TAKEAWAY,
    replies: [[BACK_TO_Q, BACK_URL, true], table ? [SIMP_BACK, () => drawEnd(false)] : [SIMP_BTN, () => drawEnd(true)], [BTN.again, again]] });
}

/* ---------- The EXERCICE 1 sheet, large ---------- */
let lbOpener = null;
function openSheet(btn) { lbOpener = btn; $("#lb-img").src = SHEET_IMG; $("#lightbox").hidden = false; setTimeout(() => $("#lb-close").focus({ preventScroll: true }), 30); }
function closeSheet(refocus = true) { if ($("#lightbox").hidden) return; $("#lightbox").hidden = true; if (refocus && lbOpener && document.contains(lbOpener)) lbOpener.focus({ preventScroll: true }); }

/* ---------- Clicks ---------- */
function again() {
  resetS1(); Object.assign(S2, { tries: [], ok: false, msg: null }); Object.assign(S3, { bad: [], fix: [], found: false, fixed: false, tested: false, msg: null }); Object.assign(S4, { shown: 0, fresh: false });
  done.clear(); seen.clear();
  go(0);
}
const ACT = {
  again, sheet: b => openSheet(b),
  undo: () => { me = null; undo(); }, restart: () => { me = null; resetS1(); render(); },
  test: () => { me = null; S3.tested = true; finishStep(3); render(); },
  write: () => writeLine()
};
$("#desk").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) return ACT[a.dataset.act](a);
  const g = e.target.closest("[data-goto]"); if (g) return go(+g.dataset.goto);
  const n = SCREENS[cur].step; if (!n) return;
  if (e.target.closest("[data-recog], [data-part], [data-w], [data-fix]")) me = null;
  if (n === 1) s1click(e); else if (n === 2) s2click(e); else if (n === 3) s3click(e);
});
$("#lb-close").addEventListener("click", () => closeSheet());
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

{ const saved = parseInt(scorm.get("cmi.core.lesson_location"), 10), last = SCREENS.length - 1;
  go(scorm.get("cmi.core.lesson_status") === "completed" ? last : saved >= 0 && saved <= last ? saved : 0); }   // coming back: where the teacher was
