<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot apprend à dessiner</title>
<link rel="stylesheet" href="../../shared/frame.css">
<style>
  /* Robot apprend à dessiner in the H2 frame (since 26 Nov 2026; before: old/index-avant-h2.html). Anne stays beside the
     work and reacts to every move. 7 screens: ? Pourquoi (her story, the notions) · Avant la séance (the plan, the decks)
     · the 4 steps · ✓ Fin (the takeaways; « Ce que l'activité simplifie » from a button).
     The games and the data are the same as before; « Pour toi » is answered in Anne's bubble. */
  .desk { display: flex; flex-direction: column; gap: 14px; overflow: auto; --sh: clamp(220px, calc(100vh - 360px), calc(380 * var(--u))); }
  .desk h2.dt { font-size: calc(15 * var(--u)); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--violet); }
  .pt { font-size: calc(13 * var(--u)); font-weight: 700; color: var(--soft); margin-bottom: 6px; }
  .card-consigne { align-self: flex-start; max-width: 560px; }
  .board { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: 12px; }   /* few items: centred in the desk (layout brief, 26 Nov 2026) */
  .duo { display: flex; gap: clamp(14px, 2vw, 24px); align-items: flex-start; justify-content: center; }
  .duo > * { min-width: 0; }
  .ask { font-weight: 700; color: var(--g-deep); }
  /* the decks and the robot */
  .deckcard { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: #fff; border-radius: 6px; box-shadow: var(--paper-shadow); }
  .deckcard b { font-size: calc(13 * var(--u)); color: var(--soft); }
  .deckcard img, .deckcard svg { display: block; width: 100%; height: auto; }
  .obs { display: grid; grid-template-columns: minmax(0, .9fr) minmax(320px, 1.1fr); gap: clamp(14px, 2vw, 24px); align-items: start; }
  .obs .deckcard { rotate: -.6deg; }
  .crit h3 { font-size: calc(17 * var(--u)); color: var(--g-deep); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; margin-bottom: 10px; }
  .crit h3 span { font-size: calc(14 * var(--u)); color: var(--soft); }
  .feats { display: flex; flex-wrap: wrap; gap: 8px; }
  .feat { min-height: 40px; padding: 4px 12px; border-radius: 10px; border: 1.5px solid var(--g-deep); background: #fff; color: var(--g-deep); font: 600 calc(14.5 * var(--u))/1.25 Inter, sans-serif; text-align: left; cursor: pointer; }
  .feat:hover:not(:disabled) { background: var(--g-tint); }
  .feat.ok { background: var(--g-main); border-color: var(--g-main); cursor: default; }
  .feat.ok::before { content: "✓ "; font-weight: 800; }
  .feat.no { border-style: dashed; color: var(--soft); border-color: var(--soft); text-decoration: line-through; cursor: default; }
  .feat.shake { animation: shake .35s; }
  @keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
  @media (prefers-reduced-motion: reduce) { .feat.shake { animation: none; } }
  .others { margin-top: 12px; font-size: calc(14 * var(--u)); color: var(--soft); }
  .gen { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, .8fr) minmax(0, 1.1fr); gap: clamp(12px, 1.6vw, 20px); align-items: start; }
  .gen .col { display: flex; flex-direction: column; gap: 10px; }
  .gen .deckcard.new { rotate: .6deg; }
  .score { font-size: calc(15 * var(--u)); line-height: 1.4; } .score .off { color: var(--violet); font-weight: 700; }
  .pieces { display: grid; gap: 8px; }
  .prow2 b { display: block; font-size: calc(13 * var(--u)); color: var(--soft); margin-bottom: 4px; }
  .prow2 div { display: flex; flex-wrap: wrap; gap: 6px; }
  .pc { min-height: 34px; padding: 2px 10px; border-radius: 8px; border: 1.5px solid var(--hair); background: #fff; font: 600 calc(14 * var(--u)) Inter, sans-serif; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .pc i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #333; }
  .pc.on { border-color: var(--g-deep); background: var(--g-tint); color: var(--g-deep); }
  .cmp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .cmp .deckcard { padding: 6px; } .cmp .deckcard b { font-size: calc(12 * var(--u)); }
  /* the discussion questions */
  .drops { display: grid; gap: 10px; }
  .drop { border-radius: 12px; border: 1.5px solid var(--hair); background: #fff; }
  .drop.seen { border-color: var(--g-main); }
  .drop > button { width: 100%; display: grid; grid-template-columns: 1fr 24px; align-items: center; gap: 4px 10px; padding: 10px 16px; border: 0; background: none; text-align: left; font: inherit; cursor: pointer; }
  .drop > button small { grid-column: 1; font-size: calc(13 * var(--u)); font-weight: 700; color: var(--soft); }
  .drop > button b { grid-column: 1; font-size: calc(16 * var(--u)); color: var(--g-deep); }
  .drop > button .chev { grid-column: 2; grid-row: 1 / span 2; width: 22px; height: 22px; color: var(--g-deep); transition: transform .2s; }
  .drop.open > button .chev { transform: rotate(180deg); }
  .drop .dbody { display: none; padding: 0 16px 12px; }
  .drop.open .dbody { display: grid; gap: 8px; }
  .drop .dbody p { font-size: calc(15 * var(--u)); line-height: 1.45; }
  .drop .dbody .ans { padding: 8px 12px; border-radius: 8px; background: var(--g-tint); }
  .drop .dbody b { display: block; font-size: calc(12 * var(--u)); text-transform: uppercase; letter-spacing: .03em; color: var(--g-deep); }
  /* step 4: the trace écrite */
  .trace { padding: 14px 18px; flex: 1; min-width: 280px; }
  .trace ol { margin: 0; padding-left: 22px; display: grid; gap: 10px; font-size: calc(16 * var(--u)); line-height: 1.45; }
  .trace li.todo { color: var(--soft); }
  .trace li.new { animation: rise .45s var(--ease) both; }
  .tshow { padding: 12px 14px; flex: 1; }
  .tshow img { max-width: 100%; height: auto; max-height: calc(var(--sh) * .8); }
  .tpair { display: flex; gap: 12px; } .tpair figure { margin: 0; text-align: center; flex: 1; } .tpair figcaption { font-size: calc(13 * var(--u)); color: var(--soft); }
  .tpair svg, .tpair img { width: 100%; height: auto; }
  /* ? Pourquoi */
  .notions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .ncard { padding: 18px 20px; } .ncard:nth-child(2) { rotate: .6deg; }
  .ncard h3 { font-size: calc(21 * var(--u)); color: var(--g-deep); margin-bottom: 6px; } .ncard p { font-size: calc(17 * var(--u)); line-height: 1.45; }
  .exs { display: grid; gap: 6px; margin-top: 10px; } .ex { padding: 6px 10px; border-radius: 8px; font-size: calc(16 * var(--u)); line-height: 1.4; background: var(--g-tint); }
  .ex.no { background: var(--lilac-tint); } .ex b { display: block; font-size: calc(12 * var(--u)); text-transform: uppercase; letter-spacing: .03em; color: var(--g-deep); }
  .ex.no b { color: var(--violet); }
  .after { font-size: calc(15 * var(--u)); color: var(--soft); }
  /* Avant la séance */
  /* the last screen: the lesson as a sheet (26 Nov 2026) */
  .lesson { --u: clamp(1px, calc(.08px + .1vh), 1.35px); display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 22vw, 280px); grid-template-rows: auto 1fr; gap: 6px clamp(20px, 2.6vw, 36px); align-self: start; padding: clamp(18px, 3vh, 28px) clamp(20px, 2.6vw, 32px); rotate: -.3deg; }
  .ls-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--g-tint); }
  .ls-head h2 { font-size: clamp(1.3rem, 3vh, 1.7rem); color: var(--g-deep); }
  .ls-head span { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .ls-steps::before { content: ""; position: absolute; left: 17px; top: 24px; bottom: 24px; width: 2px; background: var(--g-hell); }
  .ls-step { position: relative; width: 100%; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 8px 10px 8px 0; border: 0; border-radius: 10px; background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .ls-step:hover { background: var(--g-tint); }
  .ls-step i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); background: #fff; border: 2px solid var(--g-deep); }
  .ls-step.done i { background: var(--g-deep); color: #fff; }
  .ls-body { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .ls-body b { font-size: clamp(16px, 2.2vh, 18px); color: var(--g-deep); }
  .ls-body small { font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-found { grid-column: 1 / -1; font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--soft); }
  .ls-say { grid-column: 1 / -1; margin-top: 4px; padding: 6px 10px; border-radius: 8px; background: var(--g-tint); font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--g-deep); }
  .ls-say em { display: block; font-style: normal; font-size: calc(12 * var(--u)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .ls-mat { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 10px; padding-left: clamp(16px, 2vw, 28px); border-left: 2px dashed var(--hair); }
  .ls-mat h3 { font-size: calc(13 * var(--u)); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--violet); }
  .ls-sheet { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1.5px solid var(--hair); background: #fff; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); cursor: pointer; }
  .ls-sheet:hover { border-color: var(--g-deep); }
  .ls-sheet img { width: 100%; max-height: 34vh; object-fit: contain; box-shadow: var(--paper-shadow); rotate: 1.5deg; }
  .ls-mat .tool { justify-content: center; }
  /* five steps or more: tighter, so the sheet stays on one screen */
  .lesson.many .ls-step { padding-block: 3px; } .lesson.many .ls-steps { gap: 0; }
  .lesson.many .ls-found, .lesson.many .ls-say { font-size: calc(14 * var(--u)); } .lesson.many .ls-say { margin-top: 2px; padding: 4px 8px; }
  .lesson.many .ls-say em { display: inline; margin-right: 4px; }
  @media (max-width: 900px) { .lesson { grid-template-columns: 1fr; height: auto; max-height: none; } .ls-mat { grid-row: auto; grid-column: 1; padding-left: 0; border-left: 0; } }
  .plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stepc { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--hair); background: #fff; text-align: left; font: inherit; cursor: pointer; }
  .stepc:hover { border-color: var(--g-deep); }
  .stepc .sn { display: flex; align-items: center; gap: 8px; font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .stepc .sn i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); border: 2px solid var(--g-deep); }
  .stepc.done .sn i { background: var(--g-deep); color: #fff; }
  .stepc h3 { font-size: calc(18 * var(--u)); line-height: 1.25; color: var(--g-deep); } .stepc p { font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--soft); }
  .total { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--g-deep); text-align: right; margin-top: -6px; }
  .prep { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mat { padding: 14px 16px; } .mat h3 { font-size: calc(19 * var(--u)); color: var(--g-deep); margin-bottom: 8px; }
  .mat ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: calc(17 * var(--u)); line-height: 1.4; }
  .mat .note { margin-top: 10px; font-size: calc(14 * var(--u)); color: var(--soft); }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .thumb { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border: 0; cursor: pointer; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); rotate: -1deg; }
  .thumb img { width: 80px; height: auto; border-radius: 4px; }
  .pdfs { display: flex; flex-wrap: wrap; gap: 8px; }
  /* ✓ Fin */
  .simp { width: 100%; border-collapse: collapse; font-size: calc(14 * var(--u)); line-height: 1.4; background: #fff; }
  .simp th { text-align: left; padding: 8px 10px; font-size: calc(13 * var(--u)); color: var(--g-deep); border-bottom: 2px solid var(--g-deep); }
  .simp th.ai, .simp td.ai { background: var(--lilac-tint); }
  .simp td { padding: 8px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  .simp td .st { display: block; font-size: calc(12 * var(--u)); color: var(--soft); }
  /* the three decks, large */
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(11, 81, 77, .45); display: grid; place-items: center; padding: 24px; }
  .lightbox[hidden] { display: none; }
  .lightbox .lb { background: #fff; border-radius: 10px; padding: 16px; max-width: 100%; max-height: 100%; overflow: auto; }
  .lightbox .decks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .lightbox .decks div { font-size: calc(14 * var(--u)); font-weight: 700; color: var(--g-deep); display: grid; gap: 6px; }
  .lightbox .decks img { width: 100%; height: auto; border-radius: 4px; }
  .lightbox .cap { margin-top: 10px; font-size: calc(14 * var(--u)); color: var(--soft); }
  .lightbox .x { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 10px; border: 0; background: #fff; color: var(--g-deep); cursor: pointer; display: grid; place-items: center; }
  @media (max-width: 1100px) { .notions { grid-template-columns: 1fr; } .plan { grid-template-columns: repeat(2, minmax(0, 1fr)); } .prep, .obs, .gen { grid-template-columns: 1fr; } .cmp { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* short laptop screens (≤ 820 px high): the lesson sheet keeps one screen, as in Modules 2 and 3 */
  @media (max-height: 820px) and (min-width: 761px) {
    .lesson { padding: 14px 18px; gap: 4px 20px; } .ls-head { padding-bottom: 6px; } .ls-steps { gap: 0; } .ls-step { padding-block: 3px; }
    .ls-found { display: none; } .ls-say { margin-top: 2px; padding: 4px 8px; } .ls-say em { display: inline; margin-right: 4px; }
    .ncard { padding: 14px 16px; } .ncard h3 { font-size: calc(19 * var(--u)); } .ncard p { font-size: calc(16 * var(--u)); } .ex { font-size: calc(15 * var(--u)); }
  }
  /* few items on the desk (notions, plan, material): the group sits in the middle of the desk, not against the top
     (layout brief, 26 Nov 2026); the Consigne card stays at the top. Only here: other pages' desks are grids. */
  .desk > :first-child:not(.card-consigne):not(.rotate) { margin-top: auto; }
  .desk > :last-child:not(.card-consigne) { margin-bottom: auto; }
</style>
</head>
<body>
<main class="stage">
  <section class="tutor" id="tutor"></section>
  <section class="desk" id="desk" aria-label="Ton pupitre"></section>
</main>
<div class="lightbox" id="lightbox" hidden><button type="button" class="x" id="lb-close" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="lb"><div class="decks" id="lb-decks"></div><p class="cap" id="lb-cap"></p></div></div>

<script src="../../shared/shell.js"></script>
<script src="../../shared/frame.js"></script>
<script>
/* ============================================================
   CONTENU — modifie seulement cette partie.
   (Le même contenu qu'avant le 26 nov. 2026 ; les textes des trois écrans regroupés sont plus bas, marqués.)
   Les espaces avant : ? ! ; » et après « , et les apostrophes ’, sont mis tout seuls à l'affichage (fonction nb).
   ============================================================ */
const TITLE = "Robot apprend à dessiner";   // « apprend » : le mot courant ; partout ailleurs, dire ce qu'il veut dire : « elle repère des régularités dans les exemples ».
const GUIDE_PDF = "media/robot-apprend.pdf";
const MATERIAL_PDF = "media/robot-apprend.pdf#page=4";   // les cartes A, B, C sont aux pages 4 et 5 du guide

/* Les boutons (1 à 3 mots) */
const BTN = {
  prev: "Écran précédent", next: "Écran suivant", plan: "Plan de la leçon", close: "Fermer",
  nextStep: "Étape suivante",          // à côté de la flèche → (en bas), quand l'étape est faite
  finish: "Terminer",                  // à côté de la flèche →, à la fin de l'étape 4
  ready: "Mon robot est prêt",         // étape 2
  write: n => `Écrire la ligne ${n}`,  // étape 4
  guide: "Guide (PDF)", material: "Cartes (PDF)", again: "Recommencer", materialShort: "Guide et cartes (PDF)",
  decks: "Voir les trois jeux de cartes"   // « Préparer la séance »
};
const ROTATE_MSG = "Tourne ta tablette à l’horizontale pour faire l’activité.";

/* ---------- Écran 1 : Avant de commencer. Le récit d'Anne. BROUILLON pour l'équipe : à réécrire ---------- */
const DRAFT_TAG = "";   // avant : "Brouillon · texte à réécrire" (retiré le 23 nov. 2026)   // "" = ne plus afficher l'étiquette
const TALE = [
  "Après Robot dessine, une élève m'a dit : « C'est facile, un robot : on lui dit tout ! »",
  "Mais les IA dont on parle aujourd'hui, personne ne leur dit tout. <b>On leur montre des exemples</b>, et elles y <b>repèrent des régularités</b>. Si les élèves ne voient pas cette autre façon de faire, ils croient qu'il y a quelqu'un dedans qui sait ce qu'est un robot.",
  "Alors chaque groupe <b>joue la machine</b> : pas de règles, seulement quelques cartes. Et les groupes n'ont pas les mêmes cartes. Quand on compare les dessins, la classe voit d'elle-même que le résultat dépend des exemples.",
];
const IDEA_LABEL = "Pourquoi montrer des exemples ?";
const IDEA = "Certaines tâches sont impossibles à écrire en instructions : essaie de décrire « un robot » point par point. Alors <b>on lui montre des exemples</b> : la machine <b>repère des régularités dans les exemples</b>.";

/* ---------- Écran 2 : les notions de la séance (NOTIONS_TITLE = le titre du bandeau du haut). Un récapitulatif pour toi, avant l'exercice ;
   les exemples parlent de fruits, pas des cartes de robots (l'enseignant·e n'a pas encore vu l'exercice) ---------- */
const NOTIONS_TITLE = "Les notions de la séance";
const NOTIONS = [
  { term: "Des exemples, au lieu d'instructions", def: "Des humains ne disent pas tout à la machine : <b>on lui montre des exemples</b>. Quand on dit qu'une machine « apprend », cela veut dire ceci : <b>elle repère des régularités dans les exemples</b>, puis elle calcule un résultat qui leur ressemble." },
  { term: "Repérer des régularités", def: "Une régularité, c'est ce qui revient dans les exemples. La machine ne nomme rien : <b>elle ne comprend pas comme nous</b> ce qu'elle voit, elle calcule ce qui revient souvent.",
    yes: ["Revient", "Sur toutes les photos de pommes : une forme ronde, une queue."], no: ["Ne revient pas", "Une feuille, sur une seule photo."] },
  { term: "Ce qui manque dans les exemples (un biais)", def: "<b>Ce qui manque dans les exemples sort rarement.</b> Si les exemples ne montrent qu'une partie du monde, les résultats aussi : c'est un biais. <b>Ce sont des humains qui choisissent les exemples.</b>",
    yes: ["Variés", "Des pommes rouges, vertes et jaunes : les trois peuvent sortir."], no: ["Il manque", "Seulement des pommes rouges : une pomme verte sort rarement."] }
];
const NOTIONS_AFTER = "Si la classe a fait « Robot dessine 1 » et « 2 » : là, <b>on lui dit tout</b>, des humains écrivent chaque instruction. Ici, <b>on lui montre des exemples</b>, et des humains choisissent les exemples.";

/* ---------- Écran 9, avant la fin : ce que l'activité simplifie (SIMP_TITLE = le titre du bandeau du haut ; step = le texte affiché ;
   at = les étapes où la ligne revient dans « Pour toi » ; risk = l'idée fausse que la simplification peut donner, affichée « Attention » dans le tiroir) ---------- */
const SIMP_TITLE = "Pour aller plus loin : ce que l’activité simplifie";
const SIMP_HEAD = ["Dans l’activité", "Pourquoi on simplifie", "Dans une vraie machine"];
const SIMP = [
  { game: "Les élèves nomment les critères (« il a des antennes »)", step: "étape 1", at: [1],
    why: "Nommer rend les régularités visibles : on peut les noter et en discuter.",
    ai: "La machine ne nomme pas les critères et ne comprend pas comme nous ce qu'est une antenne. Elle ajuste des nombres (des paramètres) pour produire des résultats qui ressemblent statistiquement aux exemples.",
    risk: "les élèves peuvent croire que la machine pense en mots. Et elle ne garde pas seulement ce qui est sur toutes les cartes : ce qui est rare sort rarement, pas jamais." },
  { game: "Six cartes par groupe", step: "étapes 1 et 3", at: [1],
    why: "On peut tout regarder et tout comparer en cinq minutes.",
    ai: "Des milliers, souvent des millions d’images.",
    risk: "on peut croire qu'il faut peu d'exemples : une vraie machine en a besoin de beaucoup." },
  { game: "Le groupe choisit les pièces du robot", step: "étape 2", at: [2],
    why: "On voit d’où vient chaque partie du nouveau robot.",
    ai: "Personne ne choisit de pièces : la machine calcule toute l’image avec les nombres ajustés pendant l’entraînement.",
    risk: "les élèves peuvent croire qu'elle colle des morceaux d'images : dis qu'elle calcule toute l'image." },
  { game: "Pas de tête toute rouge dans les exemples, pas de tête rouge dessinée", step: "étapes 2 et 3", at: [2, 3],

const BACK_URL = "../../play.html?a=Module1/intro-module";   // the question's page (the build points it there)
const TAKEAWAY = [
  "Dans Robot dessine, on lui disait tout. Ici, on lui montre des exemples : elle repère des régularités dans les exemples.",
  "Elle produit un résultat plausible, qui ressemble aux exemples. Elle ne comprend pas comme nous ce qu’est un robot.",

/* ---------- Les trois écrans regroupés et la bulle d'Anne (26 nov. 2026, brouillons de Claude) ---------- */
const SCREEN_LABELS = { why: "Pourquoi", prep: "Avant la séance", end: "Fin" };
const WHY_Q = "Avant de commencer, mon histoire.";
const WHY_NEXT = "Avant la séance";
const PREP_Q = "Avant la séance&nbsp;: imprime les cartes, forme les groupes.";
const PREP_NEXT = "Commencer l’étape 1";
const BACK_LABEL = "Retour à l’étape";
const ME_CHIPS = { why: "Pourquoi cette étape ?", ideas: "Les élèves pensent", simp: "Ce que le jeu simplifie" };
const IDEA_ASK = "Que lui répondrais-tu&nbsp;? Réfléchis, puis regarde la réponse.";
const IDEA_SHOW = "Voir la réponse", NEXT_IDEA = (i, n) => `Idée suivante (${i} sur ${n})`;
const SIMP_ASK = "Dans le jeu, c’est simplifié. Et dans une vraie machine&nbsp;?";
const FLIP = "Voir la réponse", NEXT_CARD = (i, n) => `Simplification suivante (${i} sur ${n})`;

/* ============================================================ */

/* ---------- French typography at display time: ’, and a non-breaking space before : ? ! ; » and after « ---------- */
const NB = " ";
const nb = s => String(s)
  .replace(/([A-Za-zÀ-ÿŒœ])'(?=[A-Za-zÀ-ÿŒœ])/g, "$1’")
  .replace(/« /g, "«" + NB).replace(/ ([»?!:;])/g, NB + "$1");
const $ = s => document.querySelector(s);
const put = (el, html) => { el.innerHTML = nb(html); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = { pdf: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>' };
const icon = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- Screens: ? Pourquoi · Avant la séance · the 4 steps · ✓ Fin ---------- */
const SCREENS = [{ id: "why" }, { id: "prep" }, ...STEPS.map(s => ({ id: "step", step: s.n })), { id: "end" }];
const MARKS = { why: "?", prep: "✎", end: "✓" };
const stepAt = n => 1 + n, LAST = STEPS.length;
let cur = 0;
const seen = new Set(), done = new Set(), introSeen = new Set();
const frame = Frame.init({ guide: "Anne", pose: "anne", now: 1, onStep: k => go(k - 1),
  steps: SCREENS.map(S => S.step ? { mark: S.step, label: `Étape ${S.step} · ${STEPS[S.step - 1].min}&nbsp;min` } : { mark: MARKS[S.id], label: SCREEN_LABELS[S.id] }) });
const { scorm } = frame;
const talk = t => frame.talk({ ...t, say: nb(t.say || ""), more: nb(t.more || ""), keep: (t.keep || []).map(nb), lead: nb(t.lead || ""), wait: nb(t.wait || ""),
  replies: (t.replies || []).map(([l, a, g]) => [nb(l), a, g]) });

/* ---------- Learning data (unchanged) ----------
     intro_vue             1 = pourquoi, 2 = les notions (both on « ? Pourquoi »), 3 = préparer la séance, 4 = le plan (both on
                           « Avant la séance »), 5 = ce que l'activité simplifie (the table, from « ✓ Fin »)
     criteres_trouves      step 1: the features found, in order, e.g. "Deux yeux | Une bouche"
     criteres_erreurs      step 1: the features tried that are not on all the cards
     robot_genere          step 2: the pieces of the robot, at « Mon robot est prêt »; plausibilite: how many pieces are as in the examples
     questions_ouvertes, pistes_affichees   step 3: the questions unfolded (both lines are the same)
     pourtoi_ouvert        the « Pour toi » buttons opened, as step:tab; idees_retournees, simp_retournees: the answers shown
     trace_ecrite          step 4: "3" once the three lines of the trace écrite are written
   Completed when step 4 is done (the trace écrite written). */
const rec = (id, v, opt) => { scorm.record(id, v, opt); scorm.commit(); };
const sawIntro = (...codes) => { const before = introSeen.size; codes.forEach(c => introSeen.add(c)); if (introSeen.size > before) rec("intro_vue", [...introSeen].sort().join(" ")); };

const isDone = k => k !== cur && (SCREENS[k].step ? done.has(SCREENS[k].step) : seen.has(k));
const canNext = () => { const S = SCREENS[cur]; if (S.id === "end") return false; return S.step ? done.has(S.step) : true; };
function drawSteps() { frame.steps(cur + 1, k => ({ done: isDone(k - 1), can: seen.has(k - 1) || SCREENS[k - 1].step })); }
function go(i) {
  try { scorm.set("cmi.core.lesson_location", String(i)); } catch {}   // the screen, for coming back (usability review, 26 Nov 2026)
  closeDecks(false);
  cur = i; seen.add(i); me = null;
  const S = SCREENS[i], desk = $("#desk");
  desk.scrollTop = 0;
  if (S.id === "why") { sawIntro(1, 2); drawWhy(); }
  else if (S.id === "prep") { sawIntro(3, 4); drawPrep(); }
  else if (S.id === "end") drawEnd(false);
  else { desk.innerHTML = `<aside class="card-consigne" id="consigne" hidden><span class="lab">${CONSIGNE_LABEL}</span><p id="consigne-t"></p></aside><div class="board" id="board"></div>`; render(); }
  drawSteps();
}
function finishStep(n) {
  if (done.has(n)) return;
  done.add(n);
  if (n === LAST && scorm.get("cmi.core.lesson_status") !== "completed") { scorm.set("cmi.core.lesson_status", "completed"); scorm.commit(); }
  drawSteps();
}

/* ---------- Anne during a step: what you do (her line), the Consigne on the desk, her questions; the way on is on the desk ---------- */
let last = null, me = null;
const nextLabel = () => SCREENS[cur].step === LAST ? BTN.finish : BTN.nextStep;
function classe(t) { last = { t }; if (!me) showStep(); }
function showStep() {
  const { t } = last, n = SCREENS[cur].step;
  $("#consigne").hidden = !t.say; put($("#consigne-t"), t.say || "");
  talk({ pose: done.has(n) ? "debout" : /pas sur toutes|Regarde|ne sont|n’est pas/.test(t.now) ? "pense" : "montre", say: t.now, lead: ASK_LEAD,
    wait: canNext() ? "" : nextLabel(),
    replies: [...(canNext() ? [[nextLabel(), () => go(cur + 1), true]] : []), ...meTabs(n).map(k => [ME_CHIPS[k], () => openMe(k)])] });
}
function board(html) { put($("#board"), html); }
function render() { const n = SCREENS[cur].step; [r1, r2, r3, r4][n - 1](); }

/* ---------- « Pour toi »: three questions, answered in Anne's bubble (same texts as the old drawer) ---------- */
const TAB_KEY = { why: "pourquoi", ideas: "idees", simp: "simp" };
const meTabs = n => ["why", "ideas", ...(SIMP.some(s => s.at.includes(n)) ? ["simp"] : [])];
const meOpened = [], ideaSeen = new Set(), simpSeen = new Set();
const back = () => [BACK_LABEL, () => { me = null; showStep(); }];
function openMe(tab) {
  const n = SCREENS[cur].step, item = `${n}:${TAB_KEY[tab]}`;
  if (!meOpened.includes(item)) { meOpened.push(item); rec("pourtoi_ouvert", meOpened.join(" ")); }
  me = { tab, k: 0 }; drawMe();
}
function drawMe() {
  const n = SCREENS[cur].step, h = HELP[n - 1], { tab, k } = me;
  if (tab === "why") return talk({ pose: "pense", say: h.teaser.why,
    more: `<p>${h.why}</p>${h.anne ? `<h4>${ME_LBL.anne}</h4><p>« ${h.anne} »</p>` : ""}${h.more ? `<h4>${ME_LBL.more}</h4><p>${h.more}</p>` : ""}`, replies: [back()] });
  if (tab === "ideas") {
    const d = h.ideas[k], turned = ideaSeen.has(`${n}:${k}`), lastIdea = k === h.ideas.length - 1;
    return talk({ pose: turned ? "montre" : "pense", say: `${ME_LBL.kidSays} ${d.idea}`,
      more: turned ? `${d.because ? `<p><b>${ME_LBL.because}&nbsp;:</b> ${d.because}</p>` : ""}<p><b>${ME_LBL.fact}&nbsp;:</b> ${d.fact}</p>${lastIdea ? `<p><b>${ME_LBL.ask}&nbsp;:</b> ${h.ask}</p><p><b>${ME_LBL.useT}&nbsp;:</b> ${h.use}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${h.avoid}</p>` : ""}` : IDEA_ASK,
      replies: [...(!turned ? [[IDEA_SHOW, () => { ideaSeen.add(`${n}:${k}`); rec("idees_retournees", [...ideaSeen].join(" ")); drawMe(); }]]
        : !lastIdea ? [[NEXT_IDEA(k + 2, h.ideas.length), () => { me.k++; drawMe(); }]] : []), back()] });
  }
  const rows = SIMP.filter(s => s.at.includes(n)), r = rows[k], flipped = simpSeen.has(`${n}:${k}`), lastCard = k === rows.length - 1;
  talk({ pose: "pense", say: `${ME_LBL.inGame}&nbsp;: ${r.game}`,
    more: flipped ? `<p><b>${ME_LBL.ai}&nbsp;:</b> ${r.ai}</p>${r.risk ? `<p><b>${ME_LBL.risk}&nbsp;:</b> ${r.risk}</p>` : ""}` : SIMP_ASK,
    replies: [...(!flipped ? [[FLIP, () => { simpSeen.add(`${n}:${k}`); rec("simp_retournees", [...simpSeen].join(" ")); drawMe(); }]]
      : !lastCard ? [[NEXT_CARD(k + 2, rows.length), () => { me.k++; drawMe(); }]] : []), back()] });
}

const deckCard = (src, label, alt, cls = "") => `<div class="deckcard ${cls}"><b>${label}</b><img src="${src}" alt="${esc(alt)}"></div>`;

/* ============ Step 1: what do all the robots have in common? (unchanged) ============ */
const S1 = {};
function resetS1() { Object.assign(S1, { found: [], wrongs: [], msg: null, shake: null,
  order: [...DECKS[DECK].common, ...DECKS[DECK].others].sort((a, b) => a.localeCompare(b, "fr")) }); }
resetS1();
const enough = () => Math.min(ENOUGH, DECKS[DECK].common.length);
function r1() {
  const d = DECKS[DECK], N = d.common.length, n = S1.found.length;
  board(`<div class="obs">${deckCard(d.img, d.name, d.name)}
    <div class="crit"><h3>${OBS_TITLE}<span>${OBS_COUNT(n, N)}</span></h3>
    <div class="feats">${S1.order.map((f, k) => { const ok = S1.found.includes(f), no = S1.wrongs.includes(f);
      return `<button type="button" class="feat ${ok ? "ok" : ""} ${no ? "no" : ""} ${S1.shake === f ? "shake" : ""}" data-feat="${k}" aria-pressed="${ok}" ${ok || no ? "disabled" : ""}>${f}</button>`; }).join("")}</div>
    <p class="others">${OBS_OTHERS}</p></div></div>`);
  S1.shake = null;
  if (n === N) return classe(SAY1.all);
  if (n >= enough()) { const t = SAY1.enough(n, N); return classe({ now: S1.msg || t.now, say: t.say }); }
  classe({ now: S1.msg || SAY1.start.now, say: SAY1.start.say });
}
function s1click(e) {
  const b = e.target.closest("[data-feat]"); if (!b || b.disabled) return;
  const f = S1.order[+b.dataset.feat], d = DECKS[DECK];
  if (!d.common.includes(f)) {
    S1.wrongs.push(f); rec("criteres_erreurs", S1.wrongs.join(" | "));
    S1.msg = SAY1.wrong(f); S1.shake = f; return render();
  }
  S1.found.push(f); rec("criteres_trouves", S1.found.join(" | "));
  S1.msg = S1.found.length < enough() ? SAY1.more(S1.found.length, d.common.length) : null;
  if (S1.found.length >= enough()) finishStep(1);
  render();
}

/* ============ Step 2: the machine draws a new robot (unchanged) ============ */
const S2 = {};
function resetS2() { Object.assign(S2, { robot: Object.fromEntries(PIECES.map(p => [p.id, p.options[p.options.length - 1].v])), judged: false }); }
resetS2();
const optOf = (p, r) => p.options.find(o => o.v === r[p.id]);
function head(r) {
  const c = r.couleur, round = r.forme === "ronde";
  const shape = round ? `<circle cx="150" cy="150" r="88" fill="${c}" stroke="#333" stroke-width="5"/>` : `<rect x="62" y="70" width="176" height="160" rx="28" fill="${c}" stroke="#333" stroke-width="5"/>`;
  const eyes = r.yeux === "carres" ? `<rect x="98" y="112" width="34" height="34" fill="#fff" stroke="#333" stroke-width="4"/><rect x="168" y="112" width="34" height="34" fill="#fff" stroke="#333" stroke-width="4"/><rect x="108" y="122" width="14" height="14" fill="#111"/><rect x="178" y="122" width="14" height="14" fill="#111"/>`
             : r.yeux === "triangles" ? `<polygon points="96,146 115,110 134,146" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/><polygon points="166,146 185,110 204,146" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/><circle cx="115" cy="134" r="6" fill="#111"/><circle cx="185" cy="134" r="6" fill="#111"/>`
                                     : `<circle cx="115" cy="130" r="19" fill="#fff" stroke="#333" stroke-width="4"/><circle cx="185" cy="130" r="19" fill="#fff" stroke="#333" stroke-width="4"/><circle cx="115" cy="130" r="8" fill="#111"/><circle cx="185" cy="130" r="8" fill="#111"/>`;
  const sides = r.cotes === "oreilles" ? `<rect x="40" y="120" width="24" height="52" rx="8" fill="#555"/><rect x="236" y="120" width="24" height="52" rx="8" fill="#555"/>`
              : r.cotes === "antennes" ? `<path d="M62 130 L30 104 M238 130 L270 104" stroke="#333" stroke-width="5"/><circle cx="30" cy="104" r="8" fill="#f2a33a"/><circle cx="270" cy="104" r="8" fill="#f2a33a"/>` : "";
  const top = r.dessus === "antenne" ? `<line x1="150" y1="${round ? 62 : 70}" x2="150" y2="30" stroke="#333" stroke-width="5"/><circle cx="150" cy="24" r="11" fill="#e0574f" stroke="#333" stroke-width="3"/>` : "";
  const mouth = r.bouche === "grille" ? `<rect x="108" y="172" width="84" height="30" rx="5" fill="#fff" stroke="#333" stroke-width="4"/>${[129, 150, 171].map(x => `<line x1="${x}" y1="172" x2="${x}" y2="202" stroke="#333" stroke-width="3"/>`).join("")}`
                                      : `<path d="M112 180 Q150 210 188 180" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 300 260" role="img" aria-label="${esc(GEN_NEW)}"><rect width="300" height="260" fill="#fff"/>${sides}${top}${shape}${eyes}${mouth}</svg>`;
}
const robotCard = (label, cls = "new") => `<div class="deckcard ${cls}"><b>${label}</b>${head(S2.robot)}</div>`;
const offList = () => PIECES.filter(p => !optOf(p, S2.robot).ok).map(p => `${p.label.toLowerCase()} : ${optOf(p, S2.robot).label}`);
function r2() {
  const d = DECKS[DECK], off = offList();
  board(`<div class="gen">${deckCard(d.img, GEN_EXAMPLES, d.name)}
    <div class="col">${robotCard(GEN_NEW)}${S2.judged ? `<p class="score">${GEN_SCORE(PIECES.length - off.length, PIECES.length)}${off.length ? ` ${GEN_OFF(off.join(", "))}` : ""}</p>` : ""}
      <div><button type="button" class="${S2.judged ? "tool" : "chip go"}" data-act="ready">${BTN.ready}</button></div></div>
    <div class="pieces">${PIECES.map(p => `<div class="prow2"><b>${p.label}</b><div>${p.options.map(o =>
      `<button type="button" class="pc ${S2.robot[p.id] === o.v ? "on" : ""}" data-piece="${p.id}" data-v="${o.v}" aria-pressed="${S2.robot[p.id] === o.v}">${p.id === "couleur" ? `<i style="background:${o.v}"></i>` : ""}${o.label}</button>`).join("")}</div></div>`).join("")}</div></div>`);
  if (!S2.judged) return classe(SAY2.start);
  classe(off.length ? SAY2.off(off.length) : SAY2.ok);
}
function s2click(e) {
  const b = e.target.closest("[data-piece]"); if (!b) return;
  S2.robot[b.dataset.piece] = b.dataset.v; S2.judged = false;
  render();
}
function judge() {
  const off = offList();
  rec("robot_genere", PIECES.map(p => optOf(p, S2.robot).label).join(" "));
  rec("plausibilite", PIECES.length - off.length, { type: "numeric" });
  S2.judged = true; finishStep(2); me = null; render();
}

/* ============ Step 3: compare the groups (unchanged) ============ */
const S3 = { open: -1, opened: [] };
const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
function r3() {
  board(`<div class="cmp">${Object.keys(DECKS).map(k => deckCard(DECKS[k].img, DECKS[k].short, DECKS[k].name)).join("")}${robotCard(CMP_MINE)}</div>
    <div class="drops">${DISCUSS.map((d, k) => `<div class="drop ${k === S3.open ? "open" : ""} ${S3.opened.includes(k + 1) ? "seen" : ""}">
      <button type="button" data-q="${k}" aria-expanded="${k === S3.open}"><small>${Q_LABEL(k + 1)}</small><b>${d.title}</b>${CHEV}</button>
      <div class="dbody"><p class="ask"><b>${ASK_LABEL}</b>${d.ask}</p><p class="ans"><b>${KEY_LABEL}</b>${d.key}</p></div></div>`).join("")}</div>`);
  const n = S3.opened.length;
  if (n >= DISCUSS.length) return classe(SAY3.end);
  if (n) { const k = DISCUSS.findIndex((_, i) => !S3.opened.includes(i + 1)); return classe({ now: SAY3.one.now, say: SAY3.one.say[k] }); }
  classe(SAY3.start);
}
function s3click(e) {
  const b = e.target.closest("[data-q]"); if (!b) return;
  const k = +b.dataset.q;
  S3.open = S3.open === k ? -1 : k;
  if (S3.open === k && !S3.opened.includes(k + 1)) {
    S3.opened.push(k + 1);
    rec("questions_ouvertes", [...S3.opened].sort().join(" ")); rec("pistes_affichees", [...S3.opened].sort().join(" "));
    if (S3.opened.length === DISCUSS.length) finishStep(3);
  }
  render();
}

/* ============ Step 4: the class writes the trace écrite, one line at a time (unchanged) ============ */
const S4 = { shown: 0, fresh: false };
function traceShow(k) {
  const t = TRACE[k], lbl = `<p class="pt">${SHOW_LABEL[t.show]}</p>`, d = DECKS[DECK];
  if (t.show === "deck") return `${lbl}<img src="${d.img}" alt="${esc(d.name)}">`;
  if (t.show === "robot") return `${lbl}<div class="tpair"><figure><img src="${d.img}" alt="${esc(d.name)}"><figcaption>${d.short}</figcaption></figure>
    <figure>${head(S2.robot)}<figcaption>${CMP_MINE}</figcaption></figure></div>`;
  return `${lbl}<div class="tpair groups">${Object.keys(DECKS).map(g => `<figure><img src="${DECKS[g].img}" alt="${esc(DECKS[g].name)}"><figcaption>${DECKS[g].short}</figcaption></figure>`).join("")}</div>`;
}
function r4() {
  const k = Math.min(S4.shown, TRACE.length - 1);
  board(`<div class="duo"><div class="trace paper"><p class="pt">${TRACE_LABEL}</p><ol>${TRACE.map((t, j) => j < S4.shown
    ? `<li class="${S4.fresh && j === S4.shown - 1 ? "new" : ""}">${t.a}</li>`
    : j === S4.shown ? `<li class="todo"><button type="button" class="chip go" data-act="write">${BTN.write(j + 1)}</button></li>`
    : `<li class="todo">…</li>`).join("")}</ol></div>
    <div class="tshow paper" aria-live="polite">${traceShow(k)}</div></div>`);
  S4.fresh = false;
  if (S4.shown < TRACE.length) return classe({ now: SAY4.line(S4.shown + 1).now, say: TRACE[S4.shown].q });
  classe(SAY4.end);
}
function writeLine() {
  if (S4.shown >= TRACE.length) return;
  S4.shown++; S4.fresh = true;
  if (S4.shown === TRACE.length) { rec("trace_ecrite", String(S4.shown)); finishStep(4); }
  me = null; render();
}

/* ============ ? Pourquoi · Avant la séance · ✓ Fin ============ */
function drawWhy() {
  put($("#desk"), `<h2 class="dt">${NOTIONS_TITLE}</h2><div class="notions">${NOTIONS.map(c => `<div class="ncard paper"><h3>${c.term}</h3><p>${c.def}</p>${c.yes ? `<div class="exs"><div class="ex yes"><b>${c.yes[0]}</b>${c.yes[1]}</div><div class="ex no"><b>${c.no[0]}</b>${c.no[1]}</div></div>` : ""}</div>`).join("")}</div><p class="after">${NOTIONS_AFTER}</p>`);
  const tale = () => talk({ pose: "salue", say: WHY_Q, more: `${DRAFT_TAG ? `<p><b>${DRAFT_TAG}</b></p>` : ""}${TALE.map(p => `<p>${p}</p>`).join("")}`,
    replies: [[WHY_NEXT, () => go(1), true], [IDEA_LABEL, () => talk({ pose: "pense", say: IDEA_LABEL, more: IDEA, replies: [[BACK_LABEL, tale]] })]] });
  tale();
}
function planHTML(withFound) {
  const total = START_MIN + STEPS.reduce((t, s) => t + s.min, 0);
  return `<div class="plan">${STEPS.map(s => `<button type="button" class="stepc ${done.has(s.n) ? "done" : ""}" data-goto="${stepAt(s.n)}">
      <span class="sn"><i>${s.n}</i>${s.min} min${done.has(s.n) ? ` · ${DONE_MARK}` : ""}</span><h3>${s.title}</h3>${withFound ? `<p>${s.found}</p>` : ""}</button>`).join("")}</div>
    ${withFound ? `<p class="total">${PLAN_SUB(STEPS.length, total)}</p>` : ""}`;
}
function drawPrep() {
  put($("#desk"), `${planHTML(true)}
    <div class="prep">
      <div class="mat paper"><h3>${PRINT_LABEL}</h3><ul>${BEFORE_LIST.map(t => `<li>${t}</li>`).join("")}</ul><p class="note">${BEFORE_NOTE}</p></div>
      <div class="side">
        <button type="button" class="thumb paper" data-act="decks"><img src="${DECKS[DECK].img}" alt="">${BTN.decks}</button>
        <div class="pdfs"><a class="tool" href="${GUIDE_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.materialShort}</a></div>
        <aside class="card-consigne"><span class="lab">${CONSIGNE_LABEL}</span><p>${BEFORE_SAY}</p></aside>
      </div></div>`);
  const main = () => talk({ pose: "montre", say: PREP_Q,
    replies: [[PREP_NEXT, () => go(stepAt(1)), true], [SHORT_TITLE, short], [WORDS_TITLE, words]] });
  const short = () => talk({ pose: "pense", say: SHORT_TITLE, keep: SHORT.map(([t, d]) => `<b>${t}</b>&nbsp;: ${d}`), more: `<p>${SHORT_KEEP}</p><p>${LONG}</p>`, replies: [[BACK_LABEL, main]] });
  const words = () => talk({ pose: "montre", say: WORDS_TITLE, more: `<p><b>${ME_LBL.useT}&nbsp;:</b> ${WORDS_USE}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${WORDS_AVOID}</p><p><b>${LINK_LABEL}&nbsp;:</b> ${LINK_TEXT}</p>`, replies: [[BACK_LABEL, main]] });
  main();
}
function drawEnd(table) {
  if (table) {
    sawIntro(5);
    put($("#desk"), `<h2 class="dt">${SIMP_TITLE}</h2><table class="simp"><thead><tr><th>${SIMP_HEAD[0]}</th><th>${SIMP_HEAD[1]}</th><th class="ai">${SIMP_HEAD[2]}</th></tr></thead>
      <tbody>${SIMP.map(s => `<tr><td>${s.game}<span class="st">${s.step}</span></td><td>${s.why}</td><td class="ai">${s.ai}</td></tr>`).join("")}</tbody></table><p class="after">${SIMP_AFTER}</p>`);
  } else {
    const SAYS = { 1: SAY1.start.say, 2: SAY2.start.say, 3: SAY3.start.say, 4: SAY4.end.say };   // each step's first line to the class
    const total = STEPS.reduce((t, s) => t + s.min, 0);
    put($("#desk"), `<article class="lesson paper${STEPS.length > 4 ? " many" : ""}">
      <header class="ls-head"><h2>${SHEET_HEAD}</h2><span>${SHEET_META(total)}</span></header>
      <ol class="ls-steps">${STEPS.map(s => `<li><button type="button" class="ls-step ${done.has(s.n) ? "done" : ""}" data-goto="${stepAt(s.n)}" title="${OPEN_STEP}">
        <i>${done.has(s.n) ? "✓" : s.n}</i><span class="ls-body"><b>${s.title}</b><small>${s.min}&nbsp;min</small><span class="ls-found">${s.found}</span>
        ${SAYS[s.n] ? `<span class="ls-say"><em>${CONSIGNE_LABEL}</em> ${SAYS[s.n]}</span>` : ""}</span></button></li>`).join("")}</ol>
      <aside class="ls-mat"><h3>${MATERIAL}</h3>
        <button type="button" class="ls-sheet" data-act="decks"><img src="${DECKS[DECK].img}" alt="">${BTN.decks}</button>
        <a class="tool" href="${MATERIAL_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.material}</a><a class="tool" href="${GUIDE_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.guide}</a></aside>
    </article>`);
  }
  talk({ pose: "debout", say: END_TITLE, keep: TAKEAWAY,
    replies: [[BACK_TO_Q, BACK_URL, true], table ? [SIMP_BACK, () => drawEnd(false)] : [SIMP_BTN, () => drawEnd(true)], [BTN.again, again]] });
}

/* ---------- The three decks, large ---------- */
let lbOpener = null;
put($("#lb-decks"), Object.keys(DECKS).map(k => `<div>${DECKS[k].name}<img src="${DECKS[k].img}" alt="${esc(DECKS[k].name)}"></div>`).join(""));
put($("#lb-cap"), DECKS_CAP);
function openDecks(btn) { lbOpener = btn; $("#lightbox").hidden = false; setTimeout(() => $("#lb-close").focus({ preventScroll: true }), 30); }
function closeDecks(refocus = true) { if ($("#lightbox").hidden) return; $("#lightbox").hidden = true; if (refocus && lbOpener && document.contains(lbOpener)) lbOpener.focus({ preventScroll: true }); }

/* ---------- Clicks ---------- */
function again() {
  resetS1(); resetS2(); S3.open = -1; S3.opened = []; Object.assign(S4, { shown: 0, fresh: false });
  done.clear(); seen.clear();
  go(0);
}
const ACT = { again, decks: b => openDecks(b), ready: () => judge(), write: () => writeLine() };
$("#desk").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) return ACT[a.dataset.act](a);
  const g = e.target.closest("[data-goto]"); if (g) return go(+g.dataset.goto);
  const n = SCREENS[cur].step; if (!n || !e.target.closest("#board")) return;
  if (e.target.closest("[data-feat], [data-piece], [data-q]")) me = null;
  if (n === 1) s1click(e); else if (n === 2) s2click(e); else if (n === 3) s3click(e);
});
$("#lb-close").addEventListener("click", () => closeDecks());
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeDecks(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDecks(); });

{ const saved = parseInt(scorm.get("cmi.core.lesson_location"), 10), last = SCREENS.length - 1;
  go(scorm.get("cmi.core.lesson_status") === "completed" ? last : saved >= 0 && saved <= last ? saved : 0); }   // coming back: where the teacher was
</script>
