<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours d’une requête</title>
<link rel="stylesheet" href="../../shared/frame.css">
<!--
  Parcours d’une requête, matériel éducatif (ECM), dans le cadre H2 depuis le 26 nov. 2026 (comme Robot dessine, module 1) ;
  avant : old/index-avant-h2.html (mise en page de « La Machine à Histoires » : colonne de Claudia, jeu à droite, tiroir « Pour comprendre »).
  Le jeu, ses textes et ses données sont les mêmes ; le plateau garde sa taille d'origine et est mis à l'échelle du pupitre.
  Les textes sont tous dans la partie CONTENU du script, plus bas ; les nouveaux libellés du cadre sont marqués.
-->
<style>
  /* Parcours d’une requête in the H2 frame. Claudia stays beside the work as tutor: what you do now (her line), « Demande à
     Claudia » (Pourquoi cette étape ? · Les élèves pensent · Ce que le jeu simplifie · Peu de temps ?), the way on as the one
     mint button. 7 screens: ? Pourquoi · Avant la séance · the 4 steps · ✓ Fin (the lesson sheet). */

  .desk { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .desk h2.dt { font-size: calc(15 * var(--u)); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--violet); }
  /* the game: the old board at its own size (BOARD_W × BOARD_H), scaled to the space left on the desk */
  .boardwin { position: relative; flex: 1; min-height: 120px; }
  .game { position: absolute; left: 0; top: 0; transform-origin: 0 0; font: 400 22px/1.4 Inter, system-ui, sans-serif; color: #1F1F1F; }
  .game > .board { height: 100%; }
  .under { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .under .grow { flex: 1; }
  #acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  #acts .chip { min-height: 44px; font-size: calc(16 * var(--u)); }
  #consigne { align-self: flex-start; max-width: min(640px, 100%); }   /* the desk's bottom space keeps it clear of the mint button */
  .tool[hidden] { display: none; }
  .card-consigne[hidden] { display: none; }
  .desk > .card-consigne { align-self: flex-start; max-width: 560px; flex: none; }   /* at the top of the desk, as in Module 1: always in the same place (user, 26 Nov 2026) */
  .rotate { display: none; }
  /* ? Pourquoi: the notions */
  .notions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .ncard { padding: 18px 20px; } .ncard:nth-child(2) { rotate: .6deg; }
  .ncard h3 { font-size: calc(21 * var(--u)); color: var(--g-deep); margin-bottom: 6px; } .ncard p { font-size: calc(17 * var(--u)); line-height: 1.45; }
  .after { font-size: calc(15 * var(--u)); color: var(--soft); }
  /* Avant la séance */
  .plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stepc { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--hair); background: #fff; text-align: left; font: inherit; cursor: pointer; }
  .stepc:hover { border-color: var(--g-deep); }
  .stepc .sn { display: flex; align-items: center; gap: 8px; font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .stepc .sn i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); border: 2px solid var(--g-deep); }
  .stepc.done .sn i { background: var(--g-deep); color: #fff; }
  .stepc h3 { font-size: calc(18 * var(--u)); line-height: 1.25; color: var(--g-deep); } .stepc p { font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--soft); }
  .total { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--g-deep); text-align: right; margin-top: -6px; }
  .prep { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mat { padding: 14px 16px; } .mat h3 { font-size: calc(19 * var(--u)); color: var(--g-deep); margin-bottom: 8px; }
  .mat ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: calc(17 * var(--u)); line-height: 1.4; }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
  .thumb { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border: 0; cursor: pointer; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); rotate: -1deg; text-align: left; }
  .thumb + .thumb { rotate: .8deg; }
  .thumb img { width: 84px; height: auto; border-radius: 4px; }
  .pdfs { display: flex; flex-wrap: wrap; gap: 8px; }
  /* ✓ Fin: « Ce que l'activité simplifie » */
  .simp { width: 100%; border-collapse: collapse; font-size: calc(14 * var(--u)); line-height: 1.4; background: #fff; }
  .simp th { text-align: left; padding: 8px 10px; font-size: calc(13 * var(--u)); color: var(--g-deep); border-bottom: 2px solid var(--g-deep); }
  .simp th.ai, .simp td.ai { background: var(--lilac-tint); }
  .simp td { padding: 7px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  .simp td .st { display: block; font-size: calc(12 * var(--u)); color: var(--soft); }
  .scroll { min-height: 0; overflow: auto; }
  /* the last screen: the lesson as a sheet (as in Module 1) */
  .lesson { --u: clamp(1px, calc(.08px + .1vh), 1.35px); display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 22vw, 280px); grid-template-rows: auto 1fr; gap: 6px clamp(20px, 2.6vw, 36px); align-self: start; padding: clamp(18px, 3vh, 28px) clamp(20px, 2.6vw, 32px); rotate: -.3deg; }
  .ls-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--g-tint); }
  .ls-head h2 { font-size: clamp(1.3rem, 3vh, 1.7rem); color: var(--g-deep); }
  .ls-head span { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .ls-steps::before { content: ""; position: absolute; left: 17px; top: 24px; bottom: 24px; width: 2px; background: var(--g-hell); }
  .ls-step { position: relative; width: 100%; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 6px 10px 6px 0; border: 0; border-radius: 10px; background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .ls-step:hover { background: var(--g-tint); }
  .ls-step i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); background: #fff; border: 2px solid var(--g-deep); }
  .ls-step.done i { background: var(--g-deep); color: #fff; }
  .ls-body { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .ls-body b { font-size: clamp(16px, 2.2vh, 18px); color: var(--g-deep); }
  .ls-body small { font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-found { grid-column: 1 / -1; font-size: calc(14 * var(--u)); line-height: 1.35; color: var(--soft); }
  .ls-say { grid-column: 1 / -1; margin-top: 2px; padding: 4px 8px; border-radius: 8px; background: var(--g-tint); font-size: calc(14 * var(--u)); line-height: 1.35; color: var(--g-deep); }
  .ls-say em { display: inline; margin-right: 4px; font-style: normal; font-size: calc(12 * var(--u)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .ls-mat { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 10px; padding-left: clamp(16px, 2vw, 28px); border-left: 2px dashed var(--hair); }
  .ls-mat h3 { font-size: calc(13 * var(--u)); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--violet); }
  .ls-sheet { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1.5px solid var(--hair); background: #fff; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); cursor: pointer; }
  .ls-sheet:hover { border-color: var(--g-deep); }
  .ls-sheet img { width: 100%; max-height: 26vh; object-fit: contain; box-shadow: var(--paper-shadow); rotate: 1.5deg; }
  .ls-mat .tool { justify-content: center; }
  /* a picture, large (the printed sheets, the classroom) */
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(11, 81, 77, .45); display: grid; place-items: center; padding: 24px; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: var(--paper-shadow); background: #fff; }
  .lightbox .x { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 10px; border: 0; background: #fff; color: var(--g-deep); cursor: pointer; display: grid; place-items: center; }
  /* short screens (laptops at 720 px): the plan without its summaries, smaller papers, so « Avant la séance » stays on one screen */
  @media (max-height: 800px) and (min-width: 761px) {
    .stepc p { display: none; } .stepc { padding: 8px 10px; }
    .mat { padding: 10px 14px; } .mat ul { font-size: calc(14 * var(--u)); gap: 4px; }
    .thumb { padding: 6px 10px 6px 6px; font-size: calc(14 * var(--u)); } .thumb img { width: 60px; }
    .side .card-consigne p { font-size: calc(14 * var(--u)); }
    .notions .ncard p { font-size: calc(14 * var(--u)); line-height: 1.4; }
    .lesson { padding: 14px 18px; gap: 4px 20px; } .ls-head { padding-bottom: 6px; } .ls-steps { gap: 0; } .ls-step { padding-block: 3px; }
    .ls-found { display: none; } .ls-say { font-size: calc(13 * var(--u)); margin-top: 0; padding: 3px 8px; }
    .ls-sheet img { max-height: 18vh; } .ls-mat { gap: 6px; }
  }
  @media (max-height: 640px) and (min-width: 761px) { .ls-say { display: none; } .ls-found { display: block; } }
  @media (max-width: 1100px) { .notions { grid-template-columns: 1fr; } .plan { grid-template-columns: repeat(2, minmax(0, 1fr)); } .prep { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .lesson { grid-template-columns: 1fr; } .ls-mat { grid-row: auto; grid-column: 1; padding-left: 0; border-left: 0; } }
  /* tablets held upright: the board is small, as before the activity asks to turn the tablet (ROTATE_MSG) */
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: block; padding: 10px 12px; border-radius: 10px; background: var(--lilac-tint); color: var(--violet); font-size: calc(14 * var(--u)); font-weight: 700; } }
  @media (max-width: 760px) {
    .boardwin { flex: none; }
    .card-consigne { max-width: none; }
    .rotate { display: block; padding: 10px 12px; border-radius: 10px; background: var(--lilac-tint); color: var(--violet); font-size: calc(14 * var(--u)); font-weight: 700; }
  }

  /* ? Pourquoi: the path of a request (5 steps) above the 4 notions */
  .npath ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; counter-reset: np; }
  .npath li { position: relative; counter-increment: np; background: var(--g-tint); border-radius: 8px; padding: 8px 10px 8px 40px; font-size: calc(14 * var(--u)); line-height: 1.35; }
  .npath li::before { content: counter(np); position: absolute; left: 10px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--g-deep); color: #fff; font: 700 calc(13 * var(--u))/22px Inter, sans-serif; text-align: center; }
  .notions.four { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
  .notions.four .ncard { padding: 10px 14px; }
  .notions.four .ncard p { font-size: calc(14 * var(--u)); }
  .ncard .nat { display: block; margin-bottom: 2px; font-size: calc(12 * var(--u)); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--violet); }
  /* the 4 role cards */
  .rgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .rgrid.small { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rthumb { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 6px; }
  .rthumb img { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: var(--paper-shadow); }
  .rthumb:nth-child(odd) img { rotate: -1.2deg; } .rthumb:nth-child(even) img { rotate: .9deg; }
  @media (max-height: 800px) and (min-width: 761px) {
    .npath li { font-size: calc(13 * var(--u)); line-height: 1.3; padding: 6px 8px 6px 32px; } .npath li::before { left: 7px; top: 6px; }
    .notions.four .ncard p { font-size: calc(13 * var(--u)); line-height: 1.38; } .notions.four .ncard h3 { font-size: calc(15 * var(--u)); margin-bottom: 3px; }
    .desk { gap: 8px; }
  }
  @media (max-width: 1100px) { .notions.four { grid-template-columns: 1fr; } .npath ol { grid-template-columns: 1fr; } }

  /* ---------- The game's own look (the old page's board, unchanged, scoped to .game) ---------- */
  .game {
    --g-tint:#E9FCF4; --g-hell:#BBF2DB; --g-main:#77E5B6; --g-dunkel:#16AAA1; --g-deep:#0B514D;
    --l-tint:#F4EBFF; --l-hell:#E4CCFF; --l-main:#A85CFF; --l-deep:#600FBD;
    --red:#C4314F;
    --page:#FBFBF9; --card:#FFFFFF; --grau:#F7F7F7; --hair:#E6E6E6; --g3:#BFBFBF; --soft:#595959; --ink:#1F1F1F;
    --paper:#FFFDF6;  /* les cartes du jeu (papier) */
    --r:8px;
    --head:60px;      /* le bandeau du haut, avec le titre de l'écran */
    --foot:66px;      /* la barre du bas ; l'écran prend le reste : 900 − 72 − 76 = 752 px */
    --dash:#8C8C8C;   /* les traits pointillés et les points creux de la ligne de la leçon (3,3 : 1 sur blanc) */
  }
  .game .board { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
  .game .board.fade > * { animation: g-fade .35s both; }
  @keyframes g-fade { from { opacity: 0; } }
  .game .blabel { font: 500 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .board > .oq.big { margin: auto 30px; }
  /* ---------- Like « La Machine à Histoires » (20 Nov 2026): on top of the board, the path of the demand
     (Prompteur → [la machine : Encodeur → Calculateur → Rédacteur] → la réponse); under it, a « Ce qui se passe » line ---------- */
  .game .focus { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .game .focus .rcol { overflow-y: auto; }
  .game .focus > .oq.big { margin: auto 30px; }
  .game .path { flex: none; display: flex; align-items: center; justify-content: center; gap: 4px; padding-top: 24px; }
  .game .mband { position: relative; display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 12px; background: #efece4; }
  .game .mband .ml { position: absolute; left: 10px; top: -24px; white-space: nowrap; font: 600 18px/1.2 "Inter", system-ui, sans-serif; color: #5b574d; }
  .game .pnode { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 1.5px solid #d6d1c4; background: #fff; font: 600 19px/1.2 "Inter", system-ui, sans-serif; color: #5b574d; white-space: nowrap; }
  .game .pnode img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
  .game .pnode.done { color: var(--g-deep); border-color: var(--g-hell); }
  .game .pnode.done::after { content: "✓"; margin-left: 2px; color: var(--g-deep); font-weight: 700; }
  .game .ptok { font: 400 22px/1 "Inter", system-ui, sans-serif; color: #12968a; padding: 0 2px; }
  .game .capt { flex: none; padding: 4px 8px 0; }
  .game .capt p { margin: 0; font-size: 21px; line-height: 1.35; color: var(--ink); } .game .capt p b { font-weight: 600; color: #4a463e; }
  @keyframes g-fade { from { opacity: 0; } }
  .game .blabel { font: 500 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }

  /* ---------- Étape 1 : la vidéo, puis les 4 cartes personnages ---------- */
  .game .video { margin: auto; width: 760px; display: flex; align-items: center; gap: 28px; padding: 30px 36px; border-radius: 14px; background: var(--grau); border: 1px solid var(--hair); }
  .game .video svg { flex: none; width: 96px; height: 96px; color: var(--g-deep); }
  .game .video b { display: block; font: 600 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); margin-bottom: 6px; }
  .game .video p { font-size: 27px; font-weight: 600; line-height: 1.3; }
  .game .rrow { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .game .rcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 8px 8px; border: 1.5px solid var(--hair); border-radius: 12px; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .game .rcard img { width: 108px; height: 152px; object-fit: cover; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.15); }
  .game .rcard span { font-size: 21px; font-weight: 600; }
  .game .rcard:hover { border-color: var(--g-dunkel); }
  .game .rcard.read { border-color: var(--g-hell); }
  .game .rcard.sel { border-color: var(--g-deep); box-shadow: 0 0 0 3px var(--g-hell); }
  .game .rcard .ok { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--g-deep); color: #fff; display: grid; place-items: center; }
  .game .rcard .ok svg { width: 18px; height: 18px; }
  .game .rbio { flex: 1; min-height: 0; overflow: auto; padding: 12px 20px; border-radius: var(--r); background: var(--paper); border: 1px solid #E5DFCC; font-size: 20px; line-height: 1.4; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-content: start; }
  .game .rbio h4 { grid-column: 1 / -1; margin: 0 0 2px; font-size: 24px; font-weight: 600; }
  .game .rbio dt { font: 600 17px/1.6 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .rbio dd { margin: 0; }
  .game .rbio.empty { display: grid; place-items: center; grid-template-columns: 1fr; color: var(--soft); }

  /* ---------- Étape 2 : le jeu de cartes. En haut la carte piochée, dessous les 4 personnages en colonnes ---------- */
  .game .drawrow { flex: none; display: flex; justify-content: center; padding: 6px 0 4px; }
  .game .drawn { position: relative; width: 640px; min-height: 96px; padding: 12px 26px; border-radius: 10px; background: var(--paper); border: 1px solid #E5DFCC; box-shadow: 0 6px 16px rgba(0,0,0,.14); text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px; animation: g-deal .45s cubic-bezier(.16, 1, .3, 1) both; }
  .game .drawn small { font: 600 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .drawn b { font-size: 26px; font-weight: 600; line-height: 1.28; }
  @keyframes g-deal { from { opacity: 0; transform: translateY(-14px); } }
  .game .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .game .rcol { min-height: 0; display: flex; flex-direction: column; gap: 5px; padding: 7px 8px; border: 1.5px solid var(--hair); border-radius: 10px; background: var(--grau); text-align: left; overflow: hidden; transition: border-color .15s, background-color .15s; }
  .game button.rcol:hover { border-color: var(--g-dunkel); background: var(--g-tint); }
  .game .rcol.no { animation: g-shake .4s; border-color: var(--red); }
  .game .rcol.hl { border: 3px solid var(--g-dunkel); background: var(--g-tint); padding: 5.5px 6.5px; }
  .game .rhead { flex: none; display: flex; align-items: center; gap: 12px; min-height: 52px; }   /* toute la colonne est le bouton (≥ 62 px) */
  .game .rhead img { width: 37px; height: 52px; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .game .rhead b { font-size: 22px; font-weight: 600; }
  .game .stp { flex: none; display: flex; gap: 8px; padding: 4px 9px; border-radius: 6px; background: var(--paper); border: 1px solid #E5DFCC; font-size: 17px; line-height: 1.27; animation: g-fade .35s both; }
  .game .stp i { flex: none; font-style: normal; font-weight: 700; color: var(--g-deep); min-width: 20px; }
  .game .qgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: center; padding: 0 10px; }
  .game .no { animation: g-shake .4s; }
  @keyframes g-shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* ---------- Étape 3 : « Pareil dans une vraie IA » / « Seulement dans le jeu » ---------- */
  .game .vote { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game .vote .sent { grid-column: 1 / -1; padding: 10px 18px; border-radius: var(--r); background: var(--grau); font-size: 23px; font-weight: 600; line-height: 1.3; text-align: center; }
  .game .vote .sent small { display: block; font: 500 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .vbtn { min-height: 62px; border-radius: var(--r); font-size: 22px; font-weight: 600; border: 2px solid; }
  .game .vbtn.ai { border-color: var(--l-deep); background: var(--l-tint); color: var(--l-deep); }
  .game .vbtn.ai:hover { background: var(--l-hell); }
  .game .vbtn.jeu { border-color: var(--soft); background: #fff; color: var(--ink); }
  .game .vbtn.jeu:hover { background: var(--grau); }

  .game .tboard { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; }

  /* few items on the desk (notions, plan, material): the group sits in the middle of the desk, not against the top

const qDone = new Set(), qText = {};
function oqHTML(id, big = false) {
  const q = OPEN_Q[id];
  if (qDone.has(id)) return `<div class="oq done"><p class="oql">${OQ_LABEL}</p><p class="oqt">${qText[id] ? esc(qText[id]) : OQ_SKIPPED_SHOWN}</p></div>`;
  return `<div class="oq ${big ? "big" : ""}"><p class="oql">${OQ_LABEL}</p><p class="oqq">${q.q}</p>
    <textarea id="oq" data-q="${id}" maxlength="255" placeholder="${q.hint}…" aria-label="${esc(OQ_LABEL + " : " + q.q)}"></textarea>
    <div class="oqa"><button type="button" class="b primary" data-act="oqok" data-q="${id}" ${(qText[id] || "").trim() ? "" : "disabled"}>${BTN.validate}</button>
    <button type="button" class="b secondary" data-act="oqskip" data-q="${id}">${BTN.skip}</button></div></div>`;
}
function oqFill() { const t = $("#oq"); if (t) t.value = qText[t.dataset.q] || ""; }
document.addEventListener("input", e => {
  if (e.target.id !== "oq") return;
  qText[e.target.dataset.q] = e.target.value;
  const ok = document.querySelector('[data-act="oqok"]'); if (ok) ok.disabled = !e.target.value.trim();
});
function answer(id, skip) {
  const v = skip ? "" : (qText[id] || "").trim();
  qText[id] = v; qDone.add(id);
  rec(id, v || OQ_SKIPPED);
  render();
}

/* ---------- A role's column: its card, then the step cards placed under it (numbered in the order of the journey) ---------- */
const roleImg = k => `images/role-${ROLES[k].id}.jpg`;
const stp = s => `<p class="stp"><i>${s + 1}.</i><span>${CARDS[s].text}</span></p>`;
function colHTML(k, list, { button = false, hl = false } = {}) {
  const tag = button ? "button" : "div";
  return `<${tag} ${button ? `type="button" data-role="${k}" aria-label="${esc(nb(`${ROLES[k].name} : ${ROLES[k].what}`))}"` : ""} class="rcol ${hl ? "hl" : ""}">
    <span class="rhead"><img src="${roleImg(k)}" alt=""><b>${ROLES[k].name}</b></span>${list.map(stp).join("")}</${tag}>`;
}

/* ============ Step 1: the video, then the 4 role cards (click one = its role and bio) ============ */
const S1 = { phase: "start", read: [], sel: -1 };
function r1() {
  if (S1.phase === "start") {
    board(`<div class="video">${icon("play", 1.6)}<div><b>${VIDEO_LABEL}</b><p>« ${VIDEO_TITLE} »</p></div></div>`);
    return classe(SAY1.start, [["toRoles", BTN.toRoles]]);
  }
  const r = ROLES[S1.sel];
  board(`<div class="rrow">${ROLES.map((x, k) => `<button type="button" class="rcard ${S1.read.includes(k) ? "read" : ""} ${k === S1.sel ? "sel" : ""}" data-rc="${k}" aria-pressed="${k === S1.sel}">
      <img src="${roleImg(k)}" alt=""><span>${x.name}</span>${S1.read.includes(k) ? `<i class="ok">${icon("check", 3)}</i>` : ""}</button>`).join("")}</div>
    ${r ? `<dl class="rbio" aria-live="polite"><h4>${r.name}</h4><dt>${ROLE_LBL.role}</dt><dd>${r.role}</dd><dt>${ROLE_LBL.bio}</dt><dd>${r.bio}</dd></dl>` : ""}`);
  classe(S1.read.length === ROLES.length ? SAY1.end : SAY1.roles);
}
function s1click(e) {
  const c = e.target.closest("[data-rc]"); if (!c || S1.phase !== "roles") return;
  const k = +c.dataset.rc; S1.sel = k;
  if (!S1.read.includes(k)) { S1.read.push(k); rec("personnages_lus", S1.read.map(i => ROLES[i].id).join(" ")); }
  if (S1.read.length === ROLES.length) finishStep(1);
  render();
}

/* ============ Step 2: the card game. The card drawn on top; click the role that does this step ============ */
const S2 = {};
function resetS2() { Object.assign(S2, { order: CARDS.map((_, k) => k).sort(() => Math.random() - .5), placed: 0, misses: CARDS.map(() => 0), where: {}, msg: null }); }
resetS2();
const placedList = k => S2.order.slice(0, S2.placed).filter(s => S2.where[s] === k).sort((a, b) => a - b);
function r2() {
  const N = CARDS.length;
  if (S2.placed < N) {
    const s = S2.order[S2.placed];
    board(`<div class="drawrow"><div class="drawn" aria-live="polite"><small>${CARD_LBL(S2.placed + 1, N)}</small><b>${CARDS[s].text}</b></div></div>
      <div class="cols">${ROLES.map((_, k) => colHTML(k, placedList(k), { button: true })).join("")}</div>`);
    return classe(S2.msg || SAY2.draw);
  }
  board(`<div class="cols">${ROLES.map((_, k) => colHTML(k, placedList(k))).join("")}</div>`);
  finishStep(2);
  classe(SAY2.end);
}
function s2click(e) {
  const r = e.target.closest("[data-role]"); if (!r || S2.placed >= CARDS.length) return;
  const k = +r.dataset.role, s = S2.order[S2.placed], c = CARDS[s];
  const isAlt = (c.alt || []).includes(k);
  if (k !== c.role && !isAlt) {
    S2.misses[s]++;
    S2.msg = { now: SAY2.wrong, say: SAY2.draw.say };
    render();
    const col = document.querySelector(`.rcol[data-role="${k}"]`); col?.classList.add("no");
    return;
  }
  S2.where[s] = k; S2.placed++;
  S2.msg = { now: isAlt ? SAY2.alt(ROLES[k].name, ROLES[c.role].name) : SAY2.ok(ROLES[k].name, c.note), say: SAY2.draw.say };
  if (S2.placed === CARDS.length) rec("cartes_etapes", S2.misses.join(" "), { result: S2.misses.every(x => !x) ? "correct" : "wrong" });
  render();
}

/* ============ Step 3: the game and the real AI. First the open question, then Claudia's answer, then 4 sentences ============ */
const S3 = {};
function resetS3() { Object.assign(S3, { phase: "lead", at: 0, ans: [] }); }
resetS3();
function bridgeCols() {
  const col = same => BRIDGE.slice(0, S3.at).map((b, k) => b.same === same ? `<div class="it ${k === S3.at - 1 ? "now" : ""}"><p>${b.text}</p><span>${b.real}</span></div>` : "").join("");
  return `<div class="bridge"><div class="bcol ai"><h4>${BTN.same}</h4>${col(true)}</div><div class="bcol jeu"><h4>${BTN.game}</h4>${col(false)}</div></div>`;
}
function r3() {
  if (S3.phase === "lead") {   // 21 nov. 2026 : plus de question ouverte pour l'enseignant·e ; on pose directement la question à la classe
    board(`<div class="answ"><div class="claudia-ans"><b>${LEAD3.label}</b>${LEAD3.text}</div></div>`);
    return classe(SAY3.lead, [["toSort", BTN.toSort]]);
  }
  if (S3.at < BRIDGE.length) {
    const b = BRIDGE[S3.at];
    board(`<div class="vote"><p class="sent"><small>${VOTE_LABEL(S3.at + 1, BRIDGE.length)}</small>« ${b.text} »</p>
      <button type="button" class="vbtn ai" data-vote="1">${BTN.same}</button><button type="button" class="vbtn jeu" data-vote="0">${BTN.game}</button></div>${bridgeCols()}`);
    const lead = S3.at ? (S3.ans[S3.at - 1] ? SAY3.right : SAY3.wrong) + SAY3.nextOne : SAY3.sort.now;
    return classe({ now: lead, say: SAY3.sort.say });
  }
  board(bridgeCols());
  finishStep(3);
  classe(SAY3.end);
}
function s3click(e) {
  const v = e.target.closest("[data-vote]"); if (!v || S3.phase !== "sort" || S3.at >= BRIDGE.length) return;
  S3.ans[S3.at] = (v.dataset.vote === "1") === BRIDGE[S3.at].same ? 1 : 0; S3.at++;
  if (S3.at === BRIDGE.length) rec("pont_vraie_ia", S3.ans.join(" "), { result: S3.ans.every(x => x) ? "correct" : "wrong" });
  render();
}

/* ============ Step 4: the class writes the trace écrite, one line at a time ============ */
const S4 = { shown: 0, fresh: false };
// what the class looks at for the line being discussed: the journey (role after role, with the numbers of their cards), or one role's column
const JOURNEY = [0, 1, 2, 3, 0];
function traceShow(k) {
  const t = TRACE[k], lbl = `<p class="pt">${SHOW_LABEL[t.show]}</p>`;
  if (t.show === "path") {
    const runs = [[0, 1], [2, 5], [6, 9], [10, 13], [14, 15]];   // the cards of each stop, in the order of the journey
    return `${lbl}<div class="chain">${JOURNEY.map((r, j) => `${j ? icon("down", 2).replace("<svg", '<svg class="arr"') : ""}<div class="lk"><img src="${roleImg(r)}" alt=""><b>${ROLES[r].name}</b><code>${runs[j][0] + 1}–${runs[j][1] + 1}</code></div>`).join("")}</div>`;
  }
  const r = t.show === "calc" ? 2 : 0;
  return `${lbl}<div class="tcol"><span class="rhead"><img src="${roleImg(r)}" alt=""><b>${ROLES[r].name}</b></span>${CARDS.map((c, s) => s).filter(s => CARDS[s].role === r).map(stp).join("")}</div>`;
}
function r4() {
  const k = Math.min(S4.shown, TRACE.length - 1);
  board(`<div class="tboard"><div class="trace"><p class="pt">${TRACE_LABEL}</p><ol>${TRACE.map((t, j) => j < S4.shown
    ? `<li class="${S4.fresh && j === S4.shown - 1 ? "new" : ""}">${t.a}</li>` : `<li class="todo">…</li>`).join("")}</ol></div>
    <div class="tshow" aria-live="polite">${traceShow(k)}</div></div>`);
  S4.fresh = false;
  if (S4.shown < TRACE.length) return classe({ now: SAY4.line(S4.shown + 1).now, say: TRACE[S4.shown].q }, [["write", BTN.write(S4.shown + 1)]]);
  classe(SAY4.end);
}
function writeLine() {
  if (S4.shown >= TRACE.length) return;
  S4.shown++; S4.fresh = true;
  if (S4.shown === TRACE.length) { rec("trace_ecrite", String(S4.shown)); finishStep(4); }
  render();
}


const pdfIcon = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

/* ---------- Screens: ? Pourquoi · Avant la séance · the 4 steps · ✓ Fin (before 26 Nov 2026: 10 screens) ---------- */
const SCREENS = [{ id: "why" }, { id: "prep" }, ...STEPS.map(s => ({ id: "step", step: s.n })), { id: "end" }];
const MARKS = { why: "?", prep: "✎", end: "✓" };
const stepAt = n => 1 + n, LAST = STEPS.length;
let cur = 0;
const seen = new Set(), done = new Set(), introSeen = new Set();
const frame = Frame.init({ guide: "Claudia", pose: "claudia", now: 1, onStep: k => go(k - 1),
  steps: SCREENS.map(S => S.step ? { mark: S.step, label: `Étape ${S.step} · ${STEPS[S.step - 1].min}&nbsp;min` } : { mark: MARKS[S.id], label: SCREEN_LABELS[S.id] }) });
const { scorm } = frame;
const talk = t => frame.talk({ ...t, say: nb(t.say || ""), more: nb(t.more || ""), keep: (t.keep || []).map(nb), replies: (t.replies || []).map(([l, a, g]) => [nb(l), a, g]) });
const INTRO_CODE = { intro: 1, notions: 2, prep: 3, plan: 4, simp: 5 };   // the numbers recorded in intro_vue (unchanged)
const sawIntro = (...ids) => { const before = introSeen.size; ids.forEach(id => introSeen.add(INTRO_CODE[id])); if (introSeen.size > before) rec("intro_vue", [...introSeen].sort().join(" ")); };

const isDone = k => k !== cur && (SCREENS[k].step ? done.has(SCREENS[k].step) : seen.has(k));
const canNext = () => { const S = SCREENS[cur]; if (S.id === "end") return false; return S.step ? done.has(S.step) : true; };
function drawSteps() { frame.steps(cur + 1, k => ({ done: isDone(k - 1), can: seen.has(k - 1) || !!SCREENS[k - 1].step })); }
function go(i) {
  try { scorm.set("cmi.core.lesson_location", String(i)); scorm.commit(); } catch {}   // the screen, for coming back (as in Module 1)
  closeLb(false);
  cur = i; seen.add(i); me = null;
  const S = SCREENS[i];
  $("#desk").scrollTop = 0;
  if (S.id === "why") { sawIntro("intro", "notions"); drawWhy(); }
  else if (S.id === "prep") { sawIntro("prep", "plan"); drawPrep(); }
  else if (S.id === "end") drawEnd(false);
  else { drawStepDesk(); render(); }
  drawSteps();
}
function finishStep(n) {
  if (done.has(n)) return;
  done.add(n);
  if (n === LAST && scorm.get("cmi.core.lesson_status") !== "completed") { scorm.set("cmi.core.lesson_status", "completed"); scorm.commit(); }
  drawSteps();
}

/* ---------- A step: the board (the game, scaled to the desk), its buttons under it, the Consigne card; Claudia says what you do ---------- */
const BOARD_W = 1176, BOARD_H = 700;
function drawStepDesk() {
  $("#desk").innerHTML = `<p class="rotate">${nb(ROTATE_MSG)}</p><aside class="card-consigne" id="consigne"><span class="lab">${CONSIGNE_LABEL}</span><p id="consigne-t"></p></aside><div class="boardwin" id="win"><div class="game" id="game" style="width:${BOARD_W}px;height:${BOARD_H}px"><div class="board" id="board" aria-label="Le jeu"></div></div></div>
    <div class="under"><span class="grow"></span><div id="acts" aria-label="Actions du jeu"></div></div>`;
  fit();
}
function fit() {
  const win = $("#win"), g = $("#game"); if (!win || !g) return;
  const phone = innerWidth <= 760;
  win.style.flex = ""; win.style.height = "";                       // first the space left on the desk, then just the board's height
  const W = win.clientWidth, H = phone ? 1e9 : win.clientHeight, s = Math.min(1, W / BOARD_W, H / BOARD_H);
  g.style.transform = `scale(${s})`;
  g.style.left = `${Math.max(0, (W - BOARD_W * s) / 2)}px`;
  win.style.flex = "none"; win.style.height = `${BOARD_H * s}px`;
}
addEventListener("resize", fit);
$(".stage").addEventListener("transitionend", e => { if (e.propertyName === "grid-template-columns") fit(); });

let last = null, me = null;   // the step's current line and buttons; the « Pour toi » answer open in her bubble (null = none)
const nextLabel = () => SCREENS[cur].step === LAST ? BTN.finish : BTN.nextStep;
function classe(t, acts = []) {
  last = { t, acts };
  put($("#acts"), acts.map(([act, label, kind = "primary"]) => `<button type="button" class="chip ${kind === "primary" ? "go" : ""}" data-act="${act}">${label}</button>`).join(""));
  if (!me) showStep();
}
function showStep() {
  const { t } = last, n = SCREENS[cur].step;
  $("#consigne").hidden = !t.say; put($("#consigne-t"), t.say || "");
  talk({ pose: done.has(n) ? "ouvre" : /^(Pas |Oui)/.test(t.now) ? "pense" : "pointe", say: t.now, lead: ASK_LEAD,
    wait: canNext() ? "" : nextLabel(),
    replies: [...(canNext() ? [[nextLabel(), () => go(cur + 1), true]] : []),
              ...meTabs(n).map(k => [ME_CHIPS[k], () => openMe(k)]), [SHORT_CHIP, () => openShort()]] });
}
function render() { const n = SCREENS[cur].step; if (!n) return; [r1, r2, r3, r4][n - 1](); }

/* ---------- « Pour toi »: buttons answered in Claudia's bubble (the texts of the old drawer) ---------- */
const TAB_KEY = { why: "pourquoi", ideas: "idees", simp: "simp" };
const meTabs = n => ["why", "ideas", ...(SIMP.some(s => s.at.includes(n)) || HELP[n - 1].more ? ["simp"] : [])];
const meOpened = [], ideaSeen = new Set(), simpSeen = new Set();
const back = () => [BACK_LABEL, () => { me = null; showStep(); }];
function openMe(tab) {
  const n = SCREENS[cur].step, item = `${n}:${TAB_KEY[tab]}`;
  if (!meOpened.includes(item)) { meOpened.push(item); rec("pourtoi_ouvert", meOpened.join(" ")); }
  me = { tab, k: 0 }; drawMe();
}
function drawMe() {
  const n = SCREENS[cur].step, h = HELP[n - 1], { tab, k } = me;
  if (tab === "why") return talk({ pose: "pense", say: h.why, more: `<h4>${ME_LBL.anne}</h4><p>${h.anne}</p>`, replies: [back()] });
  if (tab === "ideas") {
    const d = h.ideas[k], turned = ideaSeen.has(`${n}:${k}`), lastIdea = k === h.ideas.length - 1;
    return talk({ pose: turned ? "pointe" : "pense", say: `${ME_LBL.kidSays} ${d.idea}`,
      more: turned ? `${d.because ? `<p><b>${ME_LBL.because}&nbsp;:</b> ${d.because}</p>` : ""}<p><b>${ME_LBL.fact}&nbsp;:</b> ${d.fact}</p>${lastIdea ? `<p><b>${ME_LBL.ask}&nbsp;:</b> ${h.ask}</p><p><b>${ME_LBL.useT}&nbsp;:</b> ${h.use}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${h.avoid}</p>` : ""}`
        : IDEA_ASK,
      replies: [...(!turned ? [[IDEA_SHOW, () => { ideaSeen.add(`${n}:${k}`); rec("idees_retournees", [...ideaSeen].join(" ")); drawMe(); }]]
        : !lastIdea ? [[NEXT_IDEA(k + 2, h.ideas.length), () => { me.k++; drawMe(); }]] : []), back()] });
  }
  const rows = SIMP.filter(s => s.at.includes(n));
  if (!rows.length || k >= rows.length) return talk({ pose: "pense", say: ME_LBL.more, more: h.more, replies: [back()] });
  const r = rows[k], flipped = simpSeen.has(`${n}:${k}`), lastCard = k === rows.length - 1;
  talk({ pose: "pense", say: `${ME_LBL.inGame}&nbsp;: ${r.game}`,
    more: flipped ? `<p><b>${ME_LBL.ai}&nbsp;:</b> ${r.ai}</p>${r.risk ? `<p><b>${ME_LBL.risk}&nbsp;:</b> ${r.risk}</p>` : ""}${lastCard && h.more ? `<h4>${ME_LBL.more}</h4><p>${h.more}</p>` : ""}` : SIMP_ASK,
    replies: [...(!flipped ? [[FLIP, () => { simpSeen.add(`${n}:${k}`); rec("simp_retournees", [...simpSeen].join(" ")); drawMe(); }]]
      : !lastCard ? [[NEXT_CARD(k + 2, rows.length), () => { me.k++; drawMe(); }]] : []), back()] });
}
// « Peu de temps ? » on a step: what to keep and what can be shortened, and the step in the short lesson
function openShort() {
  const n = SCREENS[cur].step, h = HELP[n - 1];
  me = { tab: "short", k: 0 };
  talk({ pose: "pense", say: SHORT_TITLE, more: `<p><b>${SHORT[n - 1][0]}</b>&nbsp;: ${SHORT[n - 1][1]}</p><p><b>${ME_LBL.keep}&nbsp;:</b> ${h.keep}</p><p><b>${TAGS.short}&nbsp;:</b> ${h.cut}</p>`, replies: [back()] });
}

/* ============ ? Pourquoi · Avant la séance · ✓ Fin ============ */
function drawWhy() {
  put($("#desk"), `<div class="npath"><h2 class="dt">${NOTIONS_PATH.title}</h2><ol>${NOTIONS_PATH.steps.map(t => `<li>${t}</li>`).join("")}</ol>${NOTIONS_PATH.note ? `<p>${NOTIONS_PATH.note}</p>` : ""}</div>
    <h2 class="dt">${NOTIONS_TITLE}</h2><div class="notions four">${NOTIONS.map(c => `<div class="ncard paper"><span class="nat">${c.at}</span><h3>${c.term}</h3><p>${c.def}</p></div>`).join("")}</div><p class="after">${NOTIONS_AFTER}</p>`);
  const tale = () => talk({ pose: "salue", say: WHY_Q, more: `${TALE_DRAFT ? `<p><b>${TALE_DRAFT}</b></p>` : ""}${TALE.map(p => `<p>${p}</p>`).join("")}`,
    replies: [[WHY_NEXT, () => go(1), true], [IDEA_LABEL, () => talk({ pose: "pense", say: IDEA_LABEL, more: IDEA, replies: [[BACK_PREP, tale]] })]] });
  tale();
}
function drawPrep() {
  const total = STEPS.reduce((t, s) => t + s.min, 0);
  put($("#desk"), `<div class="plan">${STEPS.map(s => `<button type="button" class="stepc ${done.has(s.n) ? "done" : ""}" data-goto="${stepAt(s.n)}">
      <span class="sn"><i>${s.n}</i>${s.min} min${done.has(s.n) ? ` · ${DONE_MARK}` : ""}</span><h3>${s.title}</h3><p>${s.found}</p></button>`).join("")}</div>
    <p class="total">${PLAN_SUB}</p>
    <div class="prep">
      <div class="mat paper"><h3>${BEFORE_TITLE}</h3><ul>${BEFORE_MAT.map(([b, t]) => `<li><b>${b}</b>&nbsp;: ${t}</li>`).join("")}</ul></div>
      <div class="side">
        <div class="rgrid">${ROLES.map((r, k) => `<button type="button" class="rthumb" data-act="role" data-k="${k}"><img src="${roleImg(k)}" alt="La carte ${r.name}"></button>`).join("")}</div>
        <div class="pdfs"><a class="tool" href="${CARDS_PDF}" target="_blank" rel="noopener">${pdfIcon}${BTN.material}</a><a class="tool" href="${GUIDE_PDF}" target="_blank" rel="noopener">${pdfIcon}${BTN.guide}</a></div>
        <aside class="card-consigne"><span class="lab">${CONSIGNE_LABEL}</span><p>${BEFORE_SAY}</p></aside>
      </div></div>`);
  const main = () => talk({ pose: "pointe", say: PREP_Q, more: BEFORE_NOTE,
    replies: [[PREP_NEXT, () => go(stepAt(1)), true], [SHORT_TITLE, short], [WORDS_TITLE, words]] });
  const short = () => talk({ pose: "pense", say: SHORT_TITLE, keep: SHORT.map(([t, d]) => `<span><b>${t}</b>&nbsp;: ${d}</span>`), more: `<p>${SHORT_KEEP}</p><p>${LONG}</p>`, replies: [[BACK_PREP, main]] });
  const words = () => talk({ pose: "pointe", say: WORDS_TITLE, more: `<p><b>${ME_LBL.useT}&nbsp;:</b> ${WORDS_USE}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${WORDS_AVOID}</p><p><b>${LINK_LABEL}&nbsp;:</b> ${LINK_TEXT}</p>`, replies: [[BACK_PREP, main]] });
  main();
}
function drawEnd(table) {
  if (table) {
    sawIntro("simp");
    put($("#desk"), `<h2 class="dt">${SIMP_TITLE}</h2><div class="scroll"><table class="simp"><thead><tr><th>${SIMP_HEAD[0]}</th><th>${SIMP_HEAD[1]}</th><th class="ai">${SIMP_HEAD[2]}</th></tr></thead>
      <tbody>${SIMP.map(s => `<tr><td>${s.game}<span class="st">${s.step}</span></td><td>${s.why}</td><td class="ai">${s.ai}</td></tr>`).join("")}</tbody></table></div><p class="after">${SIMP_AFTER}</p>`);
  } else {
    const SAYS = { 1: SAY1.start.say, 2: SAY2.draw.say, 3: SAY3.lead.say, 4: TRACE[0].q };   // each step's first line to the class
    const total = STEPS.reduce((t, s) => t + s.min, 0);
    put($("#desk"), `<article class="lesson paper">
      <header class="ls-head"><h2>${SHEET_HEAD}</h2><span>${SHEET_META(total)}</span></header>
      <ol class="ls-steps">${STEPS.map(s => `<li><button type="button" class="ls-step ${done.has(s.n) ? "done" : ""}" data-goto="${stepAt(s.n)}" title="${OPEN_STEP}">
        <i>${done.has(s.n) ? "✓" : s.n}</i><span class="ls-body"><b>${s.title}</b><small>${s.min}&nbsp;min</small><span class="ls-found">${s.found}</span>
        ${SAYS[s.n] ? `<span class="ls-say"><em>${CONSIGNE_LABEL}</em> ${SAYS[s.n]}</span>` : ""}</span></button></li>`).join("")}</ol>
      <aside class="ls-mat"><h3>${MATERIAL}</h3>
        <div class="rgrid small">${ROLES.map((r, k) => `<button type="button" class="rthumb" data-act="role" data-k="${k}"><img src="${roleImg(k)}" alt="La carte ${r.name}"></button>`).join("")}</div>
        <a class="tool" href="${CARDS_PDF}" target="_blank" rel="noopener">${pdfIcon}${BTN.material}</a><a class="tool" href="${GUIDE_PDF}" target="_blank" rel="noopener">${pdfIcon}${BTN.guide}</a></aside>
    </article>`);
  }
  talk({ pose: "ouvre", say: END_TITLE, keep: TAKEAWAY.map(t => `<span>${t}</span>`),
    replies: [[BACK_TO_Q, BACK_URL, true], table ? [SIMP_BACK, () => drawEnd(false)] : [SIMP_BTN, () => drawEnd(true)], [BTN.again, again]] });
}

/* ---------- A picture, large (the role cards) ---------- */
let lbOpener = null;
function openLb(src, alt, btn) { lbOpener = btn || document.activeElement; $("#lb-img").src = src; $("#lb-img").alt = nb(alt); $("#lightbox").hidden = false; setTimeout(() => $("#lb-close").focus({ preventScroll: true }), 30); }
function closeLb(refocus = true) { if ($("#lightbox").hidden) return; $("#lightbox").hidden = true; if (refocus && lbOpener && document.contains(lbOpener)) lbOpener.focus({ preventScroll: true }); }

/* ---------- Clicks ---------- */
function again() {
  Object.assign(S1, { phase: "start", read: [], sel: -1 }); resetS2(); resetS3(); Object.assign(S4, { shown: 0, fresh: false });
  qDone.clear(); for (const k in qText) delete qText[k];
  done.clear(); seen.clear();
  go(0);
}
const ACT = {
  again, role: b => openLb(roleImg(+b.dataset.k), `La carte ${ROLES[+b.dataset.k].name}`, b),
  toRoles: () => { S1.phase = "roles"; render(); },
  toSort: () => { S3.phase = "sort"; render(); },
  write: () => writeLine(),
  oqok: b => answer(b.dataset.q, false), oqskip: b => answer(b.dataset.q, true)
};
$("#desk").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) { if (a.dataset.act !== "role") me = null; return ACT[a.dataset.act](a); }
  const g = e.target.closest("[data-goto]"); if (g && !g.disabled) return go(+g.dataset.goto);
  const n = SCREENS[cur].step; if (!n) return;
  if (e.target.closest("[data-rc], [data-role], [data-vote]")) me = null;
  if (n === 1) s1click(e); else if (n === 2) s2click(e); else if (n === 3) s3click(e);
});
$("#lb-close").addEventListener("click", () => closeLb());
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLb(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

/* Coming back: where the teacher was (completed: the last screen), as in Module 1 */
{ const saved = parseInt(scorm.get("cmi.core.lesson_location"), 10), lastScr = SCREENS.length - 1;
  go(scorm.get("cmi.core.lesson_status") === "completed" ? lastScr : saved >= 0 && saved <= lastScr ? saved : 0); }
</script>
