<title>La Machine à Histoires</title>
<link rel="stylesheet" href="../../shared/frame.css">
<!--
  La Machine à Histoires, matériel éducatif (ECM), dans le cadre H2 depuis le 26 nov. 2026 (comme Robot dessine, module 1) ;
  avant : old/index-avant-h2.html (mise en page v3 : colonne de Claudia, jeu à droite, tiroir « Pour comprendre »).
  Le jeu, ses textes et ses données sont les mêmes ; depuis le 26 nov. 2026, le plateau est dessiné à la taille du pupitre (plus de mise à l'échelle), les fiches imprimées sont redessinées en HTML.
  Les textes sont tous dans la partie CONTENU du script, plus bas ; les nouveaux libellés du cadre sont marqués.
-->
<style>
  /* La Machine à Histoires in the H2 frame. Claudia stays beside the work as tutor: what you do now (her line), « Demande à
     Claudia » (Pourquoi ce moment ? · Pourquoi cette étape ? · Les élèves pensent · Ce que le jeu simplifie · Peu de temps ?),
     the way on as the one mint button. 7 screens: ? Pourquoi · Avant la séance · the 4 steps · ✓ Fin (the lesson sheet). */

  .desk { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .desk h2.dt { font-size: calc(15 * var(--u)); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--violet); }
  .under { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-height: 44px; }
  .under .grow { flex: 1; }
  #acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  #acts .chip { min-height: 44px; font-size: calc(16 * var(--u)); }
  .tool[hidden] { display: none; }
  .card-consigne[hidden] { display: none; }
  /* at the top of the desk, as in Module 1: always in the same place (user, 26 Nov 2026); same width and at least 3 lines on every
     screen of a step, so the board under it does not move; with nothing to say, the card is kept but left blank */
  .desk > .card-consigne { align-self: flex-start; flex: none; width: 100%; }
  .desk > .card-consigne.blank { visibility: hidden; }
  /* ? Pourquoi: the notions */
  .notions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .ncard { padding: 18px 20px; } .ncard:nth-child(2) { rotate: .6deg; }
  .ncard h3 { font-size: calc(21 * var(--u)); color: var(--g-deep); margin-bottom: 6px; } .ncard p { font-size: calc(17 * var(--u)); line-height: 1.45; }
  .after { font-size: calc(15 * var(--u)); color: var(--soft); }
  /* Avant la séance */
  .plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stepc { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--hair); background: #fff; text-align: left; font: inherit; cursor: pointer; }
  .stepc:hover { border-color: var(--g-deep); }
  .stepc .sn { display: flex; align-items: center; gap: 8px; font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .stepc .sn i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); border: 2px solid var(--g-deep); }
  .stepc.done .sn i { background: var(--g-deep); color: #fff; }
  .stepc h3 { font-size: calc(18 * var(--u)); line-height: 1.25; color: var(--g-deep); } .stepc p { font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--soft); }
  .total { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--g-deep); text-align: right; margin-top: -6px; }
  .prep { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mat { padding: 14px 16px; } .mat h3 { font-size: calc(19 * var(--u)); color: var(--g-deep); margin-bottom: 8px; }
  .mat ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: calc(17 * var(--u)); line-height: 1.4; }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
  .thumb { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border: 0; cursor: pointer; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); rotate: -1deg; text-align: left; }
  .thumb + .thumb { rotate: .8deg; }
  .thumb img { width: 84px; height: auto; border-radius: 4px; }
  .pdfs { display: flex; flex-wrap: wrap; gap: 8px; }
  /* ✓ Fin: « Ce que l'activité simplifie » */
  .simp { width: 100%; border-collapse: collapse; font-size: calc(14 * var(--u)); line-height: 1.4; background: #fff; }
  .simp th { text-align: left; padding: 8px 10px; font-size: calc(13 * var(--u)); color: var(--g-deep); border-bottom: 2px solid var(--g-deep); }
  .simp th.ai, .simp td.ai { background: var(--lilac-tint); }
  .simp td { padding: 7px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  .simp td .st { display: block; font-size: calc(12 * var(--u)); color: var(--soft); }
  .scroll { min-height: 0; overflow: auto; }
  /* the last screen: the lesson as a sheet (as in Module 1) */
  .lesson { --u: clamp(1px, calc(.08px + .1vh), 1.35px); display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 22vw, 280px); grid-template-rows: auto 1fr; gap: 6px clamp(20px, 2.6vw, 36px); align-self: start; padding: clamp(18px, 3vh, 28px) clamp(20px, 2.6vw, 32px); rotate: -.3deg; }
  .ls-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--g-tint); }
  .ls-head h2 { font-size: clamp(1.3rem, 3vh, 1.7rem); color: var(--g-deep); }
  .ls-head span { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .ls-steps::before { content: ""; position: absolute; left: 17px; top: 24px; bottom: 24px; width: 2px; background: var(--g-hell); }
  .ls-step { position: relative; width: 100%; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 6px 10px 6px 0; border: 0; border-radius: 10px; background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .ls-step:hover { background: var(--g-tint); }
  .ls-step i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); background: #fff; border: 2px solid var(--g-deep); }
  .ls-step.done i { background: var(--g-deep); color: #fff; }
  .ls-body { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .ls-body b { font-size: clamp(16px, 2.2vh, 18px); color: var(--g-deep); }
  .ls-body small { font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-found { grid-column: 1 / -1; font-size: calc(14 * var(--u)); line-height: 1.35; color: var(--soft); }
  .ls-say { grid-column: 1 / -1; margin-top: 2px; padding: 4px 8px; border-radius: 8px; background: var(--g-tint); font-size: calc(14 * var(--u)); line-height: 1.35; color: var(--g-deep); }
  .ls-say em { display: inline; margin-right: 4px; font-style: normal; font-size: calc(12 * var(--u)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .ls-mat { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 10px; padding-left: clamp(16px, 2vw, 28px); border-left: 2px dashed var(--hair); }
  .ls-mat h3 { font-size: calc(13 * var(--u)); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--violet); }
  .ls-sheet { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1.5px solid var(--hair); background: #fff; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); cursor: pointer; }
  .ls-sheet:hover { border-color: var(--g-deep); }
  .ls-sheet img { width: 100%; max-height: 26vh; object-fit: contain; box-shadow: var(--paper-shadow); rotate: 1.5deg; }
  .ls-mat .tool { justify-content: center; }
  /* a picture, large (the printed sheets, the classroom) */
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(11, 81, 77, .45); display: grid; place-items: center; padding: 24px; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: var(--paper-shadow); background: #fff; }
  .lightbox .x { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 10px; border: 0; background: #fff; color: var(--g-deep); cursor: pointer; display: grid; place-items: center; }
  /* short screens (laptops at 720 px): the plan without its summaries, smaller papers, so « Avant la séance » stays on one screen */
  @media (max-height: 800px) and (min-width: 761px) {
    .stepc p { display: none; } .stepc { padding: 8px 10px; }
    .mat { padding: 10px 14px; } .mat ul { font-size: calc(14 * var(--u)); gap: 4px; }
    .thumb { padding: 6px 10px 6px 6px; font-size: calc(14 * var(--u)); } .thumb img { width: 60px; }
    .side .card-consigne p { font-size: calc(14 * var(--u)); }
    .notions .ncard p { font-size: calc(14 * var(--u)); line-height: 1.4; }
    .lesson { padding: 14px 18px; gap: 4px 20px; } .ls-head { padding-bottom: 6px; } .ls-steps { gap: 0; } .ls-step { padding-block: 3px; }
    .ls-found { display: none; } .ls-say { font-size: calc(13 * var(--u)); margin-top: 0; padding: 3px 8px; }
    .ls-sheet img { max-height: 18vh; } .ls-mat { gap: 6px; }
  }
  @media (max-height: 640px) and (min-width: 761px) { .ls-say { display: none; } .ls-found { display: block; } }
  @media (max-width: 1100px) { .notions { grid-template-columns: 1fr; } .plan { grid-template-columns: repeat(2, minmax(0, 1fr)); } .prep { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .lesson { grid-template-columns: 1fr; } .ls-mat { grid-row: auto; grid-column: 1; padding-left: 0; border-left: 0; } }
  @media (max-width: 760px) { .card-consigne { max-width: none; } }
  /* a tablet held upright: the game's button and « Revenir en arrière » take two lines; both are kept, so the board does not move */
  @media (min-width: 761px) and (max-width: 1050px) and (orientation: portrait) { .under { height: 96px; align-content: center; } }

  /* ---------- The game board, drawn at the desk's real size (26 Nov 2026; before: the old 1176 × 700 board, scaled down).
     Steps 1 to 3: three rows that keep their place and height on every screen of the step, so the table does not move:
     the path of the request (.btop) · the moment, large, on the table (.moment) · « Ce qui se passe » (.bcap).
     The printed sheets are drawn in HTML with their words and codes; « Voir la fiche imprimée » opens the printed picture.
     The board reflows with container queries (laptop: one row; a tablet held upright or a phone: stacked). Text: 15 px or more. ---------- */
  .board { --fy: #f6d548; --fg: #00b050; --fb: #0047ab; --table: #f4f1ea; --line: #d6d1c4; --brown: #5b574d; --teal: #12968a; --red: #C4314F;
    flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; container: board / inline-size; color: var(--ink); }
  .board.b4 { grid-template-rows: minmax(0, 1fr); }
  @keyframes g-fade { from { opacity: 0; } }
  .board .fy { border-color: var(--fy) !important; } .board .fg { border-color: var(--fg) !important; } .board .fb { border-color: var(--fb) !important; }
  .board .rc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border: 3px solid; border-radius: 4px; background: #fff; }
  .outbig .rc, .slot img, .desk2 .rc { animation: g-fade .35s both; }
  .board .rc img { height: 74%; width: auto; }
  .board .kcode { display: inline-block; padding: 0 7px; border: 2px solid #1f1f1f; border-radius: 6px; background: #fff; font: 700 calc(15 * var(--u))/1.4 "Arial Narrow", Arial, sans-serif; white-space: nowrap; vertical-align: middle; }
  .board .nw { white-space: nowrap; }
  .btop { height: 80px; display: flex; align-items: flex-end; justify-content: center; }
  .blabel { align-self: center; font: 600 calc(17 * var(--u))/1.3 Inter, sans-serif; color: var(--soft); }
  .moment { position: relative; min-height: 0; overflow: hidden; display: flex; align-items: safe center; justify-content: safe center; gap: clamp(14px, 3cqw, 28px); padding: 12px 14px; border-radius: 12px; background: var(--table); }
  .bcap { height: 46px; overflow: hidden; }
  .capt { font-size: calc(16 * var(--u)); line-height: 1.4; } .capt b { font-weight: 600; color: #4a463e; }
  .board .zoom { flex: none; min-height: 40px; padding: 2px 14px; border: 1px solid var(--hair); border-radius: 999px; background: #fff; font: 600 calc(15 * var(--u))/1.2 Inter, sans-serif; color: var(--g-deep); cursor: pointer; }
  .board .zoom:hover { background: var(--g-tint); }

  /* the path of the request: who passed what to whom (the token under each arrow) */
  .path { display: flex; align-items: flex-start; justify-content: center; padding-top: 22px; }
  .mband { position: relative; display: flex; align-items: flex-start; padding: 5px 8px; border-radius: 12px; background: #efece4; }
  .mband .ml { position: absolute; left: 10px; top: -22px; font: 600 calc(15 * var(--u))/1.2 Inter, sans-serif; color: var(--brown); }
  .pnode { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 3px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
    font: 600 calc(15 * var(--u))/1.2 Inter, sans-serif; color: var(--brown); white-space: nowrap; }
  .pnode .n { width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--line); color: #fff; font: 800 calc(15 * var(--u))/22px Inter, sans-serif; text-align: center; }
  .pnode.done { color: var(--g-deep); border-color: var(--g-hell); } .pnode.done .n { background: var(--g-deep); }
  .pnode.on { color: var(--g-deep); background: var(--g-tint); border: 3px solid var(--g-main); } .pnode.on .n { background: var(--g-deep); }
  .hop { display: flex; flex-direction: column; align-items: center; min-width: 30px; padding: 0 3px; }
  .hop .ar { font: 400 calc(20 * var(--u))/36px Inter, sans-serif; color: var(--teal); }
  .hop.empty .ar { color: #c9c3b4; }
  .hop .tk { display: flex; gap: 0 6px; align-items: center; min-height: 18px; font: 700 calc(15 * var(--u))/1.15 "Arial Narrow", Arial, sans-serif; white-space: nowrap; }
  .hop .tk .mini { display: block; width: 34px; height: 24px; } .hop .tk .mini .rc { border-width: 2px; }

  /* the printed sheets, drawn: DEMANDE (Auteurs), the bande (Encodeur), the chances sheet (Calculateur), RÉSULTAT (Rédacteur) */
  .sheet { position: relative; flex: 0 1 auto; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px 18px 12px; color: #111; rotate: -.5deg; }
  .sheet .bt { font: 800 calc(19 * var(--u))/1.15 Inter, sans-serif; letter-spacing: .02em; text-transform: uppercase; color: #1f2a28; }
  .sheet .sfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; }
  .sheet .sfoot small { font-size: calc(15 * var(--u)); letter-spacing: .03em; text-transform: uppercase; color: var(--soft); }
  .slot { position: relative; width: 150px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 5px solid; background: #fff; }
  .slot img { height: 58%; width: auto; }
  .slot small { font: 700 calc(15 * var(--u))/1.2 Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #6b6b6b; }
  .demande { width: min(100%, 330px); align-items: center; text-align: center; } .demande .bt { font-size: calc(17 * var(--u)); } .demande .slot { height: 88px; }
  .bande { width: min(100%, 620px); flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 22px; padding: 18px 22px; }
  .bande .bt { flex: 1 1 180px; }
  .bande .slot { width: 170px; height: 96px; }
  .bande .codebig { font: 700 calc(44 * var(--u))/1 "Arial Narrow", Arial, sans-serif; color: #1f1f1f; animation: g-fade .6s both; }
  .bande .sfoot { flex: 1 1 100%; }
  .resultat .slots { display: flex; gap: 12px; justify-content: center; }
  .resultat { gap: 8px; padding-top: 10px; padding-bottom: 10px; } .resultat .slot { width: 124px; height: 78px; } .resultat .storyline { font-size: calc(17 * var(--u)); padding: 4px 12px; }
  .resultat .storyline { margin: 0; }
  .fiche .fh { font: 400 calc(16 * var(--u))/1.2 Inter, sans-serif; color: var(--soft); } .fiche .fh b { margin-right: 6px; font-size: calc(18 * var(--u)); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; color: var(--ink); }
  .frow { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
  .frow .ar { font-size: calc(22 * var(--u)); color: var(--teal); }
  .code { position: relative; width: 60px; height: 52px; display: grid; place-items: center; border: 3px solid; border-radius: 8px; background: #fff; font: 700 calc(17 * var(--u))/1 Inter, sans-serif; white-space: nowrap; }
  .code i { position: absolute; top: -12px; right: -10px; padding: 1px 7px; border-radius: 999px; background: var(--g-deep); color: #fff; font: 700 calc(15 * var(--u))/1.3 Inter, sans-serif; font-style: normal; }
  .fiche .fn { font-size: calc(16 * var(--u)); color: var(--soft); } .fiche .fn.rare { color: var(--red); font-weight: 600; }
  /* the Auteurs' cards to choose (step 1) */
  .desk2 { display: grid; grid-template-columns: repeat(3, 92px); gap: 12px; }
  .desk2 .pc2 { width: 92px; height: 70px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; }
  .desk2 .pc2:hover .rc, .desk2 .pc2:focus-visible .rc { outline: 4px solid var(--g-main); outline-offset: 2px; }
  /* « Dans le sac Lieu » : the cards, their copies, their codes */
  .tkeys { flex: none; display: flex; flex-direction: column; gap: 10px; }
  .tkeys h4 { margin: 0; font: 600 calc(18 * var(--u))/1.25 Inter, sans-serif; color: var(--g-deep); }
  .tkv { display: grid; grid-template-columns: 56px 40px auto auto; align-items: center; gap: 10px; font-size: calc(18 * var(--u)); }
  .tkv .tcp { width: 56px; height: 42px; } .tkv b { font-size: calc(22 * var(--u)); font-variant-numeric: tabular-nums; }
  .nosh { max-width: 300px; padding: 8px 12px; border: 2px dashed #b8b2a3; border-radius: 6px; background: #fff; font-size: calc(16 * var(--u)); line-height: 1.35; }
  .nosh em { color: var(--red); font-style: normal; font-weight: 600; } .nosh b { color: var(--g-deep); }
  /* the draw: the bag, its copies, the card that came out */
  .drawv { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 22px; }
  .bagbox { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: calc(17 * var(--u)); font-weight: 600; }
  .bagbox svg { width: 62px; height: 72px; }
  .cps { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; }
  .cps .tcp { width: 60px; height: 46px; } .cps .tcp:not(.win) { opacity: .4; } .cps .tcp.win .rc { outline: 4px solid var(--g-main); outline-offset: 1px; }
  .drawv .arrow { font-size: calc(34 * var(--u)); color: var(--teal); }
  .outbig { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: calc(22 * var(--u)); font-weight: 600; }
  .outbig .tcp { width: 132px; height: 98px; } .outbig small { font-size: calc(17 * var(--u)); font-weight: 400; color: var(--brown); }
  /* the story, word after word: the words produced in bold */
  .storyline { padding: 6px 14px; border-radius: 8px; background: #F7F7F7; font-size: calc(18 * var(--u)); font-style: italic; line-height: 1.4; text-align: center; }
  .storyline b { font-weight: 600; color: var(--g-deep); }
  .storyline .gap { display: inline-block; min-width: 48px; border-bottom: 3px solid var(--g-deep); color: var(--g-deep); font-style: normal; font-weight: 600; text-align: center; }

  /* step 2: the sheet's copies with the counter as its last column (« Combien de fois ? »), then the rounds */
  .s2 { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
  .ktab { display: grid; grid-template-columns: 44px auto auto auto auto; align-items: center; gap: 8px 10px; padding: 12px 14px; border: 2px solid transparent; border-radius: 8px; background: #fff; }
  .ktab h4 { grid-column: 1 / 5; margin: 0; font: 600 calc(17 * var(--u))/1.25 Inter, sans-serif; color: var(--g-deep); }
  .ktab .kh { grid-column: 5; align-self: end; max-width: 9ch; font: 600 calc(15 * var(--u))/1.2 Inter, sans-serif; color: var(--soft); text-align: center; }
  .ktab .tkv { display: contents; font-size: calc(17 * var(--u)); } .ktab .kcode { justify-self: start; } .ktab .tcp { width: 44px; height: 34px; } .ktab .tkv b { font-size: calc(20 * var(--u)); }
  .ktab .cnt { justify-self: center; min-width: 46px; padding: 2px 8px; border-radius: 8px; background: var(--g-tint); font: 800 calc(22 * var(--u))/1.3 Inter, sans-serif; color: var(--g-deep); text-align: center; font-variant-numeric: tabular-nums; }
  .ktab.ask { border-color: var(--g-deep); } .ktab.ask .kh { color: var(--g-deep); font-weight: 800; }
  .ktab .tkv.on .cnt { background: var(--g-main); box-shadow: 0 0 0 3px var(--g-main); } .ktab .tkv.on .rc { outline: 3px solid var(--g-main); outline-offset: 2px; }
  .rounds { display: grid; gap: 8px; }
  .round { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 10px; border-radius: 8px; background: #fff; }
  .round > b { flex: none; width: 50px; font: 600 calc(16 * var(--u))/1.2 Inter, sans-serif; color: var(--soft); }

  @media (max-width: 760px) {

  /* few items on the desk (notions, plan, material): the group sits in the middle of the desk, not against the top

  .desk > :first-child:not(.card-consigne):not(.rotate) { margin-top: auto; }

<script>
/* ============================================================
   CONTENU — modifie seulement cette partie.

   pour chaque mot, le Calculateur remplit le sac avec la « fiche des chances » du mot d'avant, puis tire au sort.
   10 écrans : 4 écrans pour toi (pourquoi, les notions, préparer la séance, le plan), puis les 4 étapes,
   puis « Pour aller plus loin : ce que l'activité simplifie », puis la fin.

   On passe à l'écran suivant SEULEMENT avec la flèche → en bas.

];

const SIMP_TITLE = "Pour aller plus loin : ce que l'activité simplifie";

const qDone = new Set(), qText = {};
function oqHTML(id, big = false) {
  const q = OPEN_Q[id];
  if (qDone.has(id)) return `<div class="oq done"><p class="oql">${OQ_LABEL}</p><p class="oqt">${qText[id] ? esc(qText[id]) : OQ_SKIPPED_SHOWN}</p></div>`;
  return `<div class="oq ${big ? "big" : ""}"><p class="oql">${OQ_LABEL}</p><p class="oqq">${q.q}</p>

    <div class="oqa"><button type="button" class="b primary" data-act="oqok" data-q="${id}" ${(qText[id] || "").trim() ? "" : "disabled"}>${BTN.validate}</button>
    <button type="button" class="b secondary" data-act="oqskip" data-q="${id}">${BTN.skip}</button></div></div>`;
}
function oqFill() { const t = $("#oq"); if (t) t.value = qText[t.dataset.q] || ""; }
document.addEventListener("input", e => {
  if (e.target.id !== "oq") return;
  qText[e.target.dataset.q] = e.target.value;
  const ok = document.querySelector('[data-act="oqok"]'); if (ok) ok.disabled = !e.target.value.trim();
});
function answer(id, skip) {
  const v = skip ? "" : (qText[id] || "").trim();
  qText[id] = v; qDone.add(id);
  rec(id, v || OQ_SKIPPED);
  render();
}

const SHEET_IMG = c => `images/f-chances-codes-${c.file}.png`;   // 25 nov. 2026 : la fiche avec les codes seulement (découpée de la « Fiche des chances (codes) » du dossier media) ; avant : images/f-chances-…png, avec les images
const rcard = (c, f) => `<div class="rc ${FAM[f]}">${img(c)}</div>`;

const BAGSVG = `<svg viewBox="0 0 60 70" aria-hidden="true"><path d="M14 14 Q30 22 46 14 L52 60 Q30 70 8 60 Z" fill="#6b5a4a"/><path d="M14 14 Q30 6 46 14" fill="none" stroke="#3d3128" stroke-width="3"/></svg>`;

const TBL = { aut: [1, "Auteurs"], enc: [2, "Encodeur"], calc: [3, "Calculateur"], red: [4, "Rédacteur"] };
const zoomBtn = (src, alt) => `<button type="button" class="zoom" data-act="zoom" data-src="${src}" data-alt="${esc(nb(alt))}">${CH.zoom}</button>`;

      <span class="arrow" aria-hidden="true">→</span><div class="outbig"><div class="tcp">${rcard(d.c, nf)}</div><span>${bare(d.c)} <span class="kcode">${d.c.code}</span> <small>${CH.outLbl}</small></span></div></div>`;

// the chances sheet, drawn as it is printed (codes only): the code before → the codes that can come after, ×copies; « appris dans n histoires »

// the path: who passed what to whom; o.on = the working station ("" = none: the class counts), stations before it are done

    <span class="mband"><span class="ml">${PATH_LABELS.band}</span>${node("enc")}${hop(o.code ? o.who.code : "", o.code && at > 1)}${node("calc")}${hop(tray.map(c => `<span>${c.code}</span>`).join(""), tray.length && at > 2)}${node("red")}</span>
    ${hop("", false)}<span class="pnode story ${o.res && o.res.length === 3 ? "done" : ""}" title="${PATH_LABELS.story}"><span>${PATH_LABELS.story}</span></span></div>`;

// « Comprendre » : what happens (always), then why and the link with a real AI (on demand, recorded under « comprendre »)
const compOpen = new Set(); let compNow = "", curMoment = "", curV = {}, whyView = "moment";   // curMoment = the moment on the board, for the « Pourquoi » tab
// « Comprendre » : one caption line under the moment (always), « Pourquoi ? › » opens the reason over the moment (recorded under « comprendre »)
function captionHTML(m, v) {

}

// the focus: the working station, large, with its printed sheet drawn
const sheetFoot = (key, foot) => `<div class="sfoot"><small>${foot}</small>${zoomBtn(PAPER[key], foot)}</div>`;

// the board's three rows: on top the path (or a label), the moment on the table, « Ce qui se passe » under it; they keep their place on every screen

// which « Comprendre » moment goes with the Calculateur's view (first = the moment of the first sheet: sheet, rare or like)

const deskHTML = () => `<div class="desk2">${ASK_CARDS.map((c, k) => `<button type="button" class="pc2" data-author="${k}" aria-label="${bare(c)}">${rcard(c, 0)}</button>`).join("")}</div>`;
/* ============ Step 1: one request, one story. Auteurs + Encodeur on one board (the code appears by itself),
   then the Calculateur (the sheet and the bag for the place, then for the object), then the Rédacteur ============ */
const S1 = {};

/* ============ Step 2: the same request, again and again. The sheet and the bag of the place, a counter, the rounds, then « Quel lieu sort le plus souvent ? » ============ */
const S2 = {};

resetS2();

/* ============ Step 3: what it has seldom seen. A wolf (learned from 2 stories), the vote, then all its sheets and « Qu'est-ce qui manque ? » ============ */
const S3 = {};

/* ============ Step 4: who writes the story? The open question, Claudia's answer, 4 sentences, then the trace écrite (one line at a time) ============ */

  }
  // the trace écrite
  const k = Math.min(S4.shown, TRACE.length - 1);
  board(`<div class="moment"><div class="s4"><div class="trace paper"><p class="pt">${TRACE_LABEL}</p><ol>${TRACE.map((t, j) => j < S4.shown
    ? `<li class="${S4.fresh && j === S4.shown - 1 ? "new" : ""}">${t.a}</li>` : `<li class="todo">…</li>`).join("")}</ol></div>
    <div class="tshow" aria-live="polite">${traceShow(k)}</div></div></div>`, "b4");
  S4.fresh = false;
  if (S4.shown < TRACE.length) {
    const L = BRIDGE.length - 1, fb = S4.shown ? "" : S4.ans[L] ? SAY4.right : SAY4.wrongLast(BRIDGE[L].same ? BTN.same : BTN.game);
    return classe({ now: fb + SAY4.line(S4.shown + 1).now, say: TRACE[S4.shown].q }, [["write", BTN.write(S4.shown + 1)]]);
  }

}
function s4click(e) {
  const v = e.target.closest("[data-vote]"); if (!v || S4.phase !== "sort" || S4.at >= BRIDGE.length) return;
  S4.ans[S4.at] = (v.dataset.vote === "1") === BRIDGE[S4.at].same ? 1 : 0; S4.at++;
  if (S4.at === BRIDGE.length) { rec("pont_vraie_ia", S4.ans.join(" "), { result: S4.ans.every(x => x) ? "correct" : "wrong" }); S4.phase = "trace"; }

/* « Revenir en arrière » dans une étape : avant chaque clic, on garde une copie de l’état de l’étape ; si le clic l’a changé, la copie va dans HIST.
   Les cartes restent les mêmes objets (copie de surface). Les données déjà envoyées (SCORM) ne sont pas effacées. */
const STATE = { 1: S1, 2: S2, 3: S3, 4: S4 };
const HIST = { 1: [], 2: [], 3: [], 4: [] };
function clearHist() { for (const k in HIST) HIST[k].length = 0; }
function snap(n) {
  const o = {};
  for (const [k, v] of Object.entries(STATE[n])) o[k] = Array.isArray(v) ? v.slice() : v instanceof Set ? new Set(v) : v;
  if (n === 4) { o.__q = new Set(qDone); o.__t = { ...qText }; }   // la question ouverte vit hors de S4
  return o;
}
const sig = o => JSON.stringify(o, (k, v) => v instanceof Set ? [...v] : v && v.code && v.file ? v.code : k === "timer" ? 0 : v);
function undo() {
  const n = SCREENS[cur].step, o = HIST[n].pop(); if (!o) return;
  if (n === 1) clearTimeout(S1.timer);
  const { __q, __t, ...rest } = o; Object.assign(STATE[n], rest);
  if (n === 4) { qDone.clear(); __q.forEach(x => qDone.add(x)); for (const k in qText) delete qText[k]; Object.assign(qText, __t); }
  render();
}

const icon = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${{ undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>', pdf: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>' }[k]}</svg>`;

const { scorm } = frame;
