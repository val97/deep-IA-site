<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identif'IA niveau 1</title>
<link rel="stylesheet" href="../../shared/frame.css">
<!--
  Identif'IA niveau 1, matériel éducatif (ECM), dans le cadre H2 depuis le 26 nov. 2026 (comme La Machine à Histoires, module 2) ;
  avant : old/index-avant-h2.html (mise en page de Robot dessine 1 : colonne de Léo, jeu à droite, tiroir « Pour comprendre »).
  Le jeu, ses textes et ses données sont les mêmes ; le plateau garde sa taille d'origine et est mis à l'échelle du pupitre.
  Les textes sont tous dans la partie CONTENU du script, plus bas ; les nouveaux libellés du cadre sont marqués.
-->
<style>
  /* Identif'IA in the H2 frame. Léo stays beside the work as tutor: what you do now (his line), « Demande à Léo »
     (Pourquoi cette étape ? · Les élèves pensent · Ce que le jeu simplifie · Peu de temps ?), the way on as the one mint button.
     8 screens: ? Pourquoi · Avant la séance · the 5 steps · ✓ Fin (the lesson sheet). Mockup: site/design/mockups/activite-identifia.html. */

  .desk { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .desk h2.dt { font-size: calc(15 * var(--u)); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--violet); }
  /* the game: the old board at its own size (BOARD_W × BOARD_H), scaled to the space left on the desk */
  .boardwin { position: relative; flex: 1; min-height: 120px; }
  .game { position: absolute; left: 0; top: 0; transform-origin: 0 0; font: 400 22px/1.4 Inter, system-ui, sans-serif; color: #1F1F1F; display: flex; flex-direction: column; }
  .game button { font: inherit; color: inherit; cursor: pointer; }
  .game > .board { height: 100%; }
  .under { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .under .grow { flex: 1; }
  #acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  #acts .chip { min-height: 44px; font-size: calc(16 * var(--u)); }
  #consigne { flex: 0 1 auto; max-width: min(640px, 70%); rotate: .8deg; }   /* beside the game's buttons, under the board */
  .under { align-items: flex-end; }
  .card-consigne[hidden] { display: none; }
  .desk > .card-consigne { align-self: flex-start; max-width: 560px; flex: none; }   /* at the top of the desk, as in Module 1: always in the same place (user, 26 Nov 2026) */
  .rotate { display: none; }
  /* ? Pourquoi: the notions */
  .notions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .ncard { padding: 18px 20px; } .ncard:nth-child(2) { rotate: .6deg; } .ncard:nth-child(3) { rotate: -.4deg; }
  .ncard h3 { font-size: calc(21 * var(--u)); color: var(--g-deep); margin-bottom: 6px; } .ncard p { font-size: calc(17 * var(--u)); line-height: 1.45; }
  .after { font-size: calc(15 * var(--u)); color: var(--soft); }
  /* Avant la séance */
  .plan { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .stepc { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--hair); background: #fff; text-align: left; font: inherit; cursor: pointer; }
  .stepc:hover { border-color: var(--g-deep); }
  .stepc .sn { display: flex; align-items: center; gap: 8px; font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .stepc .sn i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); border: 2px solid var(--g-deep); }
  .stepc.done .sn i { background: var(--g-deep); color: #fff; }
  .stepc h3 { font-size: calc(18 * var(--u)); line-height: 1.25; color: var(--g-deep); } .stepc p { font-size: calc(15 * var(--u)); line-height: 1.35; color: var(--soft); }
  .stepc .short { align-self: flex-start; margin-top: 2px; padding: 1px 8px; border-radius: 999px; border: 1.5px dashed var(--soft); font-size: calc(11 * var(--u)); font-weight: 700; color: var(--soft); }
  .total { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--g-deep); text-align: right; margin-top: -6px; }
  .prep { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mat { padding: 14px 16px; } .mat h3 { font-size: calc(19 * var(--u)); color: var(--g-deep); margin-bottom: 8px; }
  .mat ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: calc(17 * var(--u)); line-height: 1.4; }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .thumb { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border: 0; cursor: pointer; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); rotate: -1deg; text-align: left; }
  .thumb img { width: 84px; height: auto; border-radius: 4px; }
  .pdfs { display: flex; flex-wrap: wrap; gap: 8px; }
  /* ✓ Fin: « Ce que l'activité simplifie » */
  .simp { width: 100%; border-collapse: collapse; font-size: calc(14 * var(--u)); line-height: 1.4; background: #fff; }
  .simp th { text-align: left; padding: 8px 10px; font-size: calc(13 * var(--u)); color: var(--g-deep); border-bottom: 2px solid var(--g-deep); }
  .simp th.ai, .simp td.ai { background: var(--lilac-tint); }
  .simp td { padding: 7px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  .simp td .st { display: block; font-size: calc(12 * var(--u)); color: var(--soft); }
  .scroll { min-height: 0; overflow: auto; }
  /* the last screen: the lesson as a sheet (as in Modules 1 and 2) */
  .lesson { --u: clamp(1px, calc(.08px + .1vh), 1.35px); display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 22vw, 280px); grid-template-rows: auto 1fr; gap: 6px clamp(20px, 2.6vw, 36px); align-self: start; padding: clamp(18px, 3vh, 28px) clamp(20px, 2.6vw, 32px); rotate: -.3deg; }
  .ls-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--g-tint); }
  .ls-head h2 { font-size: clamp(1.3rem, 3vh, 1.7rem); color: var(--g-deep); }
  .ls-head span { font-size: calc(15 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .ls-steps::before { content: ""; position: absolute; left: 17px; top: 24px; bottom: 24px; width: 2px; background: var(--g-hell); }
  .ls-step { position: relative; width: 100%; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 6px 10px 6px 0; border: 0; border-radius: 10px; background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .ls-step:hover { background: var(--g-tint); }
  .ls-step i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--g-deep); background: #fff; border: 2px solid var(--g-deep); }
  .ls-step.done i { background: var(--g-deep); color: #fff; }
  .ls-body { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .ls-body b { font-size: clamp(16px, 2.2vh, 18px); color: var(--g-deep); }
  .ls-body small { font-size: calc(14 * var(--u)); font-weight: 700; color: var(--soft); }
  .ls-found { grid-column: 1 / -1; font-size: calc(14 * var(--u)); line-height: 1.35; color: var(--soft); }
  .ls-say { grid-column: 1 / -1; margin-top: 2px; padding: 4px 8px; border-radius: 8px; background: var(--g-tint); font-size: calc(14 * var(--u)); line-height: 1.35; color: var(--g-deep); }
  .ls-say em { display: inline; margin-right: 4px; font-style: normal; font-size: calc(12 * var(--u)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .ls-mat { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 10px; padding-left: clamp(16px, 2vw, 28px); border-left: 2px dashed var(--hair); }
  .ls-mat h3 { font-size: calc(13 * var(--u)); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--violet); }
  .ls-sheet { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1.5px solid var(--hair); background: #fff; font: 700 calc(15 * var(--u)) Inter, sans-serif; color: var(--g-deep); cursor: pointer; }
  .ls-sheet:hover { border-color: var(--g-deep); }
  .ls-sheet img { width: 100%; max-height: 26vh; object-fit: contain; box-shadow: var(--paper-shadow); rotate: 1.5deg; }
  .ls-mat .tool { justify-content: center; }
  /* the printed cards, large */
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(11, 81, 77, .45); display: grid; place-items: center; padding: 24px; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: var(--paper-shadow); background: #fff; }
  .lightbox .x { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 10px; border: 0; background: #fff; color: var(--g-deep); cursor: pointer; display: grid; place-items: center; }
  /* short screens (laptops at 720 px): the plan without its summaries, smaller papers, so each screen stays whole */
  @media (max-height: 800px) and (min-width: 761px) {
    .stepc p { display: none; } .stepc { padding: 8px 10px; }
    .mat { padding: 10px 14px; } .mat ul { font-size: calc(14 * var(--u)); gap: 4px; }
    .thumb { padding: 6px 10px 6px 6px; font-size: calc(14 * var(--u)); } .thumb img { width: 60px; }
    .side .card-consigne p { font-size: calc(14 * var(--u)); }
    .notions .ncard p { font-size: calc(14 * var(--u)); line-height: 1.4; }
    .lesson { padding: 14px 18px; gap: 4px 20px; } .ls-head { padding-bottom: 6px; } .ls-steps { gap: 0; } .ls-step { padding-block: 3px; }
    .ls-found { display: none; } .ls-say { font-size: calc(13 * var(--u)); margin-top: 0; padding: 3px 8px; }
    .ls-sheet img { max-height: 18vh; } .ls-mat { gap: 6px; }
  }
  @media (max-height: 640px) and (min-width: 761px) { .ls-say { display: none; } .ls-found { display: block; } }
  @media (max-width: 1100px) { .notions { grid-template-columns: 1fr; } .plan { grid-template-columns: repeat(3, minmax(0, 1fr)); } .prep { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .lesson { grid-template-columns: 1fr; } .ls-mat { grid-row: auto; grid-column: 1; padding-left: 0; border-left: 0; } }
  /* tablets held upright: the board is small, as before the activity asks to turn the tablet (ROTATE_MSG) */
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: block; padding: 10px 12px; border-radius: 10px; background: var(--lilac-tint); color: var(--violet); font-size: calc(14 * var(--u)); font-weight: 700; } }
  @media (max-width: 760px) {
    .boardwin { flex: none; }
    .card-consigne { max-width: none; }
    .plan { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- The game's own look (the old page's board, unchanged, scoped to .game) ---------- */
  .game {
    --g-tint:#E9FCF4; --g-hell:#BBF2DB; --g-main:#77E5B6; --g-dunkel:#16AAA1; --g-deep:#0B514D;
    --l-tint:#F4EBFF; --l-hell:#E4CCFF; --l-main:#A85CFF; --l-deep:#600FBD;
    --red:#C4314F;
    --page:#FBFBF9; --card:#FFFFFF; --grau:#F7F7F7; --hair:#E6E6E6; --g3:#BFBFBF; --soft:#595959; --ink:#1F1F1F;
    --r:8px;
    --head:60px;      /* la hauteur du bandeau du haut, avec le titre de l'écran (avant le 18 nov. 2026 : 96 px, avec le nom de l'activité) */
    --foot:66px;      /* la hauteur de la barre du bas (avant : 104 px) ; l'écran prend le reste : 900 − 72 − 76 = 752 px */
    --dash:#8C8C8C;   /* les traits pointillés et les points creux de la ligne de la leçon (3,3 : 1 sur blanc) */
  }
  .game .acts:empty { display: none; }
  .game .board { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
  .game .board.g-fade > * { animation: g-fade .35s both; }
  @keyframes g-fade { from { opacity: 0; } }
  .game .blabel { font: 500 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .foundbox { padding: 12px 18px; border-radius: var(--r); background: var(--g-tint); border: 1.5px solid var(--g-hell); font-size: 21px; line-height: 1.35; }
  .game .foundbox b { display: block; font: 600 17px/1.3 "Inter", system-ui, sans-serif; color: var(--g-deep); margin-bottom: 2px; }
  @keyframes g-shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* Étape 4 : la trace écrite, comme une page de cahier */
  .game .tboard { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; }
  .game .tshow { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: var(--r); background: var(--grau); animation: g-fade .4s both; }
  .game .tshow .pt { margin: 0; font: 600 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .tshow img { display: block; max-width: 100%; object-fit: contain; }
  .game .tfix { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; font-size: 24px; line-height: 1.35; }
  .game .tfix del { color: var(--red); }
  .game .tfix .arr { width: 30px; height: 30px; color: var(--soft); }
  .game .tfix b { padding: 10px 16px; background: var(--g-tint); border: 1.5px solid var(--g-dunkel); border-radius: var(--r); color: var(--g-deep); }
  .game .tpair { display: flex; gap: 16px; }
  .game .tpair figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 10px; background: #fff; border: 1px solid #d6d3c8; border-radius: 4px; }
  .game .tpair figcaption { font-size: 18px; font-weight: 600; color: var(--soft); }
  .game .trace { min-height: 0; background: #fff; border: 1px solid #d6d3c8; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.10); padding: 20px 28px 22px; }
  .game .trace .pt { margin: 0 0 14px; font: 600 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .trace ol { margin: 0; padding: 0 0 0 32px; display: grid; gap: 14px; }
  .game .trace li { font-size: 23px; line-height: 1.42; }
  .game .trace li::marker { font-family: "Inter", system-ui, sans-serif; font-weight: 600; color: var(--g-deep); }
  .game .trace li b { color: var(--g-deep); }
  .game .trace li.todo { color: var(--hair); }
  .game .trace li.todo::marker { color: var(--hair); }
  .game .trace li.new { animation: g-fade .5s cubic-bezier(.16, 1, .3, 1) both; }
  .game .idb { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .game .idb.wide { grid-template-columns: 1.55fr 1fr; }
  .game .idb .col1 { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .game .legend { padding: 16px 24px 20px; background: #fff; border: 1px solid #d6d3c8; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.10); }
  .game .legend .pt, .game .hints .pt { margin: 0 0 6px; font: 600 17px/1.3 "Inter", system-ui, sans-serif; color: var(--soft); }
  .game .legend .lt { font-size: 30px; line-height: 1.3; font-weight: 500; }
  .game .empty { color: var(--g3); font-size: 22px; } .game .empty.big { margin: auto; color: var(--soft); }
  .game .pairs { display: grid; gap: 8px; }
  .game .pair { display: flex; align-items: center; gap: 14px; padding: 6px 10px 6px 6px; background: var(--g-tint); border: 1px solid var(--g-hell); border-radius: var(--r); animation: g-fade .4s both; }
  .game .pair img { width: 84px; height: 56px; object-fit: cover; border-radius: 4px; }
  .game .pair b { display: block; font-size: 19px; font-weight: 600; color: var(--g-deep); } .game .pair span { display: block; font-size: 16px; line-height: 1.3; color: var(--soft); }
  .game .pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .game .pcard { display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 10px; border: 1px solid #d6d3c8; border-radius: 6px; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.08); text-align: center; transition: transform .15s, box-shadow .15s; }
  .game .pcard:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.12); }
  .game .pcard img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 3px; }
  .game .pcard .pn { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .game .pcard .pd { font-size: 15px; line-height: 1.3; color: var(--soft); }
  .game .pcard.sel { outline: 4px solid var(--l-main); outline-offset: 2px; }
  .game .pcard.no { border-color: var(--red); animation: g-shake .4s; }
  .game .pcard.used { opacity: .3; cursor: default; box-shadow: none; }
  @keyframes g-shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  /* Étape 2 : les indices, les 3 colonnes, les cartes à ranger */
  .game .hints { flex: none; padding: 10px 18px 12px; background: var(--grau); border-radius: var(--r); }
  .game .hints ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .game .hints li { font-size: 18px; line-height: 1.35; } .game .hints b { color: var(--g-deep); }
  .game .cols3 { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .game .ccol { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 10px 12px; border: 2px dashed var(--g3); border-radius: 12px; background: #fff; text-align: left; cursor: default; }
  .game .cols3.picking .ccol { cursor: pointer; border-color: var(--g-dunkel); } .game .cols3.picking .ccol:hover { background: var(--g-tint); border-style: solid; }
  .game .ch { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; }
  .game .cdot { flex: none; display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-right: 2px; }
  .game .cin { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .game .mini { width: calc(50% - 4px); display: flex; flex-direction: column; gap: 3px; font-size: 15px; font-weight: 600; line-height: 1.2; animation: g-fade .4s both; }
  .game .mini img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 4px; border: 1px solid var(--hair); }
  .game .foundbox.prop { flex: none; font-size: 19px; padding: 10px 16px; }
  .game .todo2 { flex: none; display: flex; align-items: center; gap: 14px; }
  .game .todo2 .blabel { flex: none; }
  .game .trow { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .game .trow .pcard { padding: 6px 6px 8px; } .game .trow .pcard img { aspect-ratio: 2 / 1; } .game .trow .pcard .pn { font-size: 17px; }
  /* Étapes 3 et 4 : le tableau des 24 cartes */
  .game .wall { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 1fr; gap: 8px; }
  .game .wcard { min-height: 0; display: flex; flex-direction: column; gap: 3px; padding: 4px 4px 5px; border: 1px solid #d6d3c8; border-radius: 5px; background: #fff; text-align: center; }
  .game .wcard img { width: 100%; flex: 1; min-height: 0; object-fit: cover; border-radius: 3px; }
  .game .wcard span { font-size: 13.5px; font-weight: 600; line-height: 1.15; }
  .game .wcard:hover { border-color: var(--g-dunkel); }
  .game .wcard.seen { background: var(--g-tint); border-color: var(--g-hell); }
  .game .wcard.sel { outline: 4px solid var(--l-main); outline-offset: 1px; }
  .game .qcol { justify-content: flex-start; }
  .game .qcard { display: flex; gap: 14px; align-items: center; padding: 8px; background: #fff; border: 1px solid #d6d3c8; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.08); }
  .game .qcard img { width: 150px; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 3px; }
  .game .qcard b { display: block; font-size: 22px; font-weight: 600; } .game .qcard span { display: block; font-size: 17px; line-height: 1.3; color: var(--soft); }
  .game .qa { border: 1.5px solid var(--g-deep); border-radius: var(--r); background: #fff; }
  .game .qa.on { border-color: var(--g-hell); background: var(--g-tint); }
  .game .qq { width: 100%; min-height: 58px; padding: 10px 16px; border: 0; background: none; text-align: left; font-size: 20px; font-weight: 600; color: var(--g-deep); }
  .game .qa:not(.on) .qq:hover { background: var(--g-tint); }
  .game .qr { padding: 0 16px 14px; font-size: 20px; line-height: 1.4; animation: g-fade .35s both; }
  .game .tagd { display: inline-block; padding: 2px 10px; margin-right: 4px; border-radius: 999px; font-size: 17px; font-weight: 600; background: #fff; border: 1px solid var(--g-hell); color: var(--g-deep); }
  .game .tagd.place { color: #8A4B00; border-color: #F2C98B; }
  .game .three { margin: 0; padding: 0 0 0 28px; display: grid; gap: 10px; }

/* ---------- French typography at display time: ’, and a non-breaking space before : ? ! ; » and after « ---------- */

const rec = (id, v, opt) => { scorm.record(id, v, opt); scorm.commit(); };

/* ---------- The cards: a photo and the name (as printed), small on the wall ---------- */
const card = id => CARDS.find(c => c.id === id);
const colOf = id => COLUMNS.find(c => c.id === id);
const pcard = (c, { attr = "", cls = "", legend = false } = {}) => `<button type="button" class="pcard ${cls}" ${attr}><img src="images/c-${c.id}.jpg" alt=""><span class="pn">${c.name}</span>${legend ? `<span class="pd">${c.desc}</span>` : ""}</button>`;
const dot = col => `<span class="cdot" style="background:${colOf(col).dot}"></span>`;
function wall(attrName, selected = new Set(), marked = new Set()) {
  return `<div class="wall">${CARDS.map(c => `<button type="button" class="wcard ${selected.has(c.id) ? "sel" : ""} ${marked.has(c.id) ? "seen" : ""}" ${attrName}="${c.id}" aria-pressed="${selected.has(c.id)}">
    <img src="images/c-${c.id}.jpg" alt=""><span>${c.name}</span></button>`).join("")}</div>`;
}

/* ============ Step 1: a legend is read on the board, the group finds its card ============ */
const S1 = { k: 0, tries: [], msg: null };
function r1() {
  const finished = S1.k === LEGEND_ORDER.length, on = finished ? null : card(LEGEND_ORDER[S1.k]);
  const matched = LEGEND_ORDER.slice(0, S1.k).map(card);
  board(`<div class="idb">
    <div class="col1">
      ${on ? `<div class="legend"><p class="pt">${S1_LABELS.legend}</p><p class="lt">${on.desc}</p></div>` : ""}
      <p class="blabel">${S1_LABELS.board}</p>
      <div class="pairs">${matched.map(c => `<div class="pair"><img src="images/c-${c.id}.jpg" alt=""><div><b>${c.name}</b><span>${c.desc}</span></div></div>`).join("") || `<p class="empty">…</p>`}</div>
    </div>
    <div class="col1"><p class="blabel">${S1_LABELS.group}${finished ? "" : ` · ${S1_LABELS.left(LEGEND_ORDER.length - S1.k)}`}</p>
      <div class="pcards">${GROUP_CARDS.map(id => { const c = card(id), used = LEGEND_ORDER.indexOf(id) < S1.k;
        return pcard(c, { attr: `data-match="${id}" ${used ? "disabled" : ""}`, cls: used ? "used" : S1.tries.at(-1) === id && S1.msg === SAY1.wrong ? "no" : "" }); }).join("")}</div></div></div>`);
  if (!finished) return classe({ now: S1.msg || SAY1.pick.now, say: SAY1.pick.say });
  classe(SAY1.end);
}
function s1click(e) {
  const b = e.target.closest("[data-match]"); if (!b || b.disabled || S1.k >= LEGEND_ORDER.length) return;
  const id = b.dataset.match, want = LEGEND_ORDER[S1.k];
  S1.tries.push(id);
  if (id !== want) { S1.msg = SAY1.wrong; return render(); }
  S1.k++;
  S1.msg = S1.k < LEGEND_ORDER.length ? SAY1.next(card(id).name) : null;
  if (S1.k === LEGEND_ORDER.length) { rec("associations", S1.tries.join(" "), { result: S1.tries.length === LEGEND_ORDER.length ? "correct" : "wrong" }); finishStep(1); }
  render();
}

/* ============ Step 2: the three columns and the hints; each card goes into the column the class chooses, then our proposal ============ */
const S2 = { sel: null, placed: {}, last: null, msg: null };
function r2() {
  const left = GROUP_CARDS.filter(id => !S2.placed[id]), finished = !left.length;
  const last = S2.last && card(S2.last), mine = last && S2.placed[last.id];
  board(`<div class="hints"><p class="pt">${S2_LABELS.hints}</p><ul>${HINTS.map(h => `<li>${h}</li>`).join("")}</ul></div>
    <div class="cols3 ${S2.sel ? "picking" : ""}">${COLUMNS.map(col => `<button type="button" class="ccol" data-col="${col.id}" ${S2.sel ? "" : "tabindex=\"-1\""}>
      <span class="ch">${dot(col.id)}${col.label}</span>
      <span class="cin">${GROUP_CARDS.filter(id => S2.placed[id] && card(id).col === col.id).map(id => `<span class="mini"><img src="images/c-${id}.jpg" alt=""><span>${card(id).name}</span></span>`).join("")}</span></button>`).join("")}</div>
    ${last ? `<div class="foundbox prop"><b>${last.name} · ${mine === last.col ? `${S2_LABELS.same} : ${colOf(last.col).label}` : `${S2_LABELS.yours} : ${colOf(mine).label} · ${S2_LABELS.ours} : ${colOf(last.col).label}`}</b>${last.why}</div>` : ""}
    ${finished ? "" : `<div class="todo2"><p class="blabel">${S2_LABELS.todo}</p><div class="trow">${left.map(id => pcard(card(id), { attr: `data-pick="${id}" aria-pressed="${S2.sel === id}"`, cls: S2.sel === id ? "sel" : "" })).join("")}</div></div>`}`);
  if (!finished) return classe(S2.last && !S2.sel ? SAY2.placed : { now: S2.msg || SAY2.pick.now, say: SAY2.pick.say });
  classe(SAY2.end);
}
function s2click(e) {
  const p = e.target.closest("[data-pick]"), c = e.target.closest("[data-col]");
  if (p) { S2.sel = S2.sel === p.dataset.pick ? null : p.dataset.pick; S2.msg = S2.sel ? SAY2.col : null; return render(); }
  if (c && S2.sel) {
    const id = S2.sel, choice = c.dataset.col;
    S2.placed[id] = choice; S2.last = id; S2.sel = null; S2.msg = null;
    rec(`colonne_${id}`, choice, { result: choice === card(id).col ? "correct" : "wrong" });
    if (GROUP_CARDS.every(g => S2.placed[g])) finishStep(2);
    render();
  }
}

    <div class="col1"><p class="blabel">${S3_LABELS.wall} · ${S3_LABELS.count(discussed(), S3_NEED)}</p>${wall("data-card", new Set(c ? [c.id] : []), new Set(Object.keys(S3.open).filter(k => S3.open[k].size === 2)))}</div>
    <div class="col1 qcol">${c ? `<div class="qcard"><img src="images/c-${c.id}.jpg" alt=""><div><b>${c.name}</b><span>${c.desc}</span></div></div>
      ${qa(S3_LABELS.q1, 1, `<b class="tagd ${c.del}">${S3_LABELS.del[c.del]}</b> ${c.delWhy}`)}${qa(S3_LABELS.q2, 2, c.panne)}`
      : `<p class="empty big">${S3_LABELS.empty}</p>`}</div></div>`);
  if (discussed() >= S3_NEED && !(c && o.size < 2)) return classe(SAY3.end);
  classe({ now: S3.msg || SAY3.pick.now, say: SAY3.pick.say });
}
function s3click(e) {
  const w = e.target.closest("[data-card]"), q = e.target.closest("[data-q]");
  if (w) { S3.on = w.dataset.card; S3.open[S3.on] ||= new Set(); S3.msg = null; return render(); }
  if (q && S3.on) {
    S3.open[S3.on].add(+q.dataset.q);
    const n = discussed();
    S3.msg = S3.open[S3.on].size < 2 ? SAY3.more : n < S3_NEED ? SAY3.again : null;
    rec("cartes_discutees", Object.keys(S3.open).filter(k => S3.open[k].size === 2).join(" "));
    if (n >= S3_NEED) finishStep(3);
    render();
  }
}

/* ============ Step 4: the group chooses the 3 most useful machines ============ */
const S4 = { chosen: [] };
function r4() {
  const full = S4.chosen.length === 3;
  board(`<div class="idb wide">
    <div class="col1"><p class="blabel">${S4_LABELS.wall}</p>${wall("data-useful", new Set(S4.chosen))}</div>
    <div class="col1 qcol"><p class="blabel">${S4_LABELS.mine}</p><ol class="three">${[0, 1, 2].map(k => { const c = S4.chosen[k] && card(S4.chosen[k]);
      return c ? `<li><img src="images/c-${c.id}.jpg" alt=""><b>${c.name}</b></li>` : `<li class="todo">${S4_LABELS.slot}</li>`; }).join("")}</ol>
      ${full ? `<div class="foundbox"><b>${S4_LABELS.say}</b>${S4_LABELS.because}</div>` : ""}</div></div>`);
  classe(full ? SAY4.end : SAY4.pick);
}
function s4click(e) {
  const w = e.target.closest("[data-useful]"); if (!w) return;
  const id = w.dataset.useful, k = S4.chosen.indexOf(id);
  if (k >= 0) S4.chosen.splice(k, 1); else if (S4.chosen.length < 3) S4.chosen.push(id); else return;
  if (S4.chosen.length === 3) { rec("plus_utiles", S4.chosen.join(" ")); finishStep(4); }
  render();
}

/* ============ Step 5: the class writes the trace écrite, one line at a time ============ */
const S5 = { shown: 0, fresh: false };
function r5() {
  const k = Math.min(S5.shown, TRACE.length - 1);
  board(`<div class="tboard"><div class="trace"><p class="pt">${TRACE_LABEL}</p><ol>${TRACE.map((t, j) => j < S5.shown
    ? `<li class="${S5.fresh && j === S5.shown - 1 ? "new" : ""}">${t.a}</li>` : `<li class="todo">…</li>`).join("")}</ol></div>
    <div class="tshow" aria-live="polite"><div class="tpair">${TRACE[k].show.map(id => { const c = card(id);
      return `<figure><img src="images/c-${id}.jpg" alt=""><figcaption>${dot(c.col)}${c.name}</figcaption></figure>`; }).join("")}</div></div></div>`);
  S5.fresh = false;
  if (S5.shown < TRACE.length) return classe({ now: SAY5.line(S5.shown + 1).now, say: TRACE[S5.shown].q }, [["write", BTN.write(S5.shown + 1)]]);
  classe(SAY5.end);
}
function writeLine() {
  if (S5.shown >= TRACE.length) return;
  S5.shown++; S5.fresh = true;
  if (S5.shown === TRACE.length) { rec("trace_ecrite", String(S5.shown)); finishStep(5); }
  render();
}


/* ---------- Screens: ? Pourquoi · Avant la séance · the 5 steps · ✓ Fin (before 26 Nov 2026: 11 screens) ---------- */
const SCREENS = [{ id: "why" }, { id: "prep" }, ...STEPS.map(s => ({ id: "step", step: s.n })), { id: "end" }];
const MARKS = { why: "?", prep: "✎", end: "✓" };
const stepAt = n => 1 + n, LAST = STEPS.length;
let cur = 0;
const seen = new Set(), done = new Set(), introSeen = new Set();
const frame = Frame.init({ guide: "Léo", pose: "leo", now: 1, onStep: k => go(k - 1),
  steps: SCREENS.map(S => S.step ? { mark: S.step, label: `Étape ${S.step} · ${STEPS[S.step - 1].min}&nbsp;min` } : { mark: MARKS[S.id], label: SCREEN_LABELS[S.id] }) });
const { scorm } = frame;
const talk = t => frame.talk({ ...t, say: nb(t.say || ""), more: nb(t.more || ""), keep: (t.keep || []).map(nb), replies: (t.replies || []).map(([l, a, g]) => [nb(l), a, g]) });
const INTRO_CODE = { intro: 1, notions: 2, prep: 3, plan: 4, simp: 5 };   // the numbers recorded in intro_vue (unchanged)
const sawIntro = (...ids) => { const before = introSeen.size; ids.forEach(id => introSeen.add(INTRO_CODE[id])); if (introSeen.size > before) rec("intro_vue", [...introSeen].sort().join(" ")); };

const isDone = k => k !== cur && (SCREENS[k].step ? done.has(SCREENS[k].step) : seen.has(k));
const canNext = () => { const S = SCREENS[cur]; if (S.id === "end") return false; return S.step ? done.has(S.step) : true; };
function drawSteps() { frame.steps(cur + 1, k => ({ done: isDone(k - 1), can: seen.has(k - 1) || !!SCREENS[k - 1].step })); }
function go(i) {
  try { scorm.set("cmi.core.lesson_location", String(i)); scorm.commit(); } catch {}   // the screen, for coming back (as in Modules 1 and 2)
  closeLb(false);
  cur = i; seen.add(i); me = null;
  const S = SCREENS[i];
  $("#desk").scrollTop = 0;
  if (S.id === "why") { sawIntro("intro", "notions"); drawWhy(); }
  else if (S.id === "prep") { sawIntro("prep", "plan"); drawPrep(); }
  else if (S.id === "end") drawEnd(false);
  else { drawStepDesk(); render(); }
  drawSteps();
}
function finishStep(n) {
  if (done.has(n)) return;
  done.add(n);
  if (n === LAST && scorm.get("cmi.core.lesson_status") !== "completed") { scorm.set("cmi.core.lesson_status", "completed"); scorm.commit(); }
  drawSteps();
}

/* ---------- A step: the board (the game, scaled to the desk), its buttons under it, the Consigne card; Léo says what you do ---------- */
const BOARD_W = 1176, BOARD_H = 620, BOARD_H_MAX = 980;   // the board's own width; its height follows the desk
function drawStepDesk() {
  $("#desk").innerHTML = `<p class="rotate">${nb(ROTATE_MSG)}</p><aside class="card-consigne" id="consigne"><span class="lab">${CONSIGNE_LABEL}</span><p id="consigne-t"></p></aside><div class="boardwin" id="win"><div class="game" id="game" style="width:${BOARD_W}px;height:${BOARD_H}px"><div class="board" id="board" aria-label="Le jeu"></div></div></div>
    <div class="under"><span class="grow"></span><div id="acts" aria-label="Actions du jeu"></div></div>`;
  fit();
  // the Consigne card above the board changes height with each step's text: fit the board again (layout brief, 26 Nov 2026)
  if (window.ResizeObserver) { fitRO?.disconnect(); fitRO = new ResizeObserver(() => fit()); fitRO.observe($("#consigne")); }
}
var fitRO = null;   // var: drawStepDesk can run before this line (Frame.init calls it)
function fit() {   // the board keeps its width (scaled to the desk) and takes all the height left on the desk (since 26 Nov 2026: no empty band under it)
  const win = $("#win"), g = $("#game"); if (!win || !g) return;
  const phone = innerWidth <= 760;
  win.style.flex = ""; win.style.height = "";
  const W = win.clientWidth, s = Math.min(1, W / BOARD_W);
  const h = phone ? BOARD_H : Math.min(BOARD_H_MAX, Math.max(BOARD_H, win.clientHeight / s));
  const s2 = phone ? s : Math.min(s, win.clientHeight / h);
  g.style.height = `${h}px`;
  g.style.transform = `scale(${s2})`;
  g.style.left = `${Math.max(0, (W - BOARD_W * s2) / 2)}px`;
  win.style.flex = "none"; win.style.height = `${h * s2}px`;
}
addEventListener("resize", fit);
$(".stage").addEventListener("transitionend", e => { if (e.propertyName === "grid-template-columns") fit(); });

let last = null, me = null;   // the step's current line and buttons; the « Demande à Léo » answer open in his bubble (null = none)
const nextLabel = () => SCREENS[cur].step === LAST ? BTN.finish : BTN.nextStep;
function classe(t, acts = []) {
  last = { t, acts };
  put($("#acts"), acts.map(([act, label, kind = "primary"]) => `<button type="button" class="chip ${kind === "primary" ? "go" : ""}" data-act="${act}">${label}</button>`).join(""));
  if (!me) showStep();
}
function showStep() {
  const { t } = last, n = SCREENS[cur].step;
  $("#consigne").hidden = !t.say; put($("#consigne-t"), t.say || "");
  talk({ pose: done.has(n) ? "ouvre" : t.now === SAY1.wrong ? "pense" : "ouvre", say: t.now, lead: ASK_LEAD,
    wait: canNext() ? "" : nextLabel(),
    replies: [...(canNext() ? [[nextLabel(), () => go(cur + 1), true]] : []),
              ...meTabs(n).map(k => [ME_CHIPS[k], () => openMe(k)]), [SHORT_CHIP, () => openShort()]] });
}
function board(html) { put($("#board"), html); }
function render() { const n = SCREENS[cur].step; if (!n) return; [r1, r2, r3, r4, r5][n - 1](); }

/* ---------- « Demande à Léo »: the texts of the old drawer « Pour comprendre », answered in Léo's bubble ---------- */
const TAB_KEY = { why: "pourquoi", ideas: "idees", simp: "simp" };
const meTabs = n => ["why", "ideas", ...(SIMP.some(s => s.at.includes(n)) || HELP[n - 1].more ? ["simp"] : [])];
const meOpened = [], ideaSeen = new Set(), simpSeen = new Set();
const back = () => [BACK_LABEL, () => { me = null; showStep(); }];
function openMe(tab) {
  const n = SCREENS[cur].step, item = `${n}:${TAB_KEY[tab]}`;
  if (!meOpened.includes(item)) { meOpened.push(item); rec("pourtoi_ouvert", meOpened.join(" ")); }
  me = { tab, k: 0 }; drawMe();
}
function drawMe() {
  const n = SCREENS[cur].step, h = HELP[n - 1], { tab, k } = me;
  if (tab === "why") return talk({ pose: "pense", say: h.why, more: `<h4>${ME_LBL.anne}</h4><p>${h.anne}</p>`, replies: [back()] });
  if (tab === "ideas") {
    const d = h.ideas[k], turned = ideaSeen.has(`${n}:${k}`), lastIdea = k === h.ideas.length - 1;
    return talk({ pose: turned ? "ouvre" : "pense", say: `${ME_LBL.kidSays} ${d.idea}`,
      more: turned ? `${d.because ? `<p><b>${ME_LBL.because}&nbsp;:</b> ${d.because}</p>` : ""}<p><b>${ME_LBL.fact}&nbsp;:</b> ${d.fact}</p>${lastIdea ? `<p><b>${ME_LBL.ask}&nbsp;:</b> ${h.ask}</p><p><b>${ME_LBL.useT}&nbsp;:</b> ${h.use}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${h.avoid}</p>` : ""}`
        : IDEA_ASK,
      replies: [...(!turned ? [[IDEA_SHOW, () => { ideaSeen.add(`${n}:${k}`); rec("idees_retournees", [...ideaSeen].join(" ")); drawMe(); }]]
        : !lastIdea ? [[NEXT_IDEA(k + 2, h.ideas.length), () => { me.k++; drawMe(); }]] : []), back()] });
  }
  const rows = SIMP.filter(s => s.at.includes(n));
  if (!rows.length || k >= rows.length) return talk({ pose: "pense", say: ME_LBL.more, more: h.more, replies: [back()] });
  const r = rows[k], flipped = simpSeen.has(`${n}:${k}`), lastCard = k === rows.length - 1;
  talk({ pose: "pense", say: `${ME_LBL.inGame}&nbsp;: ${r.game}`,
    more: flipped ? `<p><b>${ME_LBL.ai}&nbsp;:</b> ${r.ai}</p>${r.risk ? `<p><b>${ME_LBL.risk}&nbsp;:</b> ${r.risk}</p>` : ""}${lastCard && h.more ? `<h4>${ME_LBL.more}</h4><p>${h.more}</p>` : ""}` : SIMP_ASK,
    replies: [...(!flipped ? [[FLIP, () => { simpSeen.add(`${n}:${k}`); rec("simp_retournees", [...simpSeen].join(" ")); drawMe(); }]]
      : !lastCard ? [[NEXT_CARD(k + 2, rows.length), () => { me.k++; drawMe(); }]] : []), back()] });
}
// « Peu de temps ? » on a step: the step in the 25-minute lesson, what to keep and what can be shortened
function openShort() {
  const n = SCREENS[cur].step, h = HELP[n - 1], [t, d] = SHORT[n - 1];
  me = { tab: "short", k: 0 };
  talk({ pose: "pense", say: `${SHORT_TITLE}&nbsp;: ${t}`, more: `<p>${d}</p><p><b>${ME_LBL.keep}&nbsp;:</b> ${h.keep}</p><p><b>${TAGS.short}&nbsp;:</b> ${h.cut}</p>`, replies: [back()] });
}

/* ============ ? Pourquoi · Avant la séance · ✓ Fin ============ */
function drawWhy() {
  put($("#desk"), `<h2 class="dt">${NOTIONS_TITLE}</h2><div class="notions">${NOTIONS.map(c => `<div class="ncard paper"><h3>${c.term}</h3><p>${c.def}</p></div>`).join("")}</div><p class="after">${NOTIONS_AFTER}</p>`);
  const tale = () => talk({ pose: "ouvre", say: WHY_Q, more: `${TALE_DRAFT ? `<p><b>${TALE_DRAFT}</b></p>` : ""}${TALE.map(p => `<p>${p}</p>`).join("")}`,
    replies: [[WHY_NEXT, () => go(1), true], [IDEA_LABEL, () => talk({ pose: "pense", say: IDEA_LABEL, more: IDEA, replies: [[BACK_PREP, tale]] })]] });
  tale();
}
function drawPrep() {
  put($("#desk"), `<div class="plan">${STEPS.map(s => `<button type="button" class="stepc ${done.has(s.n) ? "done" : ""}" data-goto="${stepAt(s.n)}">
      <span class="sn"><i>${s.n}</i>${s.min} min${done.has(s.n) ? ` · ${DONE_MARK}` : ""}</span><h3>${s.title}</h3><p>${s.found}</p>${s.ess ? "" : `<span class="short">${TAGS.short}</span>`}</button>`).join("")}</div>
    <p class="total">${PLAN_SUB}</p>
    <div class="prep">
      <div class="mat paper"><h3>${BEFORE_TITLE}</h3><ul>${BEFORE_MAT.map(([b, t]) => `<li><b>${b}</b>&nbsp;: ${t}</li>`).join("")}</ul></div>
      <div class="side">
        <button type="button" class="thumb paper" data-act="sheet"><img src="${CARDS_IMG}" alt="">${BTN.sheetShort}</button>
        <div class="pdfs"><a class="tool" href="${CARDS_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.sheetPdf}</a><a class="tool" href="${GUIDE_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.guide}</a></div>
        <aside class="card-consigne"><span class="lab">${CONSIGNE_LABEL}</span><p>${BEFORE_SAY}</p></aside>
      </div></div>`);
  const main = () => talk({ pose: "ouvre", say: BEFORE_TITLE, more: BEFORE_NOTE,
    replies: [[PREP_NEXT, () => go(stepAt(1)), true], [SHORT_TITLE, short], [WORDS_TITLE, words]] });
  const short = () => talk({ pose: "pense", say: SHORT_TITLE, keep: SHORT.map(([t, d]) => `<span><b>${t}</b>&nbsp;: ${d}</span>`), more: `<p>${SHORT_KEEP}</p><p>${LONG}</p>`, replies: [[BACK_PREP, main]] });
  const words = () => talk({ pose: "ouvre", say: WORDS_TITLE, more: `<p><b>${ME_LBL.useT}&nbsp;:</b> ${WORDS_USE}</p><p><b>${ME_LBL.avoidT}&nbsp;:</b> ${WORDS_AVOID}</p><p><b>${LINK_LABEL}&nbsp;:</b> ${LINK_TEXT}</p>`, replies: [[BACK_PREP, main]] });
  main();
}
function drawEnd(table) {
  if (table) {
    sawIntro("simp");
    put($("#desk"), `<h2 class="dt">${SIMP_TITLE}</h2><div class="scroll"><table class="simp"><thead><tr><th>${SIMP_HEAD[0]}</th><th>${SIMP_HEAD[1]}</th><th class="ai">${SIMP_HEAD[2]}</th></tr></thead>
      <tbody>${SIMP.map(s => `<tr><td>${s.game}<span class="st">${s.step}</span></td><td>${s.why}</td><td class="ai">${s.ai}</td></tr>`).join("")}</tbody></table></div><p class="after">${SIMP_AFTER}</p>`);
  } else {
    const SAYS = { 1: SAY1.pick.say, 2: SAY2.pick.say, 3: SAY3.pick.say, 4: SAY4.pick.say, 5: TRACE[0].q };   // each step's first line to the class
    const total = STEPS.reduce((t, s) => t + s.min, 0);
    put($("#desk"), `<article class="lesson paper">
      <header class="ls-head"><h2>${SHEET_HEAD}</h2><span>${SHEET_META(total)}</span></header>
      <ol class="ls-steps">${STEPS.map(s => `<li><button type="button" class="ls-step ${done.has(s.n) ? "done" : ""}" data-goto="${stepAt(s.n)}" title="${OPEN_STEP}">
        <i>${done.has(s.n) ? "✓" : s.n}</i><span class="ls-body"><b>${s.title}</b><small>${s.min}&nbsp;min</small><span class="ls-found">${s.found}</span>
        ${SAYS[s.n] ? `<span class="ls-say"><em>${CONSIGNE_LABEL}</em> ${SAYS[s.n]}</span>` : ""}</span></button></li>`).join("")}</ol>
      <aside class="ls-mat"><h3>${MATERIAL}</h3>
        <button type="button" class="ls-sheet" data-act="sheet"><img src="${CARDS_IMG}" alt="">${BTN.sheet}</button>
        <a class="tool" href="${CARDS_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.sheetPdf}</a><a class="tool" href="${GUIDE_PDF}" target="_blank" rel="noopener">${icon("pdf")}${BTN.guide}</a></aside>
    </article>`);
  }
  talk({ pose: "ouvre", say: END_TITLE, keep: TAKEAWAY.map(t => `<span>${t}</span>`),
    replies: [[BACK_TO_Q, BACK_URL, true], table ? [SIMP_BACK, () => drawEnd(false)] : [SIMP_BTN, () => drawEnd(true)], [BTN.again, again]] });
}

/* ---------- The printed cards, large ---------- */
let lbOpener = null;
function openLb(btn) { lbOpener = btn || document.activeElement; $("#lb-img").src = CARDS_IMG; $("#lb-img").alt = nb("Les cartes Identif'IA"); $("#lightbox").hidden = false; setTimeout(() => $("#lb-close").focus({ preventScroll: true }), 30); }
function closeLb(refocus = true) { if ($("#lightbox").hidden) return; $("#lightbox").hidden = true; if (refocus && lbOpener && document.contains(lbOpener)) lbOpener.focus({ preventScroll: true }); }

/* ---------- Clicks ---------- */
function again() {
  Object.assign(S1, { k: 0, tries: [], msg: null }); Object.assign(S2, { sel: null, placed: {}, last: null, msg: null });
  Object.assign(S3, { on: null, open: {}, msg: null }); S4.chosen = []; Object.assign(S5, { shown: 0, fresh: false });
  done.clear(); seen.clear();
  go(0);
}
const ACT = { again, sheet: b => openLb(b), write: () => writeLine() };
$("#desk").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) { if (a.dataset.act !== "sheet") me = null; return ACT[a.dataset.act](a); }
  const g = e.target.closest("[data-goto]"); if (g && !g.disabled) return go(+g.dataset.goto);
  const n = SCREENS[cur].step; if (!n) return;
  if (e.target.closest("[data-match], [data-pick], [data-col], [data-card], [data-q], [data-useful]")) me = null;
  [s1click, s2click, s3click, s4click][n - 1]?.(e);
});
$("#lb-close").addEventListener("click", () => closeLb());
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLb(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

/* Coming back: where the teacher was (completed: the last screen), as in Modules 1 and 2 */
{ const saved = parseInt(scorm.get("cmi.core.lesson_location"), 10), lastScr = SCREENS.length - 1;
  go(scorm.get("cmi.core.lesson_status") === "completed" ? lastScr : saved >= 0 && saved <= lastScr ? saved : 0); }
</script>
<script src="../../config.js" defer></script>
<script src="../../relecture.js" defer></script>
</body>
